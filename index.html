  const a=blStats(A),b=blStats(B);const dec=blDir(p)!=='늘리기';const goal=blNum(p.procs.baseline.data.goal);const unit=p.procs.define.data.unit||'';

  const ch=a.mean?Math.round((b.mean-a.mean)/a.mean*100):null;

  const rows=[['기초선 평균',`${rnd(a.mean)}${unit?' '+unit:''} (${a.n}회기)`],['중재 평균',`${rnd(b.mean)}${unit?' '+unit:''} (${b.n}회기)`],

  if(goal!=null)rows.push(['목표',`${rnd(goal)} — 최근 ${last.length}회기 ${met?'모두 충족':'모두 충족하지는 못함'}`]);
  const html=`<dl class="bl-cmp">${rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><p class="hint">PND 70% 이상 효과적</p>`;
  const text=`기초선 평균 ${rnd(a.mean)}(${a.n}회기) → 중재 평균 ${rnd(b.mean)}(${b.n}회기)${ch!=null?`, ${ch>0?'+':''}${ch}%`:''}. PND ${pnd}%.${goal!=null?` 목표 ${rnd(goal)}: 최근 ${last.length}회기 ${met?'모두 충족':'일부 미충족'}.`:''}`;
  return {html,text};
}

/* ---------- recorder ---------- */
/* 녹음은 '구간(segment)' 단위로 저장한다. 관찰지가 바뀌면 같은 마이크 스트림에서
   새 구간을 먼저 시작하고 이전 구간을 정지해, 끊김 없이 관찰지마다 파일이 나뉜다. */
const rec={state:'idle',stream:null,seg:null,timer:null,wake:null};
function pickMime(){
  if(typeof MediaRecorder==='undefined'||!MediaRecorder.isTypeSupported)return '';
  return ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}})||'';
}
function micHelpHTML(reason){
  const head={
    NotAllowedError:'마이크를 사용할 수 없습니다.',
    SecurityError:'마이크를 사용할 수 없습니다.',
    NotFoundError:'마이크를 찾지 못했습니다. 마이크가 연결되어 있는지 확인하세요.',
    NotReadableError:'다른 앱이 마이크를 쓰고 있어 녹음을 시작하지 못했습니다.',
    unsupported:'이 브라우저는 녹음을 지원하지 않습니다.',
    nostore:'이 브라우저에서는 녹음 파일을 저장할 수 없습니다.'
  }[reason]||'녹음을 시작하지 못했습니다.';
  return `<b>${head}</b>
  <span>· 브라우저가 마이크 권한을 물으면 '허용'을 누르세요. 이미 거부했다면 주소창 왼쪽의 사이트 설정에서 마이크를 허용으로 바꾼 뒤 새로고침하세요.</span>
  <span>· Claude 화면 안에서 이 페이지를 열었다면 그 안에서는 마이크가 막혀 있습니다. 이 파일을 HTTPS 주소(예: GitHub Pages)에 올려 크롬이나 사파리로 열면 바로 녹음할 수 있습니다.</span>
  <span>· 지금 바로 쓰려면 휴대폰 녹음 앱으로 녹음한 뒤 '녹음 파일 첨부'로 붙이세요.</span>`;
}
function showMicHelp(reason){
  ui.micHelp=micHelpHTML(reason);
  const el=$('#mic-help');if(el){el.innerHTML=ui.micHelp;el.hidden=false;}
  else toast('녹음을 시작하지 못했습니다');
}
function newSegment(target){
  const mime=pickMime();let mr;
  try{mr=mime?new MediaRecorder(rec.stream,{mimeType:mime}):new MediaRecorder(rec.stream);}
  catch(e){mr=new MediaRecorder(rec.stream);}
  const seg={mr,chunks:[],target,startedAt:Date.now(),startISO:nowISO(),done:false};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)seg.chunks.push(e.data);};
  mr.onstop=()=>finishSegment(seg);
  mr.onerror=()=>{toast('녹음 중 오류가 생겼습니다. 지금까지 녹음한 부분을 저장합니다.');try{mr.stop();}catch(e){finishSegment(seg);}};
  mr.start(1000);
  return seg;
}
/* resolveTarget: 마이크를 얻은 뒤에 호출되어 {projectId, sheetId}를 돌려준다 */
async function startRecording(resolveTarget){
  if(rec.state!=='idle'){toast('이미 녹음 중입니다. 먼저 정지하세요.');return;}
  if(!audioOK){showMicHelp('nostore');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){showMicHelp('unsupported');return;}
  rec.state='starting';updateRecUI();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){rec.state='idle';updateRecUI();showMicHelp(e&&e.name);return;}
  rec.stream=stream;
  let seg;
  try{seg=newSegment(resolveTarget());}
  catch(e){stream.getTracks().forEach(t=>t.stop());rec.stream=null;rec.state='idle';updateRecUI();showMicHelp('unsupported');return;}
  ui.micHelp='';const mh=$('#mic-help');if(mh)mh.hidden=true;
  rec.seg=seg;rec.state='recording';
  stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>{if(rec.state==='recording'&&rec.stream===stream)stopRecording();}));
  clearInterval(rec.timer);rec.timer=setInterval(updateRecUI,500);
  requestWake();updateRecUI();
}
function stopRecording(){
  if(rec.state!=='recording')return;
  rec.state='stopping';updateRecUI();
  const seg=rec.seg;try{seg.mr.stop();}catch(e){finishSegment(seg);}
}
/* 관찰지가 바뀔 때: 진행 중이던 녹음은 이전 관찰지에 저장하고, 새 관찰지로 이어서 녹음 */
function rolloverRecording(target){
  if(rec.state!=='recording'||!rec.seg)return;
  const old=rec.seg;let seg;
  try{seg=newSegment(target);}catch(e){stopRecording();return;}
  rec.seg=seg;
  try{old.mr.stop();}catch(e){finishSegment(old);}
  updateRecUI();
}
async function finishSegment(seg){
  if(seg.done)return;seg.done=true;
  const dur=(Date.now()-seg.startedAt)/1000;
  const type=(seg.mr&&seg.mr.mimeType)||pickMime()||'audio/webm';
  const blob=new Blob(seg.chunks,{type});seg.chunks=[];
  const last=rec.seg===seg;
  if(last){
    clearInterval(rec.timer);rec.timer=null;
    if(rec.stream)rec.stream.getTracks().forEach(t=>t.stop());
    Object.assign(rec,{stream:null,seg:null,state:'idle'});
    releaseWake();
  }
  updateRecUI();
  if(!blob.size){if(last)toast('녹음된 소리가 없어 저장하지 않았습니다');return;}
  await attachAudio(seg.target,blob,dur,seg.startISO,!last);
}
async function attachAudio(target,blob,duration,createdAt,quiet){
  const p=projById(target.projectId);
  if(!p){toast('프로젝트를 찾을 수 없어 녹음을 저장하지 못했습니다');return;}
  const id=uid('a');
  try{await AudioDB.put(id,p.id,blob,duration,createdAt);}
  catch(e){toast('녹음을 저장하지 못했습니다. 저장 공간을 확인하세요.');return;}
  const a=abcData(p);
  a.audio[id]={duration:duration||null,mime:blob.type,createdAt,size:blob.size};
  let sh=target.sheetId?sheetById(p,target.sheetId):null;
  let created=false;
  if(!sh){
    sh=makeSheet(p,uid('one'),createdAt,null);
    sh.endedAt=new Date(Date.parse(createdAt)+(duration||0)*1000).toISOString();
    a.sheets.push(sh);created=true;
  }
  sh.audioIds.push(id);sh.updatedAt=nowISO();
  touch(p,'abc');saveNow();persistStorage();
  if(onAbcPage(p)){
    const box=$('#aud-'+sh.id);
    if(box&&!created){box.innerHTML=sheetAudio(p,sh);const h=$('#shh-'+sh.id);if(h)h.innerHTML=sheetHead(p,sh);hydrateAudio();refreshSummary(p);}
    else renderAbcAll();
  }
  if(!quiet)toast(created?'녹음만 있는 관찰지를 새로 만들어 저장했습니다':'녹음을 관찰지에 저장했습니다');
  updateUsage();
}
function recTargetText(){

/* dictation */
let dict=null,dictSid=null;
function stopDictation(){if(dict){try{dict.stop();}catch(e){}dict=null;}dictSid=null;}
function toggleDictation(sid){
  if(!SR){toast('이 브라우저는 받아쓰기를 지원하지 않습니다');return;}
  if(dict){const was=dictSid;stopDictation();updDict();if(was===sid)return;}
  const p=curProject();if(!p)return;
  const r=new SR();r.lang='ko-KR';r.continuous=true;r.interimResults=false;
  r.onresult=e=>{
    let txt='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)txt+=e.results[i][0].transcript;
    txt=txt.trim();if(!txt)return;
    const sh=sheetById(p,sid);if(!sh)return;
    sh.note=sh.note?sh.note.replace(/\s*$/,' ')+txt:txt;sh.updatedAt=nowISO();
    const ta=$('#sf-'+sid+'-note');if(ta)ta.value=sh.note;touch(p,'abc');
  };
  r.onerror=e=>{toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'마이크 권한이 없어 받아쓰기를 할 수 없습니다':e.error==='network'?'받아쓰기는 인터넷 연결이 필요합니다':'받아쓰기가 멈췄습니다 ('+e.error+')');};
  r.onend=()=>{if(dict===r){dict=null;dictSid=null;}updDict();};
  try{r.start();dict=r;dictSid=sid;}catch(e){dict=null;dictSid=null;toast('받아쓰기를 시작하지 못했습니다');}
  updDict();
}
function updDict(){$$('[data-act="dictate"]').forEach(b=>{b.textContent=dictSid===b.dataset.sid?'받아쓰기 멈춤':'받아쓰기 (말로 입력)';});}

/* ---------- files ---------- */
async function offerFile(filename,blob){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){
        try{await dl.save({filename,data:blob});return true;}
        catch(e){
          if(e&&e.code==='declined'){toast('저장을 취소했습니다');return false;}
          if(e&&e.code==='rejected_extension'){toast('이 화면에서는 이 형식의 파일을 저장할 수 없습니다');return false;}
          toast('파일을 저장하지 못했습니다'+(e&&e.message?': '+e.message:''));return false;
        }
      }
    }
  }catch(e){}
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);return true;
  }catch(e){toast('파일을 저장하지 못했습니다');return false;}
}
function blobToB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob);});}
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||'audio/webm'});}
function audioExt(mime){mime=mime||'';return mime.includes('mp4')||mime.includes('m4a')||mime.includes('aac')?'mp4':mime.includes('ogg')?'ogg':mime.includes('mpeg')||mime.includes('mp3')?'mp3':mime.includes('wav')?'wav':'webm';}
async function exportProjects(projs,withAudio,filename){
  toast('백업 파일을 만드는 중…');
  const audio=[];let missing=0;
  if(withAudio&&audioOK){
    for(const p of projs){
      for(const id of blobIds(p)){
        try{const r=await AudioDB.getBlob(id);if(r)audio.push({id,projectId:p.id,mime:r.mime,duration:r.duration,createdAt:r.createdAt,data:await blobToB64(r.blob)});else missing++;}catch(e){missing++;}
      }
    }
  }
  const payload={format:'pbs-observe-backup',version:1,exportedAt:nowISO(),withAudio:!!withAudio,settings:store.settings,projects:projs,audio};
  const ok=await offerFile(filename,new Blob([JSON.stringify(payload)],{type:'application/json'}));
  if(ok){const t=nowISO();projs.forEach(p=>p.lastBackupAt=t);saveNow();render();toast(missing?`백업 파일을 내보냈습니다 (이 브라우저에 없는 녹음 ${missing}개 제외)`:'백업 파일을 내보냈습니다');}
}
/* IndexedDB에 넣는 파일 id: ABC 녹음 + 행동평정척도 첨부 파일 */
function blobIds(p){return Object.keys(p.procs.abc.data.audio||{}).concat(((p.procs.rating&&p.procs.rating.data&&p.procs.rating.data.files)||[]).map(f=>f.id));}
function remapAudio(p,map){
  (p.procs.rating.data.files||[]).forEach(f=>{if(map[f.id])f.id=map[f.id];});
  const a=p.procs.abc.data;const na={};
  Object.keys(a.audio).forEach(k=>{na[map[k]||k]=a.audio[k];});a.audio=na;
  a.sheets.forEach(x=>{x.audioIds=x.audioIds.map(y=>map[y]||y);});
}
async function importBackup(file){
  let data;
  try{data=JSON.parse(await file.text());}catch(e){toast('파일을 읽지 못했습니다. 이 프로그램에서 내보낸 .json 파일인지 확인하세요.');return;}
  if(!data||data.format!=='pbs-observe-backup'||!Array.isArray(data.projects)){toast('이 프로그램의 백업 파일이 아닙니다');return;}
  const audioById=new Map((data.audio||[]).map(x=>[x.id,x]));
  let added=0,copies=0,audioIn=0;
  for(const src of data.projects){
    const p=ensureProject(clone(src));delete p.shared;if(p.procs.abc.data.session)p.procs.abc.data.session.running=false;
    const clash=store.projects.some(x=>x.id===p.id);
    const map={};const srcIds=blobIds(p);
    if(clash){p.id=uid('p');p.code=p.code+' (불러옴)';copies++;srcIds.forEach(k=>map[k]=uid('a'));remapAudio(p,map);}
    for(const oldId of srcIds){
      const au=audioById.get(oldId);if(!au||!audioOK)continue;
      try{await AudioDB.put(map[oldId]||oldId,p.id,b64ToBlob(au.data,au.mime),au.duration,au.createdAt);audioIn++;}catch(e){}
    }
    store.projects.push(p);added++;
  }
  if(data.settings&&data.settings.qabfItems){const cur=store.settings.qabfItems;Object.keys(data.settings.qabfItems).forEach(k=>{if(!cur[k]&&data.settings.qabfItems[k])cur[k]=data.settings.qabfItems[k];});}
  saveNow();render();updateUsage();
  toast(`프로젝트 ${added}개를 불러왔습니다`+(audioIn?` (녹음 ${audioIn}개)`:'')+(copies?` · 이미 있던 ${copies}개는 사본으로 추가`:''));
}
async function duplicateProject(p){
  const c=ensureProject(clone(p));delete c.shared;c.id=uid('p');c.code=p.code+' (복사본)';c.example=false;c.lastBackupAt=null;if(c.procs.abc.data.session)c.procs.abc.data.session.running=false;c.createdAt=c.updatedAt=nowISO();
  const map={};blobIds(c).forEach(k=>map[k]=uid('a'));remapAudio(c,map);

  store.projects.push(c);saveNow();render();updateUsage();toast('프로젝트를 복제했습니다');
}
async function deleteProject(p,fromServer){
  /* 공유 프로젝트 소유자가 지우면 서버에 '삭제됨'으로 표시해 다른 멤버 기기에서도 지워지게 한다 */

function exportCSV(p){

async function getAudioDuration(blob){
  return new Promise(res=>{
    const a=document.createElement('audio');const u=URL.createObjectURL(blob);let done=false;
    const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);res(v);};
    a.preload='metadata';a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:null);a.onerror=()=>fin(null);
    setTimeout(()=>fin(null),4000);a.src=u;
  });
}
let persistAsked=false;
function persistStorage(){if(persistAsked)return;persistAsked=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}}

/* ---------- observation sessions (관찰지 이어 붙이기) ---------- */
/* 관찰 시작·최종 종료 시간("HH:MM")을 실제 시각으로 바꾼다 */
function atClock(baseMs,hm){const [h,m]=hm.split(':').map(Number);const d=new Date(baseMs);d.setHours(h,m||0,0,0);return d.getTime();}
function planStartToday(p){const ps=abcData(p).plan.start;return ps?new Date(atClock(Date.now(),ps)).toISOString():null;}
/* 세션 시작 시각 뒤에 처음 오는 최종 종료 시각 (자정을 넘기는 관찰도 처리) */
function planEndAfter(p,startISO){
  const pe=abcData(p).plan.end;if(!pe)return null;
  const st=Date.parse(startISO);let e=atClock(st,pe);if(e<=st)e+=86400000;
  return new Date(e).toISOString();
}
function sheetEnd(p,startISO,endAt){
  let e=Date.parse(startISO)+abcData(p).interval*60000;
  if(endAt)e=Math.min(e,Date.parse(endAt));
  return new Date(e).toISOString();
}
function makeSheet(p,sessionId,startISO,prev,endAt,id){
  const a=abcData(p);
  const src=prev||a.sheets.slice().sort(byStart).pop()||null;
  const t=nowISO();
  return ensureSheet({id:id||uid('s'),sessionId,start:startISO,end:sheetEnd(p,startISO,endAt),endedAt:null,
    child:src?src.child:(p.code||''),observer:src?src.observer:'',place:src?src.place:'',situation:src?src.situation:'',
    rows:[],note:'',interp:'',audioIds:[],createdAt:t,updatedAt:t});
}
function startSession(p,startISO,sid){
  const a=abcData(p);
  if(a.session&&a.session.running)endSession(p,true);
  startISO=startISO||nowISO();
  const s={id:sid||uid('n'),running:true,activeSheetId:null,endAt:planEndAfter(p,startISO)};
  const sh=makeSheet(p,s.id,startISO,null,s.endAt,sid?'s'+sid:null);
  a.sheets.push(sh);s.activeSheetId=sh.id;a.session=s;
  touch(p,'abc');saveNow();persistStorage();
  return sh;
}
function endSession(p,quiet){
  const a=abcData(p);const s=a.session;if(!s||!s.running)return;
  const sh=sheetById(p,s.activeSheetId);
  if(sh)sh.endedAt=new Date(Math.min(Date.now(),Date.parse(sh.end))).toISOString();
  s.running=false;
  if(rec.state==='recording'&&rec.seg&&rec.seg.target.projectId===p.id)stopRecording();
  touch(p,'abc');saveNow();
  if(!quiet)toast('관찰을 종료했습니다');
}
function rollover(p,old){
  const a=abcData(p);const s=a.session;
  const now=Date.now(),oldEnd=Date.parse(old.end),iv=a.interval*60000;
  const recHere=rec.state==='recording'&&rec.seg&&rec.seg.target.projectId===p.id&&rec.seg.target.sheetId===old.id;
  old.endedAt=old.end;
  if(s.endAt&&oldEnd>=Date.parse(s.endAt)){
    /* 최종 종료 시간이 되었다: 관찰지를 더 붙이지 않고 관찰을 끝낸다. 작성 중인 화면은 그대로 둔다 */
    s.running=false;
    if(recHere)stopRecording();
    touch(p,'abc');saveNow();
    if(onAbcPage(p))keepView(()=>{markSheetEnded(p,old);const b=$('#obs-ctrl-btn');if(b)b.innerHTML=obsCtrlBtn(p);refreshSummary(p);updateLive();updateRecUI();});
    toast(`최종 종료 시간(${fmtTime(s.endAt)})이 되어 관찰을 마쳤습니다`);
    return;
  }
  if(now-oldEnd>=iv&&!recHere){
    /* 화면이 꺼져 있는 등 한 간격 이상 지나 버린 경우: 빈 관찰지를 만들지 않고 관찰을 끝낸다 */
    s.running=false;touch(p,'abc');saveNow();
    if(onAbcPage(p))renderAbcAll();
    toast('관찰 간격이 한참 지나 관찰을 종료했습니다. 이어서 하려면 새 관찰을 시작하세요.');
    return;
  }
  const startMs=now-oldEnd<iv?oldEnd:now;
  /* 같은 프로젝트를 여러 탭에서 열어 두어도 두 탭이 같은 관찰지를 만들도록 id를 정해서 붙인다(합칠 때 하나로 합쳐짐) */
  const nw=makeSheet(p,s.id,new Date(startMs).toISOString(),old,s.endAt,'s'+s.id+'-'+startMs.toString(36));
  /* 새 관찰지에는 시작 시각이 적힌 빈 행을 하나 넣어 둔다 */
  nw.rows.push({id:'w'+nw.id,time:nw.start,a:'',b:p.procs.define.data.name||'',c:''});
  a.sheets.push(nw);s.activeSheetId=nw.id;
  if(recHere)rolloverRecording({projectId:p.id,sheetId:nw.id});
  touch(p,'abc');saveNow();
  if(onAbcPage(p)){
    /* 새 관찰지는 아래에 붙이고, 보고 있던 위치·입력 중인 칸은 그대로 둔다 */
    keepView(()=>{
      markSheetEnded(p,old);
      const box=$('#sheets-current');
      if(box)box.insertAdjacentHTML('beforeend',sheetView(p,nw));
      refreshSummary(p);updateLive();updateRecUI();
    });
  }
  toast(`${a.interval}분이 지나 새 관찰지를 추가했습니다`+(recHere?' · 녹음은 저장하고 다시 시작했습니다':''));
}
function markSheetEnded(p,old){
  const oe=$('#sh-'+old.id);if(!oe)return;
  oe.classList.remove('active');
  const h=$('#shh-'+old.id);if(h)h.innerHTML=sheetHead(p,old);
  refreshShTimes(old);
  const foot=oe.querySelector('.sheet-foot');
  if(foot&&!foot.querySelector('[data-key="del-sheet:'+old.id+'"]'))foot.insertAdjacentHTML('beforeend',`<div class="row end"><button type="button" class="btn small ghost danger" data-act="ask" data-key="del-sheet:${old.id}">이 관찰지 삭제</button></div>`);
}
function refreshShTimes(sh){
  const d=$('#shd-'+sh.id);if(d&&document.activeElement!==d)d.value=dayKey(sh.start);
  const a=$('#shs-'+sh.id);if(a&&document.activeElement!==a){a.value=fmtTime(sh.start);a.defaultValue=a.value;}
  const b=$('#she-'+sh.id);if(b&&document.activeElement!==b){b.value=fmtTime(sh.endedAt||sh.end);b.defaultValue=b.value;}
}
/* 관찰지 날짜·시작·끝 시각을 직접 고친다 */
function setSheetTime(el){
  const p=curProject();if(!p)return;
  const [sid,k]=el.dataset.shdt.split(':');const sh=sheetById(p,sid);if(!sh)return;
  const act=isActive(p,sh);const endISO=sh.endedAt||sh.end;
  const back=(msg)=>{refreshShTimes(sh);el.value=k==='date'?dayKey(sh.start):fmtTime(k==='start'?sh.start:endISO);if(msg)toast(msg);};
  if(k==='date'){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(el.value)){back('날짜를 입력하세요');return;}
    if(act){back('기록 중인 관찰지의 날짜는 관찰을 종료한 뒤 바꿀 수 있습니다');return;}
    const [y,m,d]=el.value.split('-').map(Number);const o=new Date(sh.start);const n=new Date(o);n.setFullYear(y,m-1,d);
    const delta=n.getTime()-o.getTime();if(!delta)return;
    const mv=x=>x?new Date(Date.parse(x)+delta).toISOString():x;
    sh.start=mv(sh.start);sh.end=mv(sh.end);if(sh.endedAt)sh.endedAt=mv(sh.endedAt);
    sh.rows.forEach(r=>{if(r.time)r.time=mv(r.time);});
  }else{
    const v=/^\d{2}:\d{2}/.test(el.value)?el.value.slice(0,5):'';
    if(!v){back('시각을 입력하세요');return;}
    const t=Date.parse(timeOnDay(sh.start,v));
    if(k==='start'){
      if(act&&t>Date.now()){back('기록 중인 관찰지의 시작 시각은 지금보다 앞이어야 합니다');return;}
      if(t>=Date.parse(endISO)){
        if(act){back('시작 시각은 끝 시각보다 앞이어야 합니다');return;}
        /* 시작을 끝보다 뒤로 옮기면 관찰지 길이를 그대로 두고 끝 시각도 함께 옮긴다 */
        const len=Math.max(60000,Date.parse(endISO)-Date.parse(sh.start));
        sh.end=sh.endedAt=new Date(t+len).toISOString();
      }
      sh.start=new Date(t).toISOString();
    }else{
      if(t<=Date.parse(sh.start)){back('끝 시각은 시작 시각보다 뒤여야 합니다');return;}
      if(act){
        if(t<=Date.now()){back('기록 중인 관찰지의 끝 시각은 지금보다 뒤로 정하세요. 지금 끝내려면 관찰 종료를 누르세요.');return;}
        sh.end=new Date(t).toISOString();
      }else{sh.end=new Date(t).toISOString();sh.endedAt=sh.end;}
    }
  }
  sh.updatedAt=nowISO();touch(p,'abc');saveNow();
  renderAbcAll();
  toast(`관찰지 시간을 ${fmtDate(sh.start)} ${rangeText(sh)}(으)로 고쳤습니다`);
}
/* 종이 노트 등에 적어 둔 관찰을 옮기려고 빈 관찰지를 직접 만든다 (시간은 흐르지 않음) */
function addManualSheet(p){
  const a=abcData(p);let s=a.session;let sid;let separate=false;
  if(s&&s.running){sid=uid('n');separate=true;}
  else if(s){sid=s.id;}
  else{s={id:uid('n'),running:false,activeSheetId:null,endAt:null};a.session=s;sid=s.id;}
  const last=sessionSheets(p,sid).pop();
  let st;
  if(last){st=Date.parse(last.endedAt||last.end);}
  else{const d=new Date();d.setSeconds(0,0);st=a.plan.start?atClock(d.getTime(),a.plan.start):d.getTime();}
  const sh=makeSheet(p,sid,new Date(st).toISOString(),last||null,null);
  sh.endedAt=sh.end;sh.manual=true;
  a.sheets.push(sh);
  if(separate)ui.openSheets.add(sh.id);
  touch(p,'abc');saveNow();renderAbcAll();
  const d=$('#shd-'+sh.id);
  if(d){d.scrollIntoView({behavior:'smooth',block:'center'});try{d.focus({preventScroll:true});}catch(e){}}
  toast(separate?'관찰 중이라 지난 관찰지 목록에 추가했습니다. 날짜와 시간을 노트에 적힌 대로 고치세요.':'관찰지를 추가했습니다. 날짜와 시간을 노트에 적힌 대로 고치세요.');
}
function keepView(fn){
  const x=window.scrollX,y=window.scrollY;const ae=document.activeElement;let ss=null,se=null;
  try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){}
  fn();
  if(ae&&ae!==document.body&&document.contains(ae)&&document.activeElement!==ae){try{ae.focus({preventScroll:true});if(ss!=null&&ae.setSelectionRange)ae.setSelectionRange(ss,se);}catch(e){}}
  if(window.scrollX!==x||window.scrollY!==y)window.scrollTo(x,y);
}
/* 관찰 시작 시간이 되면 저절로 관찰을 시작한다 (하루에 한 번) */
function planAutoStart(p){
  const a=abcData(p);const ps=a.plan.start;if(!ps)return;
  const now=Date.now();const st=atClock(now,ps);if(now<st)return;
  const key=dayKey(new Date(st).toISOString())+' '+ps;if(a.plan.fired===key)return;
  if(a.session&&a.session.running){a.plan.fired=key;scheduleSave();return;}
  const end=planEndAfter(p,new Date(st).toISOString());
  const late=end?now>=Date.parse(end):now-st>=a.interval*60000;
  a.plan.fired=key;
  if(late){scheduleSave();return;}
  startSession(p,new Date(now-st<60000?st:now).toISOString(),'nplan-'+p.id+'-'+st);
  if(onAbcPage(p))renderAbcAll();
  toast(`관찰 시작 시간(${ps})이 되어 관찰을 시작했습니다`);
}
function tick(){
  store.projects.forEach(planAutoStart);
  store.projects.forEach(p=>{
    const a=abcData(p);const s=a.session;if(!s||!s.running)return;
    const sh=sheetById(p,s.activeSheetId);
    if(!sh){s.running=false;scheduleSave();return;}
    if(Date.now()>=Date.parse(sh.end))rollover(p,sh);
  });
  updateLive();
}
function updateLive(){
  const p=curProject();if(!onAbcPage(p))return;
  const st=$('#obs-state');if(st)st.textContent=obsStateText(p);
  const sh=activeSheet(p);
  if(sh){const l=$('#left-'+sh.id);if(l)l.textContent=fmtDur(msLeft(sh)/1000)+' 남음';}
}
function addRow(p,sh,time){
  const r={id:uid('w'),time:time||null,a:'',b:p.procs.define.data.name||'',c:''};
  sh.rows.push(r);sh.updatedAt=nowISO();touch(p,'abc');saveNow();
  if(onAbcPage(p)){
    const box=$('#rows-'+sh.id);
    if(box){const em=box.querySelector('.rows-empty');if(em)em.remove();box.insertAdjacentHTML('beforeend',rowView(p,sh,r));reorderRows(sh);}
    const h=$('#shh-'+sh.id);if(h)h.innerHTML=sheetHead(p,sh);
    refreshSummary(p);
    const row=$('#rw-'+r.id);const ta=$('#rw-'+r.id+'-a');
    if(ta){try{ta.focus({preventScroll:true});}catch(e){}}
    if(row)row.scrollIntoView({behavior:'smooth',block:'center'});
  }
  return r;
}
function attachTargetSheet(p,key){
  if(key!=='active')return sheetById(p,key);
  const act=activeSheet(p);if(act)return act;
  const s=abcData(p).session;
  if(s){const ss=sessionSheets(p,s.id);if(ss.length)return ss[ss.length-1];}
  return null;
}

    const multi={defsrc:()=>[p.procs.define.data.sources,'define'],defpri:()=>[p.procs.define.data.priority,'define'],rfunc:()=>[p.procs.rating.data.funcs,'rating'],pfcomm:()=>[p.procs.profile.data.comm,'profile']};
    const single={measure:()=>[p.procs.define.data,'measure','define'],defstage:()=>[p.procs.define.data,'stage','define'],rtype:()=>[p.procs.rating.data,'type','rating'],bldir:()=>[p.procs.baseline.data,'dir','baseline'],pfclass:()=>[p.procs.profile.data,'classType','profile']};
    const hm=/^(func|conf|verify)(?::(.+))?$/.exec(g);
    if(hm){/* 가설 칸: func·conf·verify(가설 1) 또는 func:id 등(가설 2부터) */
      const h=hyData(p,hm[2]);if(!h)return;

      const [arr,key]=multi[g]();toggleIn(arr,v);
      const on=arr.includes(v);el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on));
      touch(p,key);
    }else if(single[g]){
      const [obj,field,key]=single[g]();obj[field]=obj[field]===v?'':v;

      touch(p,key);

      if(key==='baseline')refreshBl(p);

function onField(el){
  const p=curProject();
  const spec=el.dataset.f;const i=spec.indexOf(':');const scope=spec.slice(0,i),name=spec.slice(i+1);
  if(scope==='qitem'){store.settings.qabfItems[name]=el.value;scheduleSave();return;}
  if(!p)return;
  const val=el.value;
  switch(scope){
    case 'proj':
      p[name]=val;p.updatedAt=nowISO();scheduleSave();renderCrumbs();
      if(name==='code'){const t=$('#proj-title');if(t)t.textContent=val||'(코드 없음)';}
      break;
    case 'prof':
      p.procs.profile.data[name]=val;touch(p,'profile');break;
    case 'pfl':{
      const [k,id,field]=name.split(':');const arr=p.procs.profile.data[k];const o=Array.isArray(arr)&&arr.find(x=>x.id===id);if(!o)return;
      o[field]=val;touch(p,'profile');break;}
    case 'define':
      p.procs.define.data[name]=val;touch(p,'define');refreshDefine(p);break;
    case 'defbool':
      p.procs.define.data[name]=el.checked;touch(p,'define');break;
    case 'defcheck':{
      const n=Number(name);const arr=p.procs.define.data.checks;const has=arr.includes(n);
      if(el.checked&&!has)arr.push(n);if(!el.checked&&has)arr.splice(arr.indexOf(n),1);
      touch(p,'define');refreshDefine(p);break;}
    case 'qform':{
      const f=activeForm(p);if(!f)return;f[name]=val;f.updatedAt=nowISO();touch(p,'qabf');
      if(name==='rater'||name==='role'||name==='date'){const tab=$(`#q-tabs [data-id="${f.id}"]`);if(tab)tab.innerHTML=`${esc(f.rater||'응답자 미입력')}<small>${esc([f.role,f.date?f.date.slice(5).replace('-','/'):''].filter(Boolean).join(' · ')||' ')}</small>`;}
      break;}
    case 'sheet':{
      const [sid,field]=name.split(':');const sh=sheetById(p,sid);if(!sh)return;
      sh[field]=val;sh.updatedAt=nowISO();touch(p,'abc');break;}
    case 'row':{
      const [sid,rid,field]=name.split(':');const sh=sheetById(p,sid);if(!sh)return;
      const r=sh.rows.find(x=>x.id===rid);if(!r)return;
      if(field==='time')r.time=timeOnDay(sh.start,val);else r[field]=val;
      sh.updatedAt=nowISO();touch(p,'abc');
      if(field==='time'){const h=$('#shh-'+sid);if(h)h.innerHTML=sheetHead(p,sh);reorderRows(sh);}
      break;}
    case 'abcset':{
      const a=abcData(p);const n=Math.round(Number(val));
      if(!(n>=1&&n<=180)){el.value=a.interval;toast('관찰 간격은 1분에서 180분 사이로 정하세요');return;}
      a.interval=n;el.value=n;
      const sh=activeSheet(p);
      if(sh){
        sh.end=new Date(Math.max(Date.parse(sheetEnd(p,sh.start,a.session.endAt)),Date.now())).toISOString();
        const h=$('#shh-'+sh.id);if(h)h.innerHTML=sheetHead(p,sh);
        refreshShTimes(sh);
      }
      touch(p,'abc');saveNow();updateLive();toast(`관찰 간격을 ${n}분으로 정했습니다`);break;}
    case 'hypo':
      p.procs.hypo.data[name]=val;touch(p,'hypo');{const pv=$('#hypo-preview-m');if(pv)pv.innerHTML=hypoSentence(p);}break;
    case 'hyx':{
      const [id,field]=name.split(':');const h=hyData(p,id);if(!h)return;
      h[field]=val;touch(p,'hypo');const pv=$('#hypo-preview-'+id);if(pv)pv.innerHTML=hypoSentence(p,h);break;}
    case 'mf':
      p.procs[ui.proc].data[name]=val;touch(p,ui.proc);break;
    case 'base':
      p.procs.baseline.data[name]=val;touch(p,'baseline');refreshBl(p);break;
    case 'ses':{
      const [ph,id,field]=name.split(':');const s=sesList(p,ph).find(x=>x.id===id);if(!s)return;
      s[field]=val;touch(p,sesProc(ph));
      if(field==='date'||field==='time'){const y=window.scrollY;render();window.scrollTo(0,y);}else refreshBl(p);
      break;}
    case 'rating':
      ratingData(p)[name]=val;touch(p,'rating');break;
    case 'rrow':{
      const d=ratingData(p);const [kind,id,field]=name.split(':');
      const o=(kind==='rater'?d.raters:d.rows).find(x=>x.id===id);if(!o)return;
      o[field]=val;touch(p,'rating');
      if(kind==='rater'&&(field==='name'||field==='role')){
        const i=d.raters.indexOf(o);const label=o.name||o.role||`응답자 ${i+1}`;
        $$(`select[data-f$=":rater"] option[value="${id}"]`).forEach(op=>{op.textContent=label;});
      }
      refreshRatingCompare(p);break;}
  }
}
function setPlanTime(el){
  const p=curProject();if(!p)return;const a=abcData(p);const k=el.dataset.plan;
  const v=/^\d{2}:\d{2}/.test(el.value)?el.value.slice(0,5):'';
  a.plan[k]=v;if(k==='start')a.plan.fired='';
  const s=a.session;
  if(k==='end'&&s&&s.running){
    const first=sessionSheets(p,s.id)[0];
    s.endAt=planEndAfter(p,first?first.start:nowISO());
    const sh=activeSheet(p);
    if(sh){
      sh.end=new Date(Math.max(Date.parse(sheetEnd(p,sh.start,s.endAt)),Date.now())).toISOString();
      const h=$('#shh-'+sh.id);if(h)h.innerHTML=sheetHead(p,sh);
      refreshShTimes(sh);
    }
  }
  touch(p,'abc');saveNow();updateLive();
  toast(v?`${k==='start'?'관찰 시작 시간':'최종 종료 시간'}을 ${v}(으)로 정했습니다`:`${k==='start'?'관찰 시작 시간':'최종 종료 시간'}을 지웠습니다`);
}

document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.matches('.t24-native')){/* 시계로 고른 값을 24시간 글자로 옮긴다 */
    const tx=el.parentNode.querySelector('.t24-in');if(!tx||!el.value)return;
    tx.value=el.value.length===5&&tx.dataset.t24==='s'?el.value+':00':el.value.slice(0,tx.dataset.t24==='s'?8:5);
    tx.dispatchEvent(new Event('change',{bubbles:true}));return;
  }
  if(el.matches('.t24-in')){
    const raw=el.value.trim();
    if(raw){
      const c=parseClock24(raw);
      if(!c){el.classList.add('bad');toast('시각을 알아볼 수 없습니다. 24시간으로 적어 주세요. 예: 16:25 또는 1625');el.value=el.defaultValue;el.classList.remove('bad');return;}
      el.value=fmtClock24(c,el.dataset.t24==='s');
    }
    el.defaultValue=el.value;
    if(el.matches('[data-plan]')){setPlanTime(el);return;}
    if(el.matches('[data-shdt]')){setSheetTime(el);return;}
    if(el.matches('[data-f]')){onField(el);return;}
    return;
  }
  if(el.matches('[data-f]')&&(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date'||el.type==='datetime-local'||el.type==='number')){onField(el);return;}

/* ---------- 손글씨(S펜) 입력: 글자를 입력하는 모든 칸 ---------- */

function inkSpec(el){return el.dataset.f||(el.id==='new-code'?'new:code':el.id==='new-memo'?'new:memo':'');}

  switch(scope){
    case 'proj':return {obj:p,field:name,save:()=>{p.updatedAt=nowISO();scheduleSave();}};
    case 'prof':return {obj:p.procs.profile.data,field:name,save:()=>touch(p,'profile')};
    case 'pfl':{const [k,id,fd]=name.split(':');const arr=p.procs.profile.data[k];const o=Array.isArray(arr)&&arr.find(x=>x.id===id);if(!o)return null;return {obj:o,field:fd,save:()=>touch(p,'profile')};}

    case 'qform':{const f=activeForm(p);if(!f)return null;return {obj:f,field:name,save:()=>{f.updatedAt=nowISO();touch(p,'qabf');}};}

    case 'row':{const [sid,rid,fd]=name.split(':');const sh=sheetById(p,sid);if(!sh)return null;const r=sh.rows.find(x=>x.id===rid);if(!r)return null;
      return {obj:r,field:fd,save:()=>{sh.updatedAt=nowISO();touch(p,'abc');}};}
    case 'hypo':return {obj:p.procs.hypo.data,field:name,save:()=>touch(p,'hypo')};
    case 'hyx':{const [id,fd]=name.split(':');const h=hyData(p,id);if(!h)return null;return {obj:h,field:fd,save:()=>touch(p,'hypo')};}

    case 'rrow':{const [kind,id,fd]=name.split(':');const d=p.procs.rating.data;const o=(kind==='rater'?d.raters:d.rows).find(x=>x.id===id);if(!o)return null;

    case 'ses':{const [ph,id,fd]=name.split(':');const s=sesList(p,ph).find(x=>x.id===id);if(!s)return null;return {obj:s,field:fd,save:()=>touch(p,sesProc(ph))};}
    case 'mf':{const key=ui.proc;if(!p.procs[key])return null;return {obj:p.procs[key].data,field:name,save:()=>touch(p,key)};}

function inkGet(t){const box=t.flat?t.obj:t.obj.ink;const v=box&&box[t.field];return v&&v.s&&v.s.length?v:null;}

function inkPath(st){

}
/* 손글씨 모드: 손글씨가 있으면 그림(눌러서 고치기), 없으면 빈 손글씨 자리.
   키보드 모드: 손글씨가 있는 칸만 그림(눌러서 보며 쓰기), 없으면 비워 둔다(칸마다 손글씨 버튼 없음). */
function inkInner(spec){
  const t=inkTarget(spec);const ink=t&&inkGet(t);

    ?`<button type="button" class="ink-view" data-act="ink-open" title="눌러서 손글씨 고치기" aria-label="손글씨 (눌러서 고치기)">${inkSvg(ink)}</button>`

/* 칸 이름으로 화면의 입력칸 찾기 */
function inkHost(spec){
  if(spec==='new:code')return document.getElementById('new-code');
  if(spec==='new:memo')return document.getElementById('new-memo');
  return Array.from(document.querySelectorAll(INK_SEL)).find(el=>el.dataset.f===spec)||null;
}
function inkHostMark(el,spec){

  /* 손글씨 모드에서는 칸을 눌러도 키보드가 뜨지 않게 한다 (원래 inputmode는 data-im에 두었다가 되돌린다) */
  if(inkUI.mode==='ink'){if(el.dataset.im==null)el.dataset.im=el.getAttribute('inputmode')||'';el.setAttribute('inputmode','none');}
  else if(el.dataset.im!=null){if(el.dataset.im)el.setAttribute('inputmode',el.dataset.im);else el.removeAttribute('inputmode');delete el.dataset.im;}
}
/* 화면이 그려질 때마다 입력칸 바로 뒤에 손글씨 자리를 붙인다 */
function inkScan(){
  document.querySelectorAll(INK_SEL).forEach(el=>{
    const spec=inkSpec(el);if(!spec)return;
    const nx=el.nextElementSibling;
    if(!el.classList.contains('ink-host'))inkHostMark(el,spec);
    if(nx&&nx.classList.contains('ink')&&nx.dataset.k===spec)return;
    const box=document.createElement('div');box.className='ink';box.dataset.k=spec;
    box.innerHTML=inkInner(spec);el.insertAdjacentElement('afterend',box);
  });
}
let inkScanQueued=false;
new MutationObserver(()=>{if(inkScanQueued)return;inkScanQueued=true;Promise.resolve().then(()=>{inkScanQueued=false;inkScan();inkSyncLock();});}).observe(document.body,{childList:true,subtree:true});
/* 손글씨 자리를 눌러도 감싼 label 때문에 키보드가 뜨지 않게 한다 */
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.ink'))e.preventDefault();});
function inkClose(){
  const pad=inkUI.pad;inkUI.pad=null;if(!pad)return;
  const box=pad.box.isConnected?pad.box:null;
  if(box){box.innerHTML=inkInner(box.dataset.k);const h=inkHost(box.dataset.k);if(h)inkHostMark(h,box.dataset.k);}
  resumeClear('ink');
  inkSyncLock();
}
function inkSave(pad){
  inkPut(pad.t,pad.strokes.length?{w:pad.w,h:pad.h,s:pad.strokes}:null);
  pad.t.save();
}
function inkOpen(box){
  if(inkUI.pad)inkClose();
  const spec=box.dataset.k;const t=inkTarget(spec);if(!t)return;
  const prev=box.previousElementSibling;const single=!(prev&&prev.tagName==='TEXTAREA'&&!prev.classList.contains('one'));
  box.innerHTML=`<div class="ink-pad${inkUI.penSeen?' pen-only':''}">
    <canvas aria-label="손글씨 입력 칸"></canvas>
    <div class="ink-grip" role="separator" aria-orientation="horizontal" aria-label="손글씨 칸 높이 조절 (끌어서 늘이기·줄이기)" title="끌어서 칸 높이 조절"></div>
    <div class="ink-tools">
      <button type="button" data-ink="pen" class="on">펜</button>
      <button type="button" data-ink="eraser">지우개</button>
      <button type="button" data-ink="undo">되돌리기</button>
      <button type="button" data-ink="clear">모두 지우기</button>
      <button type="button" data-ink="grow">칸 늘리기</button>
      <button type="button" data-ink="mode">${inkUI.penSeen?'손가락도 쓰기':'S펜 전용'}</button>
      <button type="button" class="ink-done" data-ink="done">완료</button>
    </div>
    <p class="ink-hint">S펜 전용·두 손가락 이동</p></div>`;
  const cv=box.querySelector('canvas');
  const W=Math.max(120,Math.round(cv.getBoundingClientRect().width||box.clientWidth||240));
  const old=inkGet(t);
  const sc=old?W/old.w:1;
  const rd=v=>Math.round(v*10)/10;
  const strokes=old?old.s.map(st=>[rd(st[0]*Math.min(Math.max(sc,.5),2)),...st.slice(1).map(v=>rd(v*sc))]):[];
  const pad={box,t,cv,ctx:cv.getContext('2d'),w:W,h:Math.max(single?110:160,old?Math.ceil(old.h*sc):0),strokes,hist:[],tool:'pen',cur:null,pid:null};
  inkUI.pad=pad;
  inkResize(pad);
  inkBind(pad,box);
  inkGripBind(pad,box);
  resumeSet({kind:'ink',spec});
  inkSyncLock();
}
function inkResize(pad){

      /* S펜이 닿으면, 먼저 닿아 그리던 손바닥·손가락 획을 버리고 펜을 우선한다 */

/* ---- S펜 우선: 필기 칸이 열려 있고 S펜 전용이면, 화면 어디에 닿은 손바닥·손가락 터치도 무시한다 ----

/* ---- 손글씨 칸 높이: 아래 손잡이를 끌어서 늘이거나 줄인다 (쓴 글씨가 잘리지 않는 만큼까지 줄어듦) ---- */
function inkGripBind(pad,box){
  const g=box.querySelector('.ink-grip');if(!g)return;
  let st=null;
  const minH=()=>{let m=0;pad.strokes.forEach(s=>{for(let i=2;i<s.length;i+=2)m=Math.max(m,s[i]+s[0]);});return Math.max(60,Math.ceil(m+8));};
  g.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    try{g.setPointerCapture(e.pointerId);}catch(err){}
    st={id:e.pointerId,y:e.clientY,h:pad.h,min:minH()};g.classList.add('on');
  });
  g.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;e.preventDefault();
    const h=Math.round(Math.min(3000,Math.max(st.min,st.h+e.clientY-st.y)));
    if(h!==pad.h){pad.h=h;inkResize(pad);}
  });
  const end=e=>{if(!st||e.pointerId!==st.id)return;st=null;g.classList.remove('on');inkSave(pad);};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('keydown',e=>{
    if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();
    pad.h=Math.max(minH(),Math.min(3000,pad.h+(e.key==='ArrowDown'?40:-40)));inkResize(pad);inkSave(pad);
  });
  g.tabIndex=0;
}

/* ---------- 실시간 공유 (Firebase Firestore) ----------
   흐름은 한 방향씩: (내 입력 → store → Firestore 쓰기), (Firestore 수신 → merge3 → store → 화면).
   store.sync[pid] = {base: 마지막으로 서버와 맞춘 프로젝트 자료, revs: {경로: 그때 본 rev}}
   서버에는 칸 하나 = 문서 하나(cells), id 목록 항목은 items, 덮인 내용은 history, 충돌은 conflicts. */
const FIREBASE_CONFIG={apiKey:"AIzaSyClV4aC9gg2KURwNFgKOKYk6fXv9HcarbU",authDomain:"pbs-project-10874.firebaseapp.com",projectId:"pbs-project-10874",storageBucket:"pbs-project-10874.firebasestorage.app",messagingSenderId:"837954569078",appId:"1:837954569078:web:446b835e053fe54c61b057"};/* Firebase 콘솔 → 프로젝트 설정 → 내 앱 → firebaseConfig 값을 그대로 붙여 넣는다. 비어 있으면 공유 기능을 숨긴다 */
const FIREBASE_VER='12.19.0';
const SYNC_ON=!!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId);
const SYNC_SKIP_TOP=new Set(['id','shared','lastBackupAt','example']);/* 이 기기에만 두는 칸 */
const SYNC_META=/(^|\/)updatedAt$|^procs\/[^/]+\/status$/;/* 내용이 아닌 칸: 이것만 바뀌었으면 보내지 않는다 */
const NO_HIST=/(^|\/)(updatedAt|ink)(\/|\[|$)|^procs\/abc\/data\/session(\/|$)/;/* 수정 기록·충돌로 남기지 않는 칸 */
const Sync={ad:null,loading:null,user:null,authKnown:false,online:navigator.onLine,cur:null,ft:null,lastInput:0,dlg:null,stats:{writes:0,flushes:0},inkGone:new Set(),deleting:new Set()};

/* 프로젝트 → {cells: 경로→값, items: 항목경로→{parent,order}}. 경로 예: procs/abc/data/sheets[s1]/rows[w2]/b */
function syncFlat(p){
  const cells=new Map(),items=new Map();
  const walk=(o,path,isItem)=>{
    for(const k of Object.keys(o)){
      if(!path&&SYNC_SKIP_TOP.has(k))continue;
      if(isItem&&k==='id')continue;
      const v=o[k];if(v===undefined||typeof v==='function')continue;
      const pa=path?path+'/'+k:k;
      if(k==='ink')continue;/* 손글씨는 이 기기에만 둔다(서버로 보내지 않음) */
      if(isObj(v)){if(Object.keys(v).length)walk(v,pa,false);else cells.set(pa,{});continue;}
      if(Array.isArray(v)&&v.length&&isIdArr(v)){v.forEach((x,i)=>{const ip=pa+'['+x.id+']';items.set(ip,{parent:pa,order:i});walk(x,ip,true);});continue;}
      cells.set(pa,v);
    }
  };
  walk(p,'',false);
  return {cells,items};
}
function syncSeg(s){const m=/^(.*)\[([^\]]*)\]$/.exec(s);return m?{k:m[1],id:m[2]}:{k:s};}
/* syncFlat의 반대. 지워진 항목 아래의 칸은 버린다 */
function syncUnflat(cells,items){
  const root={};
  const step=(cur,sg,mk)=>{
    if(sg.id==null){if(!isObj(cur[sg.k])){if(!mk)return null;cur[sg.k]={};}return cur[sg.k];}
    const arr=cur[sg.k];if(!Array.isArray(arr))return null;
    return arr.find(x=>x.id===sg.id)||null;
  };
  const its=Array.from(items.entries()).map(([ip,it])=>({ip,segs:ip.split('/').map(syncSeg),order:Number(it.order)||0}));
  const lid=x=>String(x.segs[x.segs.length-1].id||'');
  its.sort((a,b)=>a.segs.length-b.segs.length||a.order-b.order||(lid(a)<lid(b)?-1:lid(a)>lid(b)?1:0));
  for(const it of its){
    let cur=root,ok=true;
    for(let i=0;i<it.segs.length-1;i++){cur=step(cur,it.segs[i],true);if(!cur){ok=false;break;}}
    if(!ok)continue;
    const last=it.segs[it.segs.length-1];if(last.id==null)continue;
    if(!Array.isArray(cur[last.k]))cur[last.k]=[];
    if(!cur[last.k].some(x=>x.id===last.id))cur[last.k].push({id:last.id});
  }
  const cs=Array.from(cells.entries()).map(([pa,v])=>({segs:pa.split('/').map(syncSeg),v}));
  cs.sort((a,b)=>a.segs.length-b.segs.length);
  for(const c of cs){
    let cur=root,ok=true;
    for(let i=0;i<c.segs.length-1;i++){cur=step(cur,c.segs[i],true);if(!cur){ok=false;break;}}
    if(!ok)continue;
    const k=c.segs[c.segs.length-1].k;const v=c.v;
    if(isObj(v)&&!Object.keys(v).length){if(!isObj(cur[k]))cur[k]={};}
    else if(Array.isArray(v)&&!v.length){if(!Array.isArray(cur[k]))cur[k]=[];}
    else cur[k]=isObj(v)||Array.isArray(v)?clone(v):v;
  }
  return root;
}
function syncItemsLive(path,items){
  const segs=path.split('/');let acc='';
  for(let i=0;i<segs.length;i++){acc=acc?acc+'/'+segs[i]:segs[i];if(i<segs.length-1&&/\]$/.test(segs[i])&&!items.has(acc))return false;}
  return true;
}
/* base와 mine을 비교해 바뀐 칸·항목만 고른다 */
function syncDiff(base,mine){
  const cells=[],items=[];
  mine.cells.forEach((v,pa)=>{if(!base.cells.has(pa)||!sameJ(base.cells.get(pa),v))cells.push({path:pa,value:v});});
  base.cells.forEach((v,pa)=>{if(!mine.cells.has(pa)&&syncItemsLive(pa,mine.items))cells.push({path:pa,deleted:true});});
  mine.items.forEach((it,pa)=>{const b=base.items.get(pa);if(!b||b.order!==it.order)items.push({path:pa,parent:it.parent,order:it.order});});
  base.items.forEach((it,pa)=>{if(!mine.items.has(pa)&&syncItemsLive(pa,mine.items))items.push({path:pa,parent:it.parent,order:it.order,deleted:true});});
  return {cells,items};
}
function syncBaseOf(p){const c=clone(p);SYNC_SKIP_TOP.forEach(k=>delete c[k]);inkStrip(c);return c;}
/* 손글씨(.ink) 칸을 모두 뺀다 */
const INK_PATH=/(^|\/)ink(\/|$)/;
function inkStrip(o){
  if(Array.isArray(o)){o.forEach(inkStrip);return o;}
  if(isObj(o)){delete o.ink;Object.keys(o).forEach(k=>inkStrip(o[k]));}
  return o;
}
/* 합치기 전에 이 기기 손글씨를 떼어 두었다가 같은 객체에 다시 붙인다(서버 자료에는 손글씨가 없으므로) */
function inkDetach(p){
  const out=[];
  const walk=o=>{if(Array.isArray(o)){o.forEach(walk);return;}if(!isObj(o))return;if('ink' in o){out.push([o,o.ink]);delete o.ink;}Object.keys(o).forEach(k=>walk(o[k]));};
  walk(p);return out;
}
function syncState(pid){store.sync=store.sync||{};const s=store.sync[pid]=store.sync[pid]||{base:null,revs:{}};s.revs=s.revs||{};return s;}
function syncMe(){return Sync.user?{uid:Sync.user.uid,name:String(store.settings.userName||'').trim()||Sync.user.name||'이름 없음'}:null;}
async function syncInviteKey(pid,code){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pid+':'+code));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function syncParse(json){if(json==null)return null;try{return JSON.parse(json);}catch(e){return null;}}
/* 화면 칸(data-f) ↔ 자료 경로 */
function syncPathIndex(p){
  const m=new Map();
  const walk=(o,path)=>{m.set(o,path);for(const k of Object.keys(o)){if(!path&&SYNC_SKIP_TOP.has(k))continue;const v=o[k];const pa=path?path+'/'+k:k;
    if(k==='ink')continue;
    if(isObj(v))walk(v,pa);else if(Array.isArray(v)&&v.length&&isIdArr(v))v.forEach(x=>walk(x,pa+'['+x.id+']'));}};
  walk(p,'');return m;
}
function syncSpecPath(spec,idx){
  const t=inkTarget(spec);if(!t||t.flat||t.obj===inkUI.pending)return null;
  const base=idx.get(t.obj);if(base==null)return null;
  return (base?base+'/':'')+t.field;
}
function syncFocusPath(p){
  const ae=document.activeElement;let spec=null;
  if(inkUI.pad&&inkUI.pad.box&&inkUI.pad.box.dataset)spec=inkUI.pad.box.dataset.k;
  else if(ae&&ae.matches&&ae.matches('[data-f]'))spec=ae.dataset.f;
  if(!spec||curProject()!==p)return null;
  try{return syncSpecPath(spec,syncPathIndex(p));}catch(e){return null;}
}

/* ---- 어댑터: 서버와 말하는 얇은 층. window.__pbsSyncAdapter로 가짜 어댑터를 끼울 수 있다 ---- */
async function syncAdapter(){
  if(Sync.ad)return Sync.ad;
  if(!Sync.loading)Sync.loading=(async()=>{
    const ad=window.__pbsSyncAdapter||await makeFirestoreAdapter();
    await ad.init(u=>syncOnAuth(u));
    Sync.ad=ad;return ad;
  })().catch(e=>{Sync.loading=null;throw e;});
  return Sync.loading;
}
async function makeFirestoreAdapter(){
  const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VER}/`;
  const [A,F,U]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG);
  let db;
  try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}catch(e){db=F.getFirestore(app);}
  const auth=U.getAuth(app);
  const emu=window.__pbsEmu;/* 시험용(에뮬레이터)일 때만 */
  if(emu){F.connectFirestoreEmulator(db,emu.host,emu.fs);U.connectAuthEmulator(auth,`http://${emu.host}:${emu.auth}`,{disableWarnings:true});}
  const ts=F.serverTimestamp;
  const iso=t=>t&&t.toDate?t.toDate().toISOString():(typeof t==='string'?t:null);
  const pd=pid=>F.doc(db,'projects',pid);
  const sub=(pid,name,id)=>id?F.doc(db,'projects',pid,name,id):F.collection(db,'projects',pid,name);
  const key=path=>encodeURIComponent(path).replace(/\./g,'%2E').replace(/%/g,'~');
  const count=n=>{Sync.stats.writes+=n;};
  const cellDoc=(path,v,rev,me)=>({path,value:JSON.stringify(v),deleted:false,rev,baseRev:0,by:me.uid,byName:me.name,at:ts()});
  const itemDoc=(it,me)=>({path:it.path,parent:it.parent,order:it.order,deleted:!!it.deleted,by:me.uid,at:ts()});
  async function batched(ops){/* 한 batch에 450개씩 */
    for(let i=0;i<ops.length;i+=450){const b=F.writeBatch(db);ops.slice(i,i+450).forEach(o=>b.set(o[0],o[1]));await b.commit();count(Math.min(450,ops.length-i));}
  }
  async function getAll(pid){
    const [c,it]=await Promise.all([F.getDocs(sub(pid,'cells')),F.getDocs(sub(pid,'items'))]);
    return {cells:c.docs.map(d=>d.data()),items:it.docs.map(d=>d.data())};
  }
  return {
    name:'firestore',
    async init(onAuth){
      U.onAuthStateChanged(auth,u=>onAuth(u?{uid:u.uid,name:u.displayName||(u.email||'').split('@')[0]||'',email:u.email||''}:null));
      try{await U.getRedirectResult(auth);}catch(e){}
    },
    async signIn(){
      if(emu&&emu.user){await U.signInWithCredential(auth,U.GoogleAuthProvider.credential(JSON.stringify(Object.assign({email_verified:true},emu.user))));return;}
      const pr=new U.GoogleAuthProvider();
      try{await U.signInWithPopup(auth,pr);}
      catch(e){if(e&&/popup-blocked|operation-not-supported|popup-closed-by-user/.test(e.code||'')&&e.code!=='auth/popup-closed-by-user'){await U.signInWithRedirect(auth,pr);return;}throw e;}
    },
    signOut(){return U.signOut(auth);},
    async createProject(pid,meta,me,inviteKey,flat){
      await F.setDoc(pd(pid),{code:meta.code||'',owner:me.uid,createdAt:ts(),updatedAt:ts()});
      await F.setDoc(sub(pid,'members',me.uid),{name:me.name,role:'owner',joinedAt:ts(),inviteKey});
      await F.setDoc(F.doc(db,'invites',inviteKey),{projectId:pid,createdBy:me.uid});
      count(3);
      const ops=[];
      flat.cells.forEach((v,path)=>ops.push([sub(pid,'cells',key(path)),cellDoc(path,v,1,me)]));
      flat.items.forEach((it,path)=>ops.push([sub(pid,'items',key(path)),itemDoc({path,parent:it.parent,order:it.order},me)]));
      await batched(ops);
    },
    async join(pid,inviteKey,me){
      const inv=await F.getDoc(F.doc(db,'invites',inviteKey));
      if(!inv.exists()||inv.data().projectId!==pid){const e=new Error('badcode');e.code='badcode';throw e;}
      const mref=sub(pid,'members',me.uid);
      const m=await F.getDoc(mref);
      if(!m.exists()){
        const pr=await F.getDoc(pd(pid)).catch(()=>null);
        if(pr&&pr.exists()&&pr.data().deleted){const e=new Error('deleted');e.code='deleted';throw e;}
        await F.setDoc(mref,{name:me.name,role:'member',joinedAt:ts(),inviteKey});count(1);}
      return getAll(pid);
    },
    watch(pid,h){
      const opt={includeMetadataChanges:true};
      const conv=d=>Object.assign(d.data({serverTimestamps:'estimate'}),{_id:d.id});
      const ch=(snap)=>snap.docChanges().map(c=>({removed:c.type==='removed',d:conv(c.doc)}));
      const un=[
        F.onSnapshot(sub(pid,'cells'),opt,s=>h.cells(ch(s).map(x=>(x.d.at=iso(x.d.at),x)),s.metadata.fromCache),h.error),
        F.onSnapshot(sub(pid,'items'),opt,s=>h.items(ch(s),s.metadata.fromCache),h.error),
        F.onSnapshot(F.query(sub(pid,'conflicts'),F.where('resolved','==',false)),s=>h.conflicts(s.docs.map(d=>{const x=conv(d);return Object.assign(x,{id:d.id,at:iso(x.at),theirsAt:iso(x.theirsAt)});})),h.error),
        F.onSnapshot(pd(pid),s=>h.project(s.exists()?s.data():null),()=>{}),
        F.onSnapshot(sub(pid,'members'),opt,s=>h.members(s.docs.map(d=>{const x=conv(d);return Object.assign(x,{uid:d.id,joinedAt:iso(x.joinedAt)});}),s.metadata.fromCache),h.error)
      ];
      return ()=>un.forEach(f=>{try{f();}catch(e){}});
    },
    /* 바뀐 칸을 트랜잭션으로 쓴다: 지금 rev가 내가 본 rev(baseRev)와 다르고 다른 사람이 쓴 것이면 충돌로 기록 */
    async write(pid,writes,items,me){
      const res=await F.runTransaction(db,async tx=>{
        const refs=writes.map(w=>sub(pid,'cells',key(w.path)));
        const curs=await Promise.all(refs.map(r=>tx.get(r)));
        const out=[];let n=0;
        writes.forEach((w,i)=>{
          const c=curs[i].exists()?curs[i].data():null;
          const curRev=c?Number(c.rev)||0:0;const json=w.deleted?null:JSON.stringify(w.value);const rev=curRev+1;
          tx.set(refs[i],{path:w.path,value:json,deleted:!!w.deleted,rev,baseRev:w.baseRev||0,by:me.uid,byName:me.name,at:ts()});n++;
          if(!w.noHist){tx.set(F.doc(sub(pid,'history')),{path:w.path,value:json,prevValue:c?c.value:null,by:me.uid,byName:me.name,at:ts()});n++;}
          let conflict=false;
          if(c&&!w.noHist&&!w.deleted&&!c.deleted&&curRev!==(w.baseRev||0)&&c.by!==me.uid&&c.value!==json&&typeof w.value==='string'){
            const tv=syncParse(c.value);
            if(typeof tv==='string'&&tv.trim()){conflict=true;n++;
              tx.set(F.doc(sub(pid,'conflicts')),{path:w.path,mine:json,theirs:c.value,mineBy:me.uid,mineByName:me.name,theirsBy:c.by||'',theirsByName:c.byName||'',theirsAt:c.at||null,at:ts(),resolved:false});}
          }
          out.push({path:w.path,rev,conflict});
        });
        items.forEach(it=>{tx.set(sub(pid,'items',key(it.path)),itemDoc(it,me));n++;});
        out.n=n;return out;
      });
      count(res.n||0);return res;
    },
    async history(pid,path){
      const s=await F.getDocs(F.query(sub(pid,'history'),F.where('path','==',path)));
      return s.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return {id:d.id,value:x.value,prevValue:x.prevValue,by:x.by,byName:x.byName,at:iso(x.at)};}).sort((a,b)=>(a.at||'').localeCompare(b.at||''));
    },
    async resolve(pid,id,me){await F.updateDoc(sub(pid,'conflicts',id),{resolved:true,resolvedBy:me.uid,resolvedAt:ts()});count(1);},
    async deleteProject(pid,me){
      const m=await F.getDoc(sub(pid,'members',me.uid));const k=m.exists()?m.data().inviteKey:'';
      await F.updateDoc(pd(pid),{deleted:true,deletedAt:ts(),deletedBy:me.uid,updatedAt:ts()});count(1);
      if(k){try{await F.deleteDoc(F.doc(db,'invites',k));count(1);}catch(e){}}
    },
    watchDoc(pid,cb){return F.onSnapshot(pd(pid),s=>cb(s.exists()?s.data():null),()=>{});},
    watchMembers(pid,cb){return F.onSnapshot(sub(pid,'members'),s=>cb(s.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return {uid:d.id,name:x.name||'',role:x.role||'',joinedAt:iso(x.joinedAt)};})),()=>{});},
    async removeMember(pid,uid){await F.deleteDoc(sub(pid,'members',uid));count(1);},
    async setName(pid,me){await F.updateDoc(sub(pid,'members',me.uid),{name:me.name});count(1);},
    async changeCode(pid,newKey,me){
      const mref=sub(pid,'members',me.uid);const m=await F.getDoc(mref);const old=m.exists()?m.data().inviteKey:'';
      if(old===newKey)return;
      await F.setDoc(F.doc(db,'invites',newKey),{projectId:pid,createdBy:me.uid});
      await F.updateDoc(mref,{inviteKey:newKey});
      if(old&&old!==newKey){try{await F.deleteDoc(F.doc(db,'invites',old));}catch(e){}}
      count(3);
    }
  };
}

/* ---- 로그인 ---- */
function syncOnAuth(u){
  Sync.user=u;Sync.authKnown=true;
  const S=Sync.cur;
  if(!u&&S&&S.unsub){S.unsub();S.unsub=null;S.gotCells=S.gotItems=false;}
  if(u&&S&&!S.unsub)syncSubscribe(S);
  if(u)setTimeout(syncWatchDocs,0);else syncUnwatchDocs();
  syncRefreshCards();syncStatusUI();
}
async function syncEnsureUser(){
  const ad=await syncAdapter();
  if(!Sync.user){await ad.signIn();for(let i=0;i<50&&!Sync.user;i++)await new Promise(r=>setTimeout(r,100));}
  if(!Sync.user)throw new Error('로그인하지 못했습니다');
  return ad;
}

/* ---- 지금 열어 둔 공유 프로젝트만 구독 ---- */
function syncWatch(){
  if(!SYNC_ON&&!window.__pbsSyncAdapter)return;
  const p=curProject();const want=p&&p.shared?p.shared.projectId:null;
  if(Sync.cur&&want&&Sync.cur.pid===want&&Sync.cur.localId===p.id)return;
  if(Sync.cur){if(Sync.cur.unsub)Sync.cur.unsub();Sync.cur=null;}
  if(want){
    const S=Sync.cur={pid:want,localId:p.id,cells:new Map(),items:new Map(),conflicts:[],members:[],gotCells:false,gotItems:false,fromCache:true,unsub:null,error:'',flushing:false,deferred:false,pendingN:0};
    syncAdapter().then(()=>{if(Sync.cur===S&&Sync.user&&!S.unsub)syncSubscribe(S);syncStatusUI();}).catch(()=>{S.error='load';syncStatusUI();});
  }
  syncStatusUI();
}
function syncSubscribe(S){
  S.unsub=Sync.ad.watch(S.pid,{
    cells:(chs,cache)=>{chs.forEach(c=>{const d=c.d;if(c.removed)S.cells.delete(d.path);else S.cells.set(d.path,{v:syncParse(d.value),raw:d.value,rev:Number(d.rev)||0,by:d.by,byName:d.byName||'',at:d.at,deleted:!!d.deleted});});
      S.gotCells=true;S.fromCache=cache;syncNet();syncAbsorbSoon(S);},
    items:(chs,cache)=>{chs.forEach(c=>{const d=c.d;if(c.removed)S.items.delete(d.path);else S.items.set(d.path,{parent:d.parent,order:Number(d.order)||0,deleted:!!d.deleted});});
      S.gotItems=true;syncAbsorbSoon(S);},
    project:d=>{if(d&&d.deleted)syncGone(S.localId);},
    conflicts:list=>{S.conflicts=list;syncDecorateSoon();syncRefreshCards();},
    members:(list,cache)=>{S.members=list;const me=syncMe();
      if(!cache&&me&&!list.some(m=>m.uid===me.uid))S.error='removed';
      /* 역할은 서버 멤버 기록을 따른다: 소유자 계정으로 다른 기기에서 받은 경우에도 소유자 기능(코드 바꾸기·내보내기·삭제)이 보이게 */
      const mine=me&&list.find(m=>m.uid===me.uid);const lp=projById(S.localId);
      if(!cache&&mine&&lp&&lp.shared&&(mine.role==='owner'||mine.role==='member')&&lp.shared.role!==mine.role){lp.shared.role=mine.role;scheduleSave();if(curProject()===lp&&ui.view==='project'){const y=window.scrollY;render();window.scrollTo(0,y);}}
      syncRefreshCards();syncStatusUI();},
    error:e=>{const c=(e&&e.code)||'';S.error=/permission/.test(c)?'denied':'error';if(S.unsub){S.unsub();S.unsub=null;}syncStatusUI();syncRefreshCards();}
  });
}
/* 소유자가 서버에서 지운 공유 프로젝트는 이 기기에서도 지운다 */
function syncGone(localId){
  const p=projById(localId);if(!p||!p.shared||Sync.deleting.has(localId))return;
  Sync.deleting.add(localId);
  const code=p.code;deleteProject(p,true).then(()=>toast(`소유자가 '${code}' 공유 프로젝트를 삭제해 이 기기에서도 지웠습니다`));
}
/* 이 기기에 있는 공유 프로젝트마다 프로젝트 문서(작은 문서 1개)만 지켜본다: 소유자가 지우면 홈 목록에서도 바로 사라진다 */
function syncWatchDocs(){
  if(!Sync.ad||!Sync.user)return;
  Sync.docs=Sync.docs||new Map();
  const want=new Map(store.projects.filter(x=>x.shared).map(x=>[x.shared.projectId,x.id]));
  Sync.docs.forEach((un,pid)=>{if(!want.has(pid)){un();Sync.docs.delete(pid);}});
  want.forEach((lid,pid)=>{if(!Sync.docs.has(pid))Sync.docs.set(pid,Sync.ad.watchDoc(pid,d=>{if(d&&d.deleted)syncGone(lid);}));});
  /* 내가 소유자인 프로젝트는 멤버 목록도 지켜본다: 홈 카드에 공유받은 사람 표시 */
  if(!Sync.ad.watchMembers)return;
  Sync.memUn=Sync.memUn||new Map();Sync.mem=Sync.mem||new Map();
  const own=new Set(store.projects.filter(x=>x.shared&&x.shared.role==='owner').map(x=>x.shared.projectId));
  Sync.memUn.forEach((un,pid)=>{if(!own.has(pid)){un();Sync.memUn.delete(pid);Sync.mem.delete(pid);}});
  own.forEach(pid=>{if(!Sync.memUn.has(pid))Sync.memUn.set(pid,Sync.ad.watchMembers(pid,list=>{Sync.mem.set(pid,list);syncRefreshShareLines();}));});
}
function syncUnwatchDocs(){if(Sync.docs){Sync.docs.forEach(un=>un());Sync.docs.clear();}
  if(Sync.memUn){Sync.memUn.forEach(un=>un());Sync.memUn.clear();}if(Sync.mem)Sync.mem.clear();syncRefreshShareLines();}
function syncAbsorbSoon(S){clearTimeout(S.at);S.at=setTimeout(()=>syncAbsorb(S),30);}
/* 서버 자료(theirs)를 이 기기 자료(mine)에 합친다. base = 마지막으로 서버와 맞춘 자료 */
function syncAbsorb(S){
  if(Sync.cur!==S||!S.gotCells||!S.gotItems)return;
  const p=projById(S.localId);if(!p||!p.shared)return;
  if(!S.cells.size&&!S.items.size)return;/* 아직 서버 자료를 못 받음 (오프라인 첫 접속 등) */
  const st=syncState(S.pid);
  const tc=new Map(),ti=new Map();
  S.cells.forEach((c,pa)=>{if(!c.deleted&&!INK_PATH.test(pa))tc.set(pa,c.v);});
  S.items.forEach((it,pa)=>{if(!it.deleted)ti.set(pa,{parent:it.parent,order:it.order});});
  let theirs=ensureProject(syncUnflat(tc,ti));
  const base=inkStrip(st.base?clone(st.base):{});
  /* 입력 중인 칸은 바로 덮지 않는다: 그 칸만 base 값으로 두고, 칸을 벗어나면 다시 합친다 */
  const fp=syncFocusPath(p);S.deferred=false;
  if(fp&&st.base){
    const bf=syncFlat(base),tf=syncFlat(theirs);
    if(!sameJ(bf.cells.get(fp),tf.cells.get(fp))){
      if(bf.cells.has(fp))tf.cells.set(fp,bf.cells.get(fp));else tf.cells.delete(fp);
      theirs=ensureProject(syncUnflat(tf.cells,tf.items));S.deferred=true;
    }
  }
  const noInk=(k,v)=>k==='ink'?undefined:v;
  const before=JSON.stringify(p,noInk);
  const inks=inkDetach(p);
  merge3(base,p,clone(theirs));
  inks.forEach(([o,v])=>{o.ink=v;});/* ensureProject가 객체를 새로 만들기 전에 다시 붙인다 */
  ensureProject(p);
  const changed=before!==JSON.stringify(p,noInk);
  const mf=syncFlat(p);
  S.cells.forEach((c,pa)=>{
    if(S.deferred&&pa===fp)return;
    const same=c.deleted?!mf.cells.has(pa):(mf.cells.has(pa)&&sameJ(mf.cells.get(pa),c.v));
    if(same&&!((st.revs[pa]||0)>c.rev))st.revs[pa]=c.rev;
  });
  st.base=syncBaseOf(theirs);
  if(changed){scheduleSave();if(curProject()===p){applyRemoteView();}}
  else scheduleSave();
  syncDecorateSoon();syncStatusUI();
  syncFlushSoon(changed?200:50);
}
document.addEventListener('focusout',()=>{const S=Sync.cur;if(S&&S.deferred)setTimeout(()=>{if(Sync.cur===S&&!syncFocusPath(projById(S.localId)))syncAbsorb(S);},0);syncFlushSoon(0);});

/* ---- 보내기: 바뀐 칸만, 여러 칸은 한 번에 ---- */
function syncPending(S){
  const p=projById(S.localId);const st=syncState(S.pid);
  if(!p||!st.base)return {cells:[],items:[]};
  const d=syncDiff(syncFlat(st.base),syncFlat(p));
  /* 예전 판이 서버에 올린 손글씨는 지운다(손글씨는 이 기기에만) */
  S.cells.forEach((c,pa)=>{if(!c.deleted&&INK_PATH.test(pa)&&!Sync.inkGone.has(pa)&&!d.cells.some(w=>w.path===pa))d.cells.push({path:pa,deleted:true});});
  /* 완료했던 절차를 다시 고치는 중이면 그 절차의 변경은 '이 절차 완료'를 누를 때까지 보내지 않는다 */
  const held=PROCS.filter(x=>procHeld(p.procs[x.key])).map(x=>'procs/'+x.key+'/');
  if(held.length){const keep=w=>!held.some(h=>w.path.startsWith(h));d.cells=d.cells.filter(keep);d.items=d.items.filter(keep);}
  /* 고쳤다가 원래대로 되돌린 경우 내용 칸은 diff에 안 나온다. 그때 남는 수정 시각·진행 상태 칸만으로는 보내지 않는다(다음에 내용이 바뀔 때 함께 감) */
  if(!d.items.length&&d.cells.every(w=>SYNC_META.test(w.path)&&!(/\/status$/.test(w.path)&&w.value==='done')))return {cells:[],items:[]};/* 다시 '완료'로 돌린 것은 보낸다 */
  return d;
}
function syncFlushSoon(ms,force){clearTimeout(Sync.ft);Sync.ft=setTimeout(()=>syncFlush(force),ms);}
/* 글 칸에 키보드로 쓰는 중이거나 손글씨 칸이 열려 있으면 '입력 중': 완료(칸 벗어나기·손글씨 완료·키보드 완료)를 누를 때까지 서버로 보내지 않는다 */
function syncEditing(){
  if(inkUI.kb)return true;/* 손글씨 보며 쓰기 창이 열려 있음 */
  const r=resumeGet();if(r&&r.kind==='field')return true;/* 글 칸에 쓰다가 끊김: 칸을 벗어날 때까지 기다림 */
  const ae=document.activeElement;
  return !!(ae&&ae.matches&&ae.matches('textarea,input:not([type]),input[type=text]'));
}
function syncNet(){const S=Sync.cur;Sync.online=navigator.onLine&&!(S&&S.gotCells&&S.fromCache);}
async function syncFlush(force){
  const S=Sync.cur;if(!S||!Sync.ad||!Sync.user||!S.unsub||!S.gotCells||!S.gotItems||S.error)return;
  if(S.flushing){S.again=true;return;}
  const p=projById(S.localId);const st=syncState(S.pid);if(!p||!st.base)return;
  const d=syncPending(S);S.pendingN=d.cells.length+d.items.length;
  if(!S.pendingN){syncStatusUI();return;}
  if(!force&&syncEditing()){syncStatusUI();return;}
  syncNet();
  if(!Sync.online||document.visibilityState==='hidden'){syncStatusUI();return;}/* 오프라인이면 모아 두었다가 다시 연결되면 보낸다 */
  S.flushing=true;syncStatusUI();
  const me=syncMe();let conflicts=0;
  try{
    const writes=d.cells.map(w=>Object.assign(w,{baseRev:st.revs[w.path]||0,noHist:NO_HIST.test(w.path)}));
    const items=d.items;
    for(let i=0,j=0;i<writes.length||j<items.length;i+=120,j+=200){
      const ws=writes.slice(i,i+120),its=items.slice(j,j+200);
      const res=await Sync.ad.write(S.pid,ws,its,me);Sync.stats.flushes++;
      const bf=syncFlat(st.base||{});
      ws.forEach(w=>{if(w.deleted)bf.cells.delete(w.path);else bf.cells.set(w.path,w.value);if(w.deleted&&INK_PATH.test(w.path))Sync.inkGone.add(w.path);});
      its.forEach(it=>{if(it.deleted)bf.items.delete(it.path);else bf.items.set(it.path,{parent:it.parent,order:it.order});});
      st.base=syncBaseOf(syncUnflat(bf.cells,bf.items));
      res.forEach(r=>{if(!((st.revs[r.path]||0)>r.rev))st.revs[r.path]=r.rev;if(r.conflict)conflicts++;});
    }
    scheduleSave();
    if(conflicts)toast('다른 사람이 같은 칸을 고쳐 두었습니다. 내 내용이 들어가고, 상대 내용은 칸 옆 "다른 버전"에 남았습니다.');
  }catch(e){
    const c=(e&&e.code)||'';
    if(/permission/.test(c))S.error='denied';
    else{Sync.online=false;setTimeout(()=>{syncNet();syncFlushSoon(0);},5000);}
  }finally{
    S.flushing=false;
    const d2=syncPending(S);S.pendingN=d2.cells.length+d2.items.length;
    if(S.again||S.pendingN&&Sync.online&&!S.error){S.again=false;syncFlushSoon(300);}
    syncStatusUI();
  }
}
/* 글 칸·손글씨는 완료(칸 벗어나기·손글씨 '완료'·키보드 '완료')를 누를 때 보내고, 선택·체크·버튼은 바로 */
document.addEventListener('input',e=>{if(!Sync.cur)return;const el=e.target;if(!(el.matches&&el.matches('textarea,input:not([type]),input[type=text]')))syncFlushSoon(0);});
document.addEventListener('click',e=>{if(Sync.cur&&e.target.closest&&e.target.closest('[data-ink="done"]'))syncFlushSoon(50);});
document.addEventListener('keydown',e=>{if(Sync.cur&&e.key==='Enter'&&e.target.matches&&e.target.matches('input:not([type]),input[type=text],textarea.one'))syncFlushSoon(50,true);});/* 한 줄 칸에서 키보드 '완료'(Enter) */
(function(){const vv=window.visualViewport;if(!vv)return;let h=vv.height;vv.addEventListener('resize',()=>{if(Sync.cur&&vv.height-h>120&&!inkUI.kb)setTimeout(()=>{if(pageActive())syncFlushSoon(0,true);},400);h=vv.height;});})();/* 키보드를 내리면(키보드 '완료') 보낸다 */
document.addEventListener('change',e=>{if(!Sync.cur)return;const el=e.target;if(!(el.matches&&el.matches('textarea,input:not([type]),input[type=text]')))syncFlushSoon(0);});
document.addEventListener('click',e=>{if(Sync.cur&&e.target.closest&&e.target.closest('[data-act]'))syncFlushSoon(100);});
window.addEventListener('online',()=>{syncNet();syncStatusUI();syncFlushSoon(0);});
window.addEventListener('offline',()=>{Sync.online=false;syncStatusUI();});

setInterval(()=>{if(Sync.cur)syncFlush();},4000);/* 관찰지 자동 추가처럼 입력 없이 바뀐 것도 보낸다 */

/* ---- 화면: 접속 상태 ---- */
function syncStatusUI(){
  const el=$('#sync-state');if(!el)return;
  const S=Sync.cur;
  if(!S){el.hidden=true;return;}
  let t,cls='';
  if(S.error==='removed'||S.error==='denied'){t='공유에서 빠짐 · 동기화 멈춤';cls='bad';}
  else if(S.error==='load'){t='공유 기능을 불러오지 못함';cls='bad';}
  else if(Sync.authKnown&&!Sync.user){t='로그인 필요 · 동기화 멈춤';cls='bad';}
  else if(!S.unsub||!S.gotCells){t='연결 중…';}
  else if(!Sync.online){t=`오프라인 (보낼 변경 ${S.pendingN}개 대기)`;cls='warn';}
  else if(S.flushing){t='실시간 연결됨 · 보내는 중';cls='ok';}
  else if(S.pendingN&&syncEditing()){t='실시간 연결됨 · 입력 완료 후 보냄';cls='ok';}
  else{t='실시간 연결됨';cls='ok';}
  el.hidden=false;el.className='sync-state '+cls;el.textContent=t;
}

let syncDecQueued=false;
function syncDecorateSoon(){if(syncDecQueued)return;syncDecQueued=true;Promise.resolve().then(()=>{syncDecQueued=false;syncDecorate();});}
function syncOther(c,curJson){/* 충돌 기록에서 지금 칸 값과 다른 쪽 */
  if(c.theirs!==curJson)return {json:c.theirs,by:c.theirsByName||'다른 사람',at:c.theirsAt};
  return {json:c.mine,by:c.mineByName||'다른 사람',at:c.at};
}
function syncConfFor(path){const S=Sync.cur;return S?S.conflicts.filter(c=>c.path===path):[];}
function syncDecorate(){
  const S=Sync.cur;const p=curProject();
  const ok=S&&p&&S.localId===p.id&&S.gotCells;
  if(!ok){$$('.sync-meta').forEach(x=>x.remove());return;}
  const idx=syncPathIndex(p);
  $$('#main [data-f]').forEach(el=>{
    let path=null;try{path=syncSpecPath(el.dataset.f,idx);}catch(e){}
    const holder=el.closest('.td')?el.closest('.td').querySelector('.cell-label'):(el.closest('.field')?el.closest('.field').querySelector(':scope > span, :scope > legend'):null);
    if(!holder)return;

/* ---- 자료 경로로 값 바꾸기 (충돌 고르기·이전 버전 다시 넣기) ---- */
function syncSetValue(p,path,value){
  const inv=new Map();syncPathIndex(p).forEach((pa,o)=>inv.set(pa,o));
  const i=path.lastIndexOf('/');const parent=i<0?'':path.slice(0,i);const field=path.slice(i+1);
  const obj=inv.get(parent);if(!obj)return false;
  obj[field]=value;
  const segs=path.split('/');
  if(segs[0]==='procs'&&p.procs[segs[1]])touch(p,segs[1]);else{p.updatedAt=nowISO();}
  saveNow();
  const y=window.scrollY;render();window.scrollTo(0,y);
  syncFlushSoon(0);
  return true;
}

function syncSentences(t){return String(t||'').split(/\n+|(?<=[.!?。])\s+/).map(s=>s.trim()).filter(Boolean);}

  const list=S.conflicts.slice().sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  return `<section class="card sync-conflicts" id="sync-conflicts"><h2 class="h3">확인할 충돌 ${list.length}개</h2>
    <p class="hint">눌러서 칸 내용 고르기</p>
    <ul class="sync-clist">${list.map(c=>{const lb=syncLabel(p,c.path);const o=syncOther(c,syncCurJson(p,c.path));
      return `<li><button type="button" class="sync-citem" data-act="sync-goto" data-path="${esc(c.path)}"><b>${esc(lb.proc)} · ${esc(lb.name)}</b><span class="meta">${esc(o.by)} · ${o.at?fmtShort(o.at):''}</span></button></li>`;}).join('')}</ul></section>`;
}
function syncJoinCard(){
  if(!SYNC_ON&&!window.__pbsSyncAdapter)return '';
  return `<section class="card" id="sync-join"><h2 class="h3">공유 코드로 프로젝트 받기</h2>
    <p class="hint">공유 ID·코드로 받기</p>
    <div id="sync-join-login">${Sync.user?`<p class="meta">로그인: ${esc(Sync.user.email||Sync.user.name)}</p>`:''}</div>
    <div class="new-form">
      <label class="field"><span>공유 ID</span><input id="sync-join-id" autocomplete="off" maxlength="80"></label>
      <label class="field"><span>공유 코드</span><input id="sync-join-code" autocomplete="off" maxlength="60"></label>
      <button type="button" class="btn primary" data-act="sync-join">받기</button>
    </div></section>`;
}
function syncRefreshCards(){
  const p=curProject();
  if(ui.view==='project'&&p){
    const c=$('#sync-card');if(c&&!(document.activeElement&&c.contains(document.activeElement)&&document.activeElement.matches('input')))c.innerHTML=syncProjectCardInner(p);
    const k=$('#sync-conflicts');if(k)k.outerHTML=syncConflictCard(p);
  }
  if(ui.view==='home'){const j=$('#sync-join-login');if(j)j.innerHTML=Sync.user?`<p class="meta">로그인: ${esc(Sync.user.email||Sync.user.name)}</p>`:'';}
}
function syncAfterRender(){syncWatch();syncWatchDocs();syncDecorateSoon();syncStatusUI();}
function syncErrMsg(e){
  const c=(e&&e.code)||'';
  if(c==='deleted')return '소유자가 삭제한 프로젝트입니다';
  if(c==='badcode')return '공유 ID 또는 공유 코드가 맞지 않습니다';
  if(/permission/.test(c))return '권한이 없습니다. 공유 ID·코드를 확인하세요';
  if(/unavailable|network/.test(c))return '서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요';
  if(/popup-closed|cancelled-popup/.test(c))return '로그인 창이 닫혔습니다';
  return '문제가 생겼습니다: '+((e&&e.message)||e);
}

/* ---- 버튼 ---- */
Object.assign(actions,{
  'sync-login':async()=>{try{await syncEnsureUser();toast('로그인했습니다');syncRefreshCards();}catch(e){toast(syncErrMsg(e));}},
  'sync-logout':async()=>{try{await Sync.ad.signOut();toast('로그아웃했습니다. 공유 프로젝트는 이 기기에 남고 동기화만 멈춥니다.');}catch(e){toast(syncErrMsg(e));}},
  'sync-start':async el=>{
    const p=curProject();const inp=$('#sync-code-new');const code=(inp&&inp.value||'').trim();
    if(code.length<6){toast('공유 코드를 6자 이상으로 정하세요');if(inp)inp.focus();return;}
    el.disabled=true;
    try{
      const ad=await syncEnsureUser();const me=syncMe();
      const key=await syncInviteKey(p.id,code);const flat=syncFlat(p);
      toast('서버에 올리는 중…');
      await ad.createProject(p.id,{code:p.code},me,key,flat);
      p.shared={projectId:p.id,role:'owner',since:nowISO(),code};
      const st=syncState(p.id);st.base=syncBaseOf(p);st.revs={};flat.cells.forEach((v,pa)=>{st.revs[pa]=1;});
      saveNow();render();toast('공유를 시작했습니다. 공유 ID와 공유 코드를 함께 쓸 사람에게 알려 주세요.');
    }catch(e){console.error(e);toast(syncErrMsg(e));el.disabled=false;}
  },
  'sync-join':async el=>{
    const id=($('#sync-join-id').value||'').trim();const code=($('#sync-join-code').value||'').trim();
    if(!id||!code){toast('공유 ID와 공유 코드를 모두 입력하세요');return;}
    const have=projById(id);
    if(have&&have.shared){go('project',{projectId:id,proc:null,cat:null});toast('이미 이 기기에 있는 공유 프로젝트입니다');return;}
    if(have){toast('같은 ID의 프로젝트가 이 기기에 이미 있습니다 (공유를 시작한 기기입니다)');return;}
    el.disabled=true;
    try{
      const ad=await syncEnsureUser();const me=syncMe();
      const key=await syncInviteKey(id,code);
      const r=await ad.join(id,key,me);
      const tc=new Map(),ti=new Map(),revs={};
      r.cells.forEach(c=>{if(!c.deleted){tc.set(c.path,syncParse(c.value));}revs[c.path]=Number(c.rev)||0;});
      r.items.forEach(it=>{if(!it.deleted)ti.set(it.path,{parent:it.parent,order:Number(it.order)||0});});
      const p=ensureProject(syncUnflat(tc,ti));
      p.id=id;p.lastBackupAt=null;p.example=false;p.shared={projectId:id,role:'member',since:nowISO(),code};
      const st=syncState(id);st.base=syncBaseOf(p);st.revs=revs;
      store.projects.push(p);saveNow();go('project',{projectId:id,proc:null,cat:null});
      toast('공유 프로젝트를 받았습니다. 이제 함께 고친 내용이 실시간으로 반영됩니다.');
    }catch(e){if(e&&e.code!=='badcode'&&e.code!=='deleted')console.error(e);toast(syncErrMsg(e));}
    finally{el.disabled=false;}
  },
  'sync-copy':async()=>{
    const p=curProject();const t=p&&p.shared?p.shared.projectId:'';
    try{await navigator.clipboard.writeText(t);toast('공유 ID를 복사했습니다');}
    catch(e){const c=$('#sync-pid');if(c){const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast('공유 ID를 선택했습니다. 길게 눌러 복사하세요');}
  },
  'sync-kick':async el=>{
    const S=Sync.cur;if(!S)return;
    try{await Sync.ad.removeMember(S.pid,el.dataset.id);ui.confirm=null;rerenderForConfirm();toast('멤버를 내보냈습니다. 공유 코드도 바꾸는 것이 좋습니다.');}
    catch(e){toast(syncErrMsg(e));}
  },
  'sync-recode':async el=>{
    const p=curProject();const S=Sync.cur;const inp=$('#sync-code-change');const code=(inp&&inp.value||'').trim();
    if(!S||!p.shared){toast('연결된 뒤에 다시 시도하세요');return;}
    if(code.length<6){toast('공유 코드를 6자 이상으로 정하세요');return;}
    el.disabled=true;
    try{await Sync.ad.changeCode(S.pid,await syncInviteKey(S.pid,code),syncMe());p.shared.code=code;saveNow();syncRefreshCards();toast('공유 코드를 바꿨습니다. 예전 코드로는 더 받을 수 없습니다.');}
    catch(e){toast(syncErrMsg(e));el.disabled=false;}
  },
  'sync-hist':el=>syncHistView(el.dataset.path),
  'sync-conf':el=>syncConfView(el.dataset.path),
  'sync-close':()=>syncDlgClose(),
  'sync-take':()=>{const D=Sync.dlg;const p=curProject();if(!D||!p)return;syncSetValue(p,D.path,syncParse(D.other));syncResolveCur('다른 버전으로 바꿨습니다');},
  'sync-append':()=>{const D=Sync.dlg;const p=curProject();if(!D||!p)return;
    const cur=syncText(syncCurJson(p,D.path));const o=syncText(D.other);
    syncSetValue(p,D.path,cur?cur+'\n──────────\n'+o:o);syncResolveCur('두 내용을 이어 붙였습니다. 필요 없는 부분은 지우세요.');},
  'sync-pick':()=>{const D=Sync.dlg;if(!D)return;const ss=syncSentences(syncText(D.other));const box=$('#sync-pickbox');if(!box)return;
    box.innerHTML=`<fieldset class="field sync-pick"><legend>가져올 문장을 고르세요</legend>${ss.map((s,i)=>`<label class="check"><input type="checkbox" data-pick="${i}"> <span>${esc(s)}</span></label>`).join('')}</fieldset><div class="row"><button type="button" class="btn primary small" data-act="sync-pick-do">고른 문장을 내 칸 끝에 넣기</button></div>`;
    D.sent=ss;},
  'sync-pick-do':()=>{const D=Sync.dlg;const p=curProject();if(!D||!p||!D.sent)return;
    const ch=$$('#sync-pickbox [data-pick]').filter(x=>x.checked).map(x=>D.sent[Number(x.dataset.pick)]);
    if(!ch.length){toast('가져올 문장을 하나 이상 고르세요');return;}
    const cur=syncText(syncCurJson(p,D.path));
    syncSetValue(p,D.path,cur?cur+(cur.endsWith('\n')?'':'\n')+ch.join(' '):ch.join(' '));syncResolveCur(`문장 ${ch.length}개를 가져왔습니다`);},
  'sync-keep':()=>syncResolveCur('지금 내용을 그대로 두었습니다'),
  'sync-restore':el=>{const D=Sync.dlg;const p=curProject();if(!D||!D.list||!p)return;const h=D.list[Number(el.dataset.i)];if(!h)return;
    syncSetValue(p,D.path,syncParse(h.value));syncDlgClose();toast('이전 버전을 다시 넣었습니다');},
  'sync-goto':el=>{
    const p=curProject();const path=el.dataset.path;const segs=path.split('/');
    (path.match(/sheets\[([^\]]+)\]/g)||[]).forEach(s=>ui.openSheets.add(s.slice(7,-1)));
    if(segs[0]==='procs'&&PROC[segs[1]])go('proc',{proc:segs[1]});
    const idx=syncPathIndex(p);
    const t=$$('#main [data-f]').find(x=>{try{return syncSpecPath(x.dataset.f,idx)===path;}catch(e){return false;}});
    if(t){const d=t.closest('details');if(d)d.open=true;t.scrollIntoView({block:'center'});t.classList.add('sync-flash');setTimeout(()=>t.classList.remove('sync-flash'),2400);}
    syncConfView(path);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id!=='sync-name')return;
  store.settings.userName=e.target.value;scheduleSave();
  clearTimeout(Sync.nt);Sync.nt=setTimeout(()=>{const S=Sync.cur;const me=syncMe();if(S&&S.unsub&&me)Sync.ad.setName(S.pid,me).catch(()=>{});},1500);
});
if(window.__pbsEmu)window.__pbsSync={Sync,syncFlat,syncUnflat,syncDiff,syncPending,syncFlush,store:()=>store};

/* ---------- boot ---------- */
if(firstRun&&!store.projects.length){store.projects.push(exampleProject());}
AudioDB.open().then(()=>{audioOK=true;}).catch(()=>{audioOK=false;});
updateStorageBanner();
render();
resumeBoot();
updateUsage();
if(storageOK)setSaveState('');
tick();setInterval(tick,1000);
if(SYNC_ON){const sf=$('#sync-foot');if(sf)sf.hidden=false;if(store.projects.some(p=>p.shared))syncAdapter().catch(()=>{});}
(function(){const tb=$('.topbar');const set=()=>document.documentElement.style.setProperty('--tb',tb.offsetHeight+'px');set();try{new ResizeObserver(set).observe(tb);}catch(e){window.addEventListener('resize',set);}})();
})();
</script>

</body>
