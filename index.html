<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>PBS 행동 관찰 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: field-notebook tool — sticky crumb bar, one 980px column, procedure cards in a wrapping grid, A/B/C colour-coded throughout */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --sunk:#E2E9E7;
  --ink:#152426; --muted:#566868; --line:#CAD6D3; --line-strong:#A9BAB7;
  --accent:#1B6862; --accent-hover:#14534E; --accent-ink:#FFFFFF; --accent-soft:#D2E9E5;
  --a:#2C52A0; --a-soft:#DFE7F7; --c:#93520F; --c-soft:#F5E6D1;
  --rec:#BF3628; --rec-soft:#F9DEDA; --ok:#27744A; --ok-soft:#D8EEE0; --warn:#866000; --warn-soft:#F4E9C6;
  --shadow:0 1px 2px rgba(21,36,38,.06),0 6px 18px rgba(21,36,38,.05);
  --tag-ink:#FFFFFF;
  --font-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F191A; --surface:#162325; --surface-2:#1B2A2C; --sunk:#0B1314;
  --ink:#E3ECEA; --muted:#9AACAA; --line:#2C3E40; --line-strong:#40575A;
  --accent:#5DB6AB; --accent-hover:#79C7BD; --accent-ink:#0B1A19; --accent-soft:#1C3A37;
  --a:#91AAEA; --a-soft:#1E2944; --c:#E2A55C; --c-soft:#3A2915;
  --rec:#F27B6C; --rec-soft:#45201B; --ok:#6BC493; --ok-soft:#173327; --warn:#E0BA52; --warn-soft:#382E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --tag-ink:#0F191A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F191A; --surface:#162325; --surface-2:#1B2A2C; --sunk:#0B1314;
  --ink:#E3ECEA; --muted:#9AACAA; --line:#2C3E40; --line-strong:#40575A;
  --accent:#5DB6AB; --accent-hover:#79C7BD; --accent-ink:#0B1A19; --accent-soft:#1C3A37;
  --a:#91AAEA; --a-soft:#1E2944; --c:#E2A55C; --c-soft:#3A2915;
  --rec:#F27B6C; --rec-soft:#45201B; --ok:#6BC493; --ok-soft:#173327; --warn:#E0BA52; --warn-soft:#382E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --tag-ink:#0F191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.15rem);line-height:1.25;letter-spacing:-.01em}
.h3{font-size:1.02rem;font-weight:700}
p{margin:0}
small{font-size:.82em;color:var(--muted);font-weight:400}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:flex;flex-direction:column;gap:18px;padding-block:22px 28px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding-block:6px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;min-width:0;font-size:.92rem}
.crumbs button{background:none;border:0;padding:6px 6px;border-radius:8px;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs .sep{color:var(--line-strong)}
.crumbs .here{padding:6px;font-weight:700;overflow-wrap:anywhere}
.top-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.save-state{font-size:.78rem;color:var(--muted);white-space:nowrap}
.rec-mini{display:flex;align-items:center;gap:8px;background:var(--rec-soft);color:var(--rec);border-radius:999px;padding:4px 4px 4px 12px;font-weight:700}

/* type */
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.lede{color:var(--muted);max-width:62ch;margin-top:6px}
.hint{color:var(--muted);font-size:.86rem}
.meta{color:var(--muted);font-size:.82rem;line-height:1.5}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 12px}
section{min-width:0}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.banner{border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.two > *{min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.93rem;cursor:pointer;text-decoration:none;white-space:nowrap;user-select:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.small{min-height:36px;padding:0 12px;font-size:.86rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--rec)}
.btn.danger-solid{background:var(--rec);border-color:var(--rec);color:var(--tag-ink)}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.field > span,.field legend{font-weight:600;font-size:.9rem}
.field legend{margin-bottom:6px;padding:0}
input[type=text],input:not([type]),input[type=date],input[type=datetime-local],input[type=number],input[type=time],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;line-height:1.5}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip.on{font-weight:700}
.chip.c-a.on{background:var(--a-soft);border-color:var(--a);color:var(--a)}
.chip.c-b.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.c-c.on{background:var(--c-soft);border-color:var(--c);color:var(--c)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-btn{min-width:44px;min-height:44px;padding:0 12px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg-btn:first-child{border-left:0}
.seg-btn.on{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.muted{background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.confirm{background:var(--rec-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--ink);font-size:.9rem}

/* home */
.new-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.new-form .field{flex:1 1 180px}
.new-form .grow{flex:2 1 240px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.proj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.proj-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.proj-top h3{font-size:1.2rem;font-weight:600;overflow-wrap:anywhere}
.proj-target{font-weight:600}
.proj-memo{color:var(--muted);font-size:.88rem}
.dots{display:flex;gap:5px}
.dot{width:100%;max-width:28px;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.dot.s-progress{background:var(--warn-soft);border-color:var(--warn)}
.dot.s-done{background:var(--ok);border-color:var(--ok)}
.card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tools .tool-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* project */
.proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.proc-card{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr auto;column-gap:12px;row-gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink);font:inherit;cursor:pointer;min-height:148px}
.proc-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.proc-no{grid-row:1/5;font-family:var(--font-mono);font-size:.85rem;font-weight:600;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.proc-card.s-done .proc-no{background:var(--ok);color:var(--tag-ink)}
.proc-card.s-progress .proc-no{background:var(--warn-soft);color:var(--warn)}
.proc-title{font-weight:700;font-size:1rem;line-height:1.35}
.proc-desc{color:var(--muted);font-size:.84rem;line-height:1.45}
.proc-foot{display:flex;flex-direction:column;gap:3px;align-items:flex-start;align-self:end}
.proc-detail{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.none{background:var(--sunk);color:var(--muted)}
.status.progress{background:var(--warn-soft);color:var(--warn)}
.status.done{background:var(--ok-soft);color:var(--ok)}
.status.edited{background:var(--ok-soft);color:var(--ok)}
.basic-tag{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
details.card summary{cursor:pointer;font-weight:700}
details.card[open]{gap:14px}

/* procedure page */
.proc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.target-banner{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;flex-wrap:wrap}
.target-banner.empty{background:var(--warn-soft);color:var(--warn);align-items:center;justify-content:space-between}
.tb-label{font-size:.75rem;font-weight:700;letter-spacing:.05em;color:var(--accent);padding-top:2px;white-space:nowrap}
.target-banner p{font-size:.88rem;color:var(--ink);margin-top:2px;white-space:pre-wrap}
.done-bar{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2)}
.done-bar p{font-size:.9rem;color:var(--muted);flex:1 1 260px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
/* 표적행동 정의: 초안 상태·안내·자동 경고 */
.def-warn{display:block;margin-top:3px;color:var(--warn);font-size:.82rem;font-weight:600}
.def-warn:empty{display:none}
.measure-tip{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.86rem;color:var(--ink)}
.measure-tip:empty{display:none}
.stage-tag{font-size:.7rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
details.card.later summary small{font-weight:400;color:var(--muted);margin-left:6px}
/* 행동평정척도: 응답자·점수 행, 첨부 파일 */
.r-list{display:flex;flex-direction:column;gap:10px}
.r-row{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.r-row-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px;align-items:start}
.r-grid.score{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.r-grid.score .wide2{grid-column:span 2}
.r-x{display:flex;align-items:flex-end;justify-content:flex-end;align-self:end;min-height:44px}
.r-file{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.r-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.r-doc{width:64px;height:64px;display:grid;place-items:center;border-radius:8px;background:var(--sunk);font-family:var(--font-mono);font-weight:600;font-size:.8rem;color:var(--muted)}
.r-file-info{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}
.r-file-info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.r-grid.score .wide2{grid-column:1/-1}}

/* QABF */
.q-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;flex-direction:column;align-items:flex-start;min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;line-height:1.3}
.tab small{font-size:.74rem}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab.on small{color:inherit;opacity:.8}
.tab.add{border-style:dashed;color:var(--accent);justify-content:center}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.scale-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.scale-legend b{color:var(--ink)}
.q-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.q-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.q-item:first-child{border-top:0}
.q-left{display:flex;align-items:center;gap:8px}
.q-no{width:30px;font-weight:600;color:var(--muted);text-align:right}
.scale-tag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.q-text{min-width:0;font-size:.93rem}
.q-item .seg-btn{min-width:42px;padding:0 8px;font-family:var(--font-mono)}
.q-item .seg-btn[data-v="X"]{color:var(--muted)}
.q-item .seg-btn.on[data-v="X"]{background:var(--muted);color:var(--surface)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:132px 1fr 56px;grid-template-areas:"l t v" ". s s";gap:2px 12px;align-items:center}
.bar-label{grid-area:l;font-weight:600;font-size:.92rem;line-height:1.25}
.bar-label small{display:block;font-family:var(--font-mono);font-size:.7rem}
.bar-track{grid-area:t;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden;position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),var(--line) calc(20% - 1px) 20%)}
.bar-fill{height:100%;background:var(--line-strong);border-radius:7px}
.bar-row.top .bar-fill{background:var(--accent)}
.bar-row.top .bar-label{color:var(--accent)}
.bar-val{grid-area:v;font-family:var(--font-mono);font-weight:600;text-align:right}
.bar-val small{font-size:.75em}
.bar-sub{grid-area:s;font-size:.76rem;color:var(--muted)}
.result-line{font-weight:600}
.q-items-panel ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q-items-panel li{display:grid;grid-template-columns:30px auto 1fr;gap:8px;align-items:center}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.num{font-family:var(--font-mono);text-align:right}
td.top{color:var(--accent);font-weight:700}

/* ABC */
.rec-card{background:var(--surface);border-color:var(--line-strong)}
.rec-card.live{border-color:var(--rec);background:var(--rec-soft)}
.rec-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rec-btn{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 22px 0 14px;border-radius:999px;border:2px solid var(--rec);background:var(--surface);color:var(--rec);font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer}
.rec-icon{width:36px;height:36px;border-radius:50%;background:var(--rec);display:block;position:relative}
.rec-btn.on{background:var(--rec);color:var(--tag-ink)}
.rec-btn.on .rec-icon{background:var(--tag-ink);border-radius:8px;transform:scale(.62);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.rec-info{display:flex;flex-direction:column;flex:1 1 200px;min-width:0}
.rec-time{font-size:1.6rem;font-weight:600;line-height:1.2}
.rec-status{font-size:.86rem;color:var(--muted)}
.rec-card.live .rec-status{color:var(--rec)}
.mic-help{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.entry-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.time-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.time-row .field{flex:1 1 220px}
.btn.stamp{min-height:52px;font-size:1rem}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.abc-box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface-2)}
.abc-box legend{display:flex;align-items:center;gap:8px;font-weight:700;padding:0 6px;margin-left:-6px}
.g-a{border-top:3px solid var(--a)}
.g-b{border-top:3px solid var(--accent)}
.g-c{border-top:3px solid var(--c)}

function ensureSheet(sh){

  for(const k in base)if(sh[k]==null&&k!=='endedAt')sh[k]=Array.isArray(base[k])?[]:base[k];

/* 예전 버전(기록 하나씩 저장)의 ABC 자료를 날짜별 관찰지로 옮긴다 */
function migrateAbc(p){
  const a=p.procs.abc.data;
  if(!a.records&&!a.draft&&!a.stash)return;
  const old=(a.records||[]).map(ensureRecord);
  [a.draft,a.stash].forEach(d=>{if(d&&!d.editing){ensureRecord(d);if(oldHasContent(d))old.push(d);}});
  old.forEach(r=>{if(!r.time)r.time=r.createdAt||nowISO();});
  old.sort((x,y)=>x.time.localeCompare(y.time));
  const byDay=new Map();
  old.forEach(r=>{const k=dayKey(r.time);if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(r);});
  const join=(arr,other)=>arr.concat(other&&other.trim()?[other.trim()]:[]).join(', ');
  byDay.forEach((rs,k)=>{
    const lines=f=>rs.filter(r=>r[f]&&r[f].trim()).map(r=>`[${fmtTime(r.time)}] ${r[f].trim()}`).join('\n');
    const ctx=Array.from(new Set(rs.map(r=>(r.context||'').trim()).filter(Boolean))).join(' / ');
    const aud=Array.from(new Set([].concat(...rs.map(r=>r.audioIds||[]))));
    a.sheets.push(ensureSheet({id:uid('s'),sessionId:'old-'+k,start:rs[0].time,end:rs[rs.length-1].time,endedAt:rs[rs.length-1].time,
      child:p.code||'',observer:'',place:'',situation:ctx,
      rows:rs.filter(r=>r.type!=='anecdote').map(r=>({id:uid('w'),time:r.time,a:join(r.a,r.aOther),b:[r.b,r.intensity?'강도 '+r.intensity:'',r.duration].filter(Boolean).join(' · '),c:join(r.c,r.cOther)})),
      note:lines('note'),interp:lines('interp'),audioIds:aud,createdAt:rs[0].createdAt||rs[0].time,updatedAt:nowISO()}));
  });
  delete a.records;delete a.draft;delete a.stash;delete a.options;delete a.lastContext;
}

/* ---------- 여러 탭(창) 동시 사용: 3자 병합 ----------
   base = 이 탭이 마지막으로 맞춘 저장 내용, mine = 이 탭의 현재 자료, theirs = 다른 탭이 저장한 내용.
   한쪽만 바꾼 값은 바뀐 쪽을, 양쪽이 같은 값을 바꿨으면 이 탭 것을 쓴다.
   id가 있는 객체 배열(프로젝트·관찰지·행·QABF 양식)은 id로 맞춰 합치므로 서로 추가한 항목이 모두 남는다.
   mine의 객체는 그 자리에서 고치므로(같은 객체 유지) 화면·손글씨 칸이 들고 있는 참조가 끊기지 않는다. */
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const sameJ=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b);
const isIdArr=v=>Array.isArray(v)&&v.every(x=>isObj(x)&&typeof x.id==='string');
function merge3(base,mine,theirs){
  if(isObj(mine)&&isObj(theirs)){
    const b=isObj(base)?base:{};
    for(const k of Object.keys(theirs)){
      if(!(k in mine)){if(!(k in b)||!sameJ(b[k],theirs[k]))mine[k]=theirs[k];}/* 다른 탭에서 새로 생긴 칸 (이 탭이 지운 칸은 그쪽이 안 바꿨으면 지운 채로) */
      else mine[k]=merge3(b[k],mine[k],theirs[k]);
    }
    for(const k of Object.keys(mine))if(!(k in theirs)&&(k in b)&&sameJ(b[k],mine[k]))delete mine[k];/* 다른 탭에서 지운 칸 */
    return mine;
  }
  if(isIdArr(mine)&&isIdArr(theirs)&&mine.length+theirs.length>0){
    const bm=new Map((isIdArr(base)?base:[]).map(x=>[x.id,x]));
    const mm=new Map(mine.map(x=>[x.id,x])),tm=new Map(theirs.map(x=>[x.id,x]));
    const out=[];
    const keep=(id)=>{
      const m=mm.get(id),t=tm.get(id),bb=bm.get(id);
      if(m&&t)return merge3(bb,m,t);
      if(m)return !bb||!sameJ(bb,m)?m:null;/* 다른 탭에서 지웠고 이 탭은 안 고쳤으면 지운다 */
      return !bb||!sameJ(bb,t)?t:null;/* 이 탭에서 지웠고 다른 탭은 안 고쳤으면 지운다 */
    };
    const seen=new Set();
    /* 순서: 이 탭 순서를 따르고, 다른 탭에만 있는 항목은 그 앞 항목 뒤에 끼운다 */
    const order=[];mine.forEach(x=>order.push(x.id));
    theirs.forEach((x,i)=>{if(mm.has(x.id))return;let j=-1;for(let q=i-1;q>=0;q--){j=order.indexOf(theirs[q].id);if(j>=0)break;}order.splice(j+1,0,x.id);});
    order.forEach(id=>{if(seen.has(id))return;seen.add(id);const v=keep(id);if(v)out.push(v);});
    if(mine.length===out.length&&out.every((x,i)=>x===mine[i]))return mine;
    mine.length=0;out.forEach(x=>mine.push(x));return mine;/* 배열도 같은 객체 유지 */
  }
  if(sameJ(base,mine))return theirs;
  return mine;
}
let remoteDirty=false;
/* 다른 탭이 저장한 내용(raw)을 이 탭 자료에 합친다. 합친 결과가 이 탭 화면과 달라졌으면 true */
function absorbRemote(raw){
  let theirs,base=null;
  try{theirs=JSON.parse(raw);}catch(e){return false;}
  if(!theirs||!Array.isArray(theirs.projects))return false;
  try{base=syncedRaw?JSON.parse(syncedRaw):null;}catch(e){base=null;}
  const myUi=store.ui;
  const before=JSON.stringify(store.projects)+JSON.stringify(store.settings);
  delete theirs.ui;if(base)delete base.ui;delete store.ui;/* 보고 있는 화면은 탭마다 따로 */
  merge3(base||{},store,theirs);
  store.ui=myUi;
  store.settings=store.settings||{};store.settings.qabfItems=store.settings.qabfItems||{};
  store.projects.forEach(ensureProject);
  syncedRaw=raw;
  return before!==JSON.stringify(store.projects)+JSON.stringify(store.settings);
}

/* audio store (IndexedDB) */
let audioOK=true;
const AudioDB={
  db:null,
  open(){
    if(this.db)return Promise.resolve(this.db);
    return new Promise((res,rej)=>{
      let req;try{req=indexedDB.open('pbs-observe-audio',1);}catch(e){rej(e);return;}
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('audio')){const s=db.createObjectStore('audio',{keyPath:'id'});s.createIndex('projectId','projectId');}};
      req.onsuccess=()=>{this.db=req.result;res(this.db);};
      req.onerror=()=>rej(req.error);
      req.onblocked=()=>rej(new Error('blocked'));
    });
  },
  async run(mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const t=db.transaction('audio',mode);const s=t.objectStore('audio');let out;
      const r=fn(s);if(r)r.onsuccess=()=>{out=r.result;};
      t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
    });
  },
  async put(id,projectId,blob,duration,createdAt){
    const buf=await blob.arrayBuffer();
    return this.run('readwrite',s=>s.put({id,projectId,buf,mime:blob.type||'audio/webm',duration:duration||null,createdAt:createdAt||nowISO()}));
  },
  async getBlob(id){
    const r=await this.run('readonly',s=>s.get(id));
    if(!r||!r.buf)return null;
    return {blob:new Blob([r.buf],{type:r.mime}),mime:r.mime,duration:r.duration,createdAt:r.createdAt};
  },
  del(id){return this.run('readwrite',s=>s.delete(id));},
  async delByProject(pid){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const t=db.transaction('audio','readwrite');const req=t.objectStore('audio').index('projectId').openCursor(IDBKeyRange.only(pid));
      req.onsuccess=()=>{const c=req.result;if(c){c.delete();c.continue();}};
      t.oncomplete=()=>res();t.onerror=()=>rej(t.error);
    });
  }
};

function qabfScores(f){
  return QABF_SCALES.map((s,i)=>{
    let total=0,endorsed=0,answered=0,na=0;
    for(let k=0;k<5;k++){
      const n=i+1+k*5;const v=f.ratings[n];
      if(v==null||v==='')continue;
      answered++;
      if(v==='X'){na++;continue;}
      const x=Number(v);total+=x;if(x>0)endorsed++;
    }
    return Object.assign({},s,{total,endorsed,answered,na});
  });
}

function tally(rows,f){
  const m=new Map();
  rows.forEach(r=>{const seen=new Set();String(r[f]||'').split(/[,，;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(v=>{if(seen.has(v))return;seen.add(v);m.set(v,(m.get(v)||0)+1);});});
  return Array.from(m.entries()).sort((a,b)=>b[1]-a[1]);
}

function defWarnings(d){
  const w={};

  if(miss.length)w[3]=miss.join('과 ')+'이 비어 있습니다.';
  const txt=[d.name,d.definition,d.start,d.end].join(' ');

}

/* 2. QABF */
function viewQabf(p){
  const q=p.procs.qabf.data;const f=activeForm(p);
  const tabs=q.forms.map(fm=>`<button type="button" class="tab${f&&fm.id===f.id?' on':''}" data-act="qform" data-id="${fm.id}">${esc(fm.rater||'응답자 미입력')}<small>${esc([fm.role,fm.date?fm.date.slice(5).replace('-','/'):''].filter(Boolean).join(' · ')||' ')}</small></button>`).join('');
  return `
  <section class="q-top">
    <div class="tabs" id="q-tabs">${tabs}<button type="button" class="tab add" data-act="qadd">+ 응답지 추가</button></div>
    <button type="button" class="btn small" data-act="qitems">${ui.qItemsOpen?'문항 문구 설정 닫기':'문항 문구 설정'}</button>
  </section>
  ${ui.qItemsOpen?qItemsPanel():''}
  ${f?qFormView(p,f):`<div class="empty">아직 응답지가 없습니다. 교사·보호자 등 응답자마다 응답지를 하나씩 추가하세요.<button type="button" class="btn primary" data-act="qadd">응답지 추가</button></div>`}
  ${q.forms.length>1?qCompare(q.forms):''}
  <p class="hint">QABF(Questions About Behavioral Function; Matson &amp; Vollmer, 1995)는 25문항, 5개 하위척도(문항당 0~3점, 척도당 5문항)로 구성됩니다. 문항 번호와 하위척도 배정은 원판 채점지를 따릅니다. 25문항의 한국어 문구가 기본으로 들어 있습니다. 기관에서 쓰는 번안본과 문구가 다르면 '문항 문구 설정'에서 고치면 모든 프로젝트에 적용됩니다.</p>`;
}
function qItemsPanel(){
  const items=store.settings.qabfItems;
  return `<section class="card q-items-panel">
    <div class="sec-head"><h2 class="h3">문항 문구 설정</h2><span class="hint">모든 프로젝트에 공통으로 적용됩니다</span></div>
    <ol>${Array.from({length:25},(_,i)=>{const n=i+1;const s=QABF_SCALES[i%5];return `<li><span class="q-no mono">${n}</span><span class="scale-tag">${s.name}</span><input id="qtext-${n}" data-f="qitem:${n}" value="${esc(items[n]||'')}" placeholder="문항 ${n} 문구"></li>`;}).join('')}</ol>
  </section>`;
}
function qFormView(p,f){
  const roles=['','담임교사','특수교사','보호자','보조인력','기타'];
  return `
  <section class="card">
    <div class="grid-4">
      <label class="field"><span>응답자</span><input id="qf-rater" data-f="qform:rater" value="${esc(f.rater)}" placeholder="예: 담임교사 A"></label>
      <label class="field"><span>관계</span><select id="qf-role" data-f="qform:role">${roles.map(r=>`<option value="${r}"${f.role===r?' selected':''}>${r||'선택'}</option>`).join('')}</select></label>
      <label class="field"><span>작성일</span><input type="date" id="qf-date" data-f="qform:date" value="${esc(f.date)}"></label>
      <label class="field"><span>평가한 행동</span><input id="qf-beh" data-f="qform:behavior" value="${esc(f.behavior)}"></label>
    </div>
  </section>
  <section class="card" id="q-result">${qResult(f)}</section>
  <section class="card">
    <div class="sec-head"><h2 class="h3">문항 응답</h2><span class="meta" id="q-count">응답 ${qAnswered(f)}/25</span></div>
    <p class="scale-legend">${QABF_OPTS.map(o=>`<span><b class="mono">${o.v}</b> ${o.full}</span>`).join('')}</p>
    <ol class="q-list">${Array.from({length:25},(_,i)=>qItemRow(f,i+1)).join('')}</ol>
  </section>
  <section class="card">
    <label class="field"><span>메모</span><textarea id="qf-note" data-f="qform:note" rows="3" placeholder="응답 상황, 특이사항">${esc(f.note)}</textarea></label>
    <div class="row end"><button type="button" class="btn small ghost danger" data-act="ask" data-key="del-qform:${f.id}">이 응답지 삭제</button></div>
    ${ui.confirm==='del-qform:'+f.id?confirmBox('이 응답지를 삭제합니다. 되돌릴 수 없습니다.','del-qform',f.id):''}
  </section>`;
}
function qItemRow(f,n){
  const s=QABF_SCALES[(n-1)%5];const v=f.ratings[n]==null?'':f.ratings[n];const txt=store.settings.qabfItems[n];
  return `<li class="q-item" id="q-${n}">
    <div class="q-left"><span class="q-no mono">${n}</span><span class="scale-tag">${s.name}</span></div>
    <p class="q-text">${txt?esc(txt):`<span class="muted">문항 ${n}</span>`}</p>
    <div class="seg" role="group" aria-label="문항 ${n} 응답">${QABF_OPTS.map(o=>`<button type="button" class="seg-btn${v===o.v?' on':''}" data-act="qrate" data-n="${n}" data-v="${o.v}" aria-pressed="${v===o.v}" title="${o.full}">${o.v}</button>`).join('')}</div>
  </li>`;
}
function qResult(f){
  const sc=qabfScores(f);const ans=qAnswered(f);const max=Math.max.apply(null,sc.map(s=>s.total));
  const tops=sc.filter(s=>s.total===max&&max>0);
  let line;
  if(!ans)line='문항에 응답하면 하위척도 점수가 계산됩니다.';
  else if(!tops.length)line='모든 하위척도가 0점입니다.';
  else line=`가장 높은 척도: ${tops.map(s=>s.name).join(', ')} (${max}점)`;
  return `<div class="sec-head"><h2 class="h3">결과</h2><span class="meta">${ans<25?`미응답 ${25-ans}문항`:'25문항 모두 응답'}</span></div>
  <p class="result-line">${line}</p>
  <div class="bars">${sc.map(s=>`<div class="bar-row${tops.includes(s)?' top':''}">
    <span class="bar-label">${s.name}<small>${s.en}</small></span>
    <div class="bar-track" role="img" aria-label="${s.name} ${s.total}점 (15점 만점)"><div class="bar-fill" style="width:${(s.total/15*100).toFixed(1)}%"></div></div>
    <span class="bar-val">${s.total}<small>/15</small></span>
    <span class="bar-sub">1점 이상 ${s.endorsed}/5문항${s.na?` · 해당 없음 ${s.na}`:''}${s.answered<5?` · 미응답 ${5-s.answered}`:''}</span>
  </div>`).join('')}</div>
  <p class="hint">점수는 하위척도별 5문항의 합(0~15점)입니다. X(해당 없음)는 점수에 넣지 않고 따로 셉니다. 해석 기준은 검사 지침서를 따르고, 두 척도 이상이 비슷하게 높으면 여러 기능이 함께 작용할 수 있습니다.</p>`;
}
function qCompare(forms){
  const all=forms.map(f=>qabfScores(f));
  const maxes=all.map(sc=>Math.max.apply(null,sc.map(s=>s.total)));
  return `<section class="card"><h2 class="h3">응답자별 비교</h2><div class="table-wrap"><table>
    <thead><tr><th>하위척도</th>${forms.map(f=>`<th>${esc(f.rater||'응답자 미입력')}${f.role?` <small>${esc(f.role)}</small>`:''}</th>`).join('')}</tr></thead>
    <tbody>${QABF_SCALES.map((s,i)=>`<tr><td>${s.name}</td>${all.map((sc,j)=>`<td class="num${sc[i].total===maxes[j]&&maxes[j]>0?' top':''}">${sc[i].total}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></section>`;
}

/* 4. ABC */
function abcData(p){return p.procs.abc.data;}
function sheetById(p,id){return abcData(p).sheets.find(x=>x.id===id)||null;}
function activeSheet(p){const s=abcData(p).session;if(!s||!s.running)return null;return sheetById(p,s.activeSheetId);}
function isActive(p,sh){const s=abcData(p).session;return !!(s&&s.running&&s.activeSheetId===sh.id);}
function byStart(x,y){return (x.start||'').localeCompare(y.start||'');}
function sessionSheets(p,sid){return abcData(p).sheets.filter(x=>x.sessionId===sid).sort(byStart);}
function sheetNo(p,sh){return sessionSheets(p,sh.sessionId).indexOf(sh)+1;}
function rangeText(sh){return `${fmtTime(sh.start)} ~ ${fmtTime(sh.endedAt||sh.end)}`;}
function msLeft(sh){return Math.max(0,Date.parse(sh.end)-Date.now());}
function rowFilled(r){return !!(r.time||r.a.trim()||r.b.trim()||r.c.trim());}
function allRows(p){const out=[];abcData(p).sheets.forEach(sh=>sh.rows.forEach(r=>{if(rowFilled(r))out.push(r);}));return out;}
function onAbcPage(p){return !!(p&&ui.view==='proc'&&ui.proc==='abc'&&ui.projectId===p.id);}
function timeOnDay(baseISO,v){
  if(!v)return null;
  const [h,m,sec]=v.split(':').map(Number);if(isNaN(h))return null;
  const d=new Date(baseISO);d.setHours(h,m||0,sec||0,0);return d.toISOString();
}

    <div class="rec-info"><span class="rec-time mono" id="rec-time">00:00</span><span class="rec-status" id="rec-status"></span></div>

  </section>

function hypoSentence(p){

/* ---------- recorder ---------- */
/* 녹음은 '구간(segment)' 단위로 저장한다. 관찰지가 바뀌면 같은 마이크 스트림에서
   새 구간을 먼저 시작하고 이전 구간을 정지해, 끊김 없이 관찰지마다 파일이 나뉜다. */
const rec={state:'idle',stream:null,seg:null,timer:null,wake:null};
function pickMime(){
  if(typeof MediaRecorder==='undefined'||!MediaRecorder.isTypeSupported)return '';
  return ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}})||'';
}
function micHelpHTML(reason){
  const head={
    NotAllowedError:'마이크를 사용할 수 없습니다.',
    SecurityError:'마이크를 사용할 수 없습니다.',
    NotFoundError:'마이크를 찾지 못했습니다. 마이크가 연결되어 있는지 확인하세요.',
    NotReadableError:'다른 앱이 마이크를 쓰고 있어 녹음을 시작하지 못했습니다.',
    unsupported:'이 브라우저는 녹음을 지원하지 않습니다.',
    nostore:'이 브라우저에서는 녹음 파일을 저장할 수 없습니다.'
  }[reason]||'녹음을 시작하지 못했습니다.';
  return `<b>${head}</b>
  <span>· 브라우저가 마이크 권한을 물으면 '허용'을 누르세요. 이미 거부했다면 주소창 왼쪽의 사이트 설정에서 마이크를 허용으로 바꾼 뒤 새로고침하세요.</span>
  <span>· Claude 화면 안에서 이 페이지를 열었다면 그 안에서는 마이크가 막혀 있습니다. 이 파일을 HTTPS 주소(예: GitHub Pages)에 올려 크롬이나 사파리로 열면 바로 녹음할 수 있습니다.</span>
  <span>· 지금 바로 쓰려면 휴대폰 녹음 앱으로 녹음한 뒤 '녹음 파일 첨부'로 붙이세요.</span>`;
}
function showMicHelp(reason){
  ui.micHelp=micHelpHTML(reason);
  const el=$('#mic-help');if(el){el.innerHTML=ui.micHelp;el.hidden=false;}
  else toast('녹음을 시작하지 못했습니다');
}
function newSegment(target){
  const mime=pickMime();let mr;
  try{mr=mime?new MediaRecorder(rec.stream,{mimeType:mime}):new MediaRecorder(rec.stream);}
  catch(e){mr=new MediaRecorder(rec.stream);}
  const seg={mr,chunks:[],target,startedAt:Date.now(),startISO:nowISO(),done:false};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)seg.chunks.push(e.data);};
  mr.onstop=()=>finishSegment(seg);
  mr.onerror=()=>{toast('녹음 중 오류가 생겼습니다. 지금까지 녹음한 부분을 저장합니다.');try{mr.stop();}catch(e){finishSegment(seg);}};
  mr.start(1000);
  return seg;
}
/* resolveTarget: 마이크를 얻은 뒤에 호출되어 {projectId, sheetId}를 돌려준다 */
async function startRecording(resolveTarget){
  if(rec.state!=='idle'){toast('이미 녹음 중입니다. 먼저 정지하세요.');return;}
  if(!audioOK){showMicHelp('nostore');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){showMicHelp('unsupported');return;}
  rec.state='starting';updateRecUI();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){rec.state='idle';updateRecUI();showMicHelp(e&&e.name);return;}
  rec.stream=stream;
  let seg;
  try{seg=newSegment(resolveTarget());}
  catch(e){stream.getTracks().forEach(t=>t.stop());rec.stream=null;rec.state='idle';updateRecUI();showMicHelp('unsupported');return;}
  ui.micHelp='';const mh=$('#mic-help');if(mh)mh.hidden=true;
  rec.seg=seg;rec.state='recording';
  stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>{if(rec.state==='recording'&&rec.stream===stream)stopRecording();}));
  clearInterval(rec.timer);rec.timer=setInterval(updateRecUI,500);
  requestWake();updateRecUI();
}
function stopRecording(){
  if(rec.state!=='recording')return;
  rec.state='stopping';updateRecUI();
  const seg=rec.seg;try{seg.mr.stop();}catch(e){finishSegment(seg);}
}
/* 관찰지가 바뀔 때: 진행 중이던 녹음은 이전 관찰지에 저장하고, 새 관찰지로 이어서 녹음 */
function rolloverRecording(target){
  if(rec.state!=='recording'||!rec.seg)return;
  const old=rec.seg;let seg;
  try{seg=newSegment(target);}catch(e){stopRecording();return;}
  rec.seg=seg;
  try{old.mr.stop();}catch(e){finishSegment(old);}
  updateRecUI();
}
async function finishSegment(seg){
  if(seg.done)return;seg.done=true;
  const dur=(Date.now()-seg.startedAt)/1000;
  const type=(seg.mr&&seg.mr.mimeType)||pickMime()||'audio/webm';
  const blob=new Blob(seg.chunks,{type});seg.chunks=[];
  const last=rec.seg===seg;
  if(last){
    clearInterval(rec.timer);rec.timer=null;
    if(rec.stream)rec.stream.getTracks().forEach(t=>t.stop());
    Object.assign(rec,{stream:null,seg:null,state:'idle'});
    releaseWake();
  }
  updateRecUI();
  if(!blob.size){if(last)toast('녹음된 소리가 없어 저장하지 않았습니다');return;}
  await attachAudio(seg.target,blob,dur,seg.startISO,!last);
}
async function attachAudio(target,blob,duration,createdAt,quiet){
  const p=projById(target.projectId);
  if(!p){toast('프로젝트를 찾을 수 없어 녹음을 저장하지 못했습니다');return;}
  const id=uid('a');
  try{await AudioDB.put(id,p.id,blob,duration,createdAt);}
  catch(e){toast('녹음을 저장하지 못했습니다. 저장 공간을 확인하세요.');return;}
  const a=abcData(p);
  a.audio[id]={duration:duration||null,mime:blob.type,createdAt,size:blob.size};
  let sh=target.sheetId?sheetById(p,target.sheetId):null;
  let created=false;
  if(!sh){
    sh=makeSheet(p,uid('one'),createdAt,null);
    sh.endedAt=new Date(Date.parse(createdAt)+(duration||0)*1000).toISOString();
    a.sheets.push(sh);created=true;
  }
  sh.audioIds.push(id);sh.updatedAt=nowISO();
  touch(p,'abc');saveNow();persistStorage();
  if(onAbcPage(p)){
    const box=$('#aud-'+sh.id);
    if(box&&!created){box.innerHTML=sheetAudio(p,sh);const h=$('#shh-'+sh.id);if(h)h.innerHTML=sheetHead(p,sh);hydrateAudio();refreshSummary(p);}
    else renderAbcAll();
  }
  if(!quiet)toast(created?'녹음만 있는 관찰지를 새로 만들어 저장했습니다':'녹음을 관찰지에 저장했습니다');
  updateUsage();
}
function recTargetText(){
  const t=rec.seg&&rec.seg.target;if(!t)return '녹음 중';
  const p=projById(t.projectId);if(!p)return '녹음 중';
  const sh=sheetById(p,t.sheetId);if(!sh)return '녹음 중';
  const other=p.id!==ui.projectId?`${p.code} 프로젝트 `:'';
  return `녹음 중 · ${other}관찰지 ${sheetNo(p,sh)} (${rangeText(sh)})에 저장됩니다. 관찰 간격이 끝나면 저장하고 다음 관찰지에서 이어 녹음합니다.`;
}
function updateRecUI(){
  const on=rec.state==='recording'||rec.state==='stopping';
  const sec=on&&rec.seg?(Date.now()-rec.seg.startedAt)/1000:0;
  const btn=$('#rec-btn');
  if(btn){
    btn.classList.toggle('on',on);btn.setAttribute('aria-pressed',String(on));
    btn.disabled=rec.state==='starting'||rec.state==='stopping';
    btn.querySelector('.rec-label').textContent=rec.state==='starting'?'마이크 준비 중…':rec.state==='stopping'?'저장 중…':on?'녹음 정지':'녹음 시작';
    const card=$('#rec-card');if(card)card.classList.toggle('live',on);
    $('#rec-time').textContent=fmtDur(sec);
    $('#rec-status').textContent=on?recTargetText():'녹음은 기록 중인 관찰지에 저장됩니다. 녹음하는 동안에도 아래 관찰지에 기록할 수 있습니다.';
  }
  const mini=$('#rec-mini');
  const p=curProject();
  const showMini=on&&!(onAbcPage(p)&&rec.seg&&rec.seg.target.projectId===ui.projectId);
  mini.hidden=!showMini;
  if(on)$('#rec-mini-time').textContent='● '+fmtDur(sec);
}

function releaseWake(){try{if(rec.wake)rec.wake.release();}catch(e){}rec.wake=null;}

/* dictation */
let dict=null,dictSid=null;
function stopDictation(){if(dict){try{dict.stop();}catch(e){}dict=null;}dictSid=null;}
function toggleDictation(sid){
  if(!SR){toast('이 브라우저는 받아쓰기를 지원하지 않습니다');return;}
  if(dict){const was=dictSid;stopDictation();updDict();if(was===sid)return;}
  const p=curProject();if(!p)return;
  const r=new SR();r.lang='ko-KR';r.continuous=true;r.interimResults=false;
  r.onresult=e=>{
    let txt='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)txt+=e.results[i][0].transcript;
    txt=txt.trim();if(!txt)return;
    const sh=sheetById(p,sid);if(!sh)return;
    sh.note=sh.note?sh.note.replace(/\s*$/,' ')+txt:txt;sh.updatedAt=nowISO();
    const ta=$('#sf-'+sid+'-note');if(ta)ta.value=sh.note;touch(p,'abc');
  };
  r.onerror=e=>{toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'마이크 권한이 없어 받아쓰기를 할 수 없습니다':e.error==='network'?'받아쓰기는 인터넷 연결이 필요합니다':'받아쓰기가 멈췄습니다 ('+e.error+')');};
  r.onend=()=>{if(dict===r){dict=null;dictSid=null;}updDict();};
  try{r.start();dict=r;dictSid=sid;}catch(e){dict=null;dictSid=null;toast('받아쓰기를 시작하지 못했습니다');}
  updDict();
}
function updDict(){$$('[data-act="dictate"]').forEach(b=>{b.textContent=dictSid===b.dataset.sid?'받아쓰기 멈춤':'받아쓰기 (말로 입력)';});}

/* ---------- files ---------- */
async function offerFile(filename,blob){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){
        try{await dl.save({filename,data:blob});return true;}
        catch(e){
          if(e&&e.code==='declined'){toast('저장을 취소했습니다');return false;}
          if(e&&e.code==='rejected_extension'){toast('이 화면에서는 이 형식의 파일을 저장할 수 없습니다');return false;}
          toast('파일을 저장하지 못했습니다'+(e&&e.message?': '+e.message:''));return false;
        }
      }
    }
  }catch(e){}
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);return true;
  }catch(e){toast('파일을 저장하지 못했습니다');return false;}
}
function blobToB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob);});}
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||'audio/webm'});}
function audioExt(mime){mime=mime||'';return mime.includes('mp4')||mime.includes('m4a')||mime.includes('aac')?'mp4':mime.includes('ogg')?'ogg':mime.includes('mpeg')||mime.includes('mp3')?'mp3':mime.includes('wav')?'wav':'webm';}
async function exportProjects(projs,withAudio,filename){
  toast('백업 파일을 만드는 중…');
  const audio=[];let missing=0;
  if(withAudio&&audioOK){
    for(const p of projs){
      for(const id of blobIds(p)){
        try{const r=await AudioDB.getBlob(id);if(r)audio.push({id,projectId:p.id,mime:r.mime,duration:r.duration,createdAt:r.createdAt,data:await blobToB64(r.blob)});else missing++;}catch(e){missing++;}
      }
    }
  }
  const payload={format:'pbs-observe-backup',version:1,exportedAt:nowISO(),withAudio:!!withAudio,settings:store.settings,projects:projs,audio};
  const ok=await offerFile(filename,new Blob([JSON.stringify(payload)],{type:'application/json'}));
  if(ok){const t=nowISO();projs.forEach(p=>p.lastBackupAt=t);saveNow();render();toast(missing?`백업 파일을 내보냈습니다 (이 브라우저에 없는 녹음 ${missing}개 제외)`:'백업 파일을 내보냈습니다');}
}
/* IndexedDB에 넣는 파일 id: ABC 녹음 + 행동평정척도 첨부 파일 */
function blobIds(p){return Object.keys(p.procs.abc.data.audio||{}).concat(((p.procs.rating&&p.procs.rating.data&&p.procs.rating.data.files)||[]).map(f=>f.id));}
function remapAudio(p,map){
  (p.procs.rating.data.files||[]).forEach(f=>{if(map[f.id])f.id=map[f.id];});
  const a=p.procs.abc.data;const na={};
  Object.keys(a.audio).forEach(k=>{na[map[k]||k]=a.audio[k];});a.audio=na;
  a.sheets.forEach(x=>{x.audioIds=x.audioIds.map(y=>map[y]||y);});
}
async function importBackup(file){
  let data;
  try{data=JSON.parse(await file.text());}catch(e){toast('파일을 읽지 못했습니다. 이 프로그램에서 내보낸 .json 파일인지 확인하세요.');return;}
  if(!data||data.format!=='pbs-observe-backup'||!Array.isArray(data.projects)){toast('이 프로그램의 백업 파일이 아닙니다');return;}
  const audioById=new Map((data.audio||[]).map(x=>[x.id,x]));
  let added=0,copies=0,audioIn=0;
  for(const src of data.projects){
    const p=ensureProject(clone(src));delete p.shared;if(p.procs.abc.data.session)p.procs.abc.data.session.running=false;
    const clash=store.projects.some(x=>x.id===p.id);
    const map={};const srcIds=blobIds(p);
    if(clash){p.id=uid('p');p.code=p.code+' (불러옴)';copies++;srcIds.forEach(k=>map[k]=uid('a'));remapAudio(p,map);}
    for(const oldId of srcIds){
      const au=audioById.get(oldId);if(!au||!audioOK)continue;
      try{await AudioDB.put(map[oldId]||oldId,p.id,b64ToBlob(au.data,au.mime),au.duration,au.createdAt);audioIn++;}catch(e){}
    }
    store.projects.push(p);added++;
  }
  if(data.settings&&data.settings.qabfItems){const cur=store.settings.qabfItems;Object.keys(data.settings.qabfItems).forEach(k=>{if(!cur[k]&&data.settings.qabfItems[k])cur[k]=data.settings.qabfItems[k];});}
  saveNow();render();updateUsage();
  toast(`프로젝트 ${added}개를 불러왔습니다`+(audioIn?` (녹음 ${audioIn}개)`:'')+(copies?` · 이미 있던 ${copies}개는 사본으로 추가`:''));
}
async function duplicateProject(p){
  const c=ensureProject(clone(p));delete c.shared;c.id=uid('p');c.code=p.code+' (복사본)';c.example=false;c.lastBackupAt=null;if(c.procs.abc.data.session)c.procs.abc.data.session.running=false;c.createdAt=c.updatedAt=nowISO();
  const map={};blobIds(c).forEach(k=>map[k]=uid('a'));remapAudio(c,map);

  store.projects.push(c);saveNow();render();updateUsage();toast('프로젝트를 복제했습니다');
}

async function deleteAudio(p,id){

function exportCSV(p){

async function getAudioDuration(blob){
  return new Promise(res=>{
    const a=document.createElement('audio');const u=URL.createObjectURL(blob);let done=false;
    const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);res(v);};

/* ---------- observation sessions (관찰지 이어 붙이기) ---------- */
/* 관찰 시작·최종 종료 시간("HH:MM")을 실제 시각으로 바꾼다 */
function atClock(baseMs,hm){const [h,m]=hm.split(':').map(Number);const d=new Date(baseMs);d.setHours(h,m||0,0,0);return d.getTime();}
function planStartToday(p){const ps=abcData(p).plan.start;return ps?new Date(atClock(Date.now(),ps)).toISOString():null;}
/* 세션 시작 시각 뒤에 처음 오는 최종 종료 시각 (자정을 넘기는 관찰도 처리) */
function planEndAfter(p,startISO){
  const pe=abcData(p).plan.end;if(!pe)return null;
  const st=Date.parse(startISO);let e=atClock(st,pe);if(e<=st)e+=86400000;
  return new Date(e).toISOString();
}
function sheetEnd(p,startISO,endAt){
  let e=Date.parse(startISO)+abcData(p).interval*60000;
  if(endAt)e=Math.min(e,Date.parse(endAt));
  return new Date(e).toISOString();
}
function makeSheet(p,sessionId,startISO,prev,endAt,id){
  const a=abcData(p);
  const src=prev||a.sheets.slice().sort(byStart).pop()||null;
  const t=nowISO();
  return ensureSheet({id:id||uid('s'),sessionId,start:startISO,end:sheetEnd(p,startISO,endAt),endedAt:null,
    child:src?src.child:(p.code||''),observer:src?src.observer:'',place:src?src.place:'',situation:src?src.situation:'',
    rows:[],note:'',interp:'',audioIds:[],createdAt:t,updatedAt:t});
}
function startSession(p,startISO,sid){
  const a=abcData(p);
  if(a.session&&a.session.running)endSession(p,true);
  startISO=startISO||nowISO();
  const s={id:sid||uid('n'),running:true,activeSheetId:null,endAt:planEndAfter(p,startISO)};
  const sh=makeSheet(p,s.id,startISO,null,s.endAt,sid?'s'+sid:null);
  a.sheets.push(sh);s.activeSheetId=sh.id;a.session=s;
  touch(p,'abc');saveNow();persistStorage();
  return sh;
}
function endSession(p,quiet){
  const a=abcData(p);const s=a.session;if(!s||!s.running)return;
  const sh=sheetById(p,s.activeSheetId);
  if(sh)sh.endedAt=new Date(Math.min(Date.now(),Date.parse(sh.end))).toISOString();
  s.running=false;
  if(rec.state==='recording'&&rec.seg&&rec.seg.target.projectId===p.id)stopRecording();
  touch(p,'abc');saveNow();
  if(!quiet)toast('관찰을 종료했습니다');
}
function rollover(p,old){
  const a=abcData(p);const s=a.session;
  const now=Date.now(),oldEnd=Date.parse(old.end),iv=a.interval*60000;
  const recHere=rec.state==='recording'&&rec.seg&&rec.seg.target.projectId===p.id&&rec.seg.target.sheetId===old.id;
  old.endedAt=old.end;
  if(s.endAt&&oldEnd>=Date.parse(s.endAt)){
    /* 최종 종료 시간이 되었다: 관찰지를 더 붙이지 않고 관찰을 끝낸다. 작성 중인 화면은 그대로 둔다 */
    s.running=false;
    if(recHere)stopRecording();
    touch(p,'abc');saveNow();
    if(onAbcPage(p))keepView(()=>{markSheetEnded(p,old);const b=$('#obs-ctrl-btn');if(b)b.innerHTML=obsCtrlBtn(p);refreshSummary(p);updateLive();updateRecUI();});
    toast(`최종 종료 시간(${fmtTime(s.endAt)})이 되어 관찰을 마쳤습니다`);
    return;
  }
  if(now-oldEnd>=iv&&!recHere){
    /* 화면이 꺼져 있는 등 한 간격 이상 지나 버린 경우: 빈 관찰지를 만들지 않고 관찰을 끝낸다 */
    s.running=false;touch(p,'abc');saveNow();
    if(onAbcPage(p))renderAbcAll();
    toast('관찰 간격이 한참 지나 관찰을 종료했습니다. 이어서 하려면 새 관찰을 시작하세요.');
    return;
  }
  const startMs=now-oldEnd<iv?oldEnd:now;
  /* 같은 프로젝트를 여러 탭에서 열어 두어도 두 탭이 같은 관찰지를 만들도록 id를 정해서 붙인다(합칠 때 하나로 합쳐짐) */
  const nw=makeSheet(p,s.id,new Date(startMs).toISOString(),old,s.endAt,'s'+s.id+'-'+startMs.toString(36));
  /* 새 관찰지에는 시작 시각이 적힌 빈 행을 하나 넣어 둔다 */
  nw.rows.push({id:'w'+nw.id,time:nw.start,a:'',b:p.procs.define.data.name||'',c:''});
  a.sheets.push(nw);s.activeSheetId=nw.id;
  if(recHere)rolloverRecording({projectId:p.id,sheetId:nw.id});
  touch(p,'abc');saveNow();
  if(onAbcPage(p)){
    /* 새 관찰지는 아래에 붙이고, 보고 있던 위치·입력 중인 칸은 그대로 둔다 */
    keepView(()=>{
      markSheetEnded(p,old);
      const box=$('#sheets-current');
      if(box)box.insertAdjacentHTML('beforeend',sheetView(p,nw));
      refreshSummary(p);updateLive();updateRecUI();
    });
  }
  toast(`${a.interval}분이 지나 새 관찰지를 추가했습니다`+(recHere?' · 녹음은 저장하고 다시 시작했습니다':''));
}
function markSheetEnded(p,old){
  const oe=$('#sh-'+old.id);if(!oe)return;
  oe.classList.remove('active');
  const h=$('#shh-'+old.id);if(h)h.innerHTML=sheetHead(p,old);
  const r=$('#shr-'+old.id);if(r)r.textContent=rangeText(old);
  const foot=oe.querySelector('.sheet-foot');
  if(foot&&!foot.querySelector('[data-key="del-sheet:'+old.id+'"]'))foot.insertAdjacentHTML('beforeend',`<div class="row end"><button type="button" class="btn small ghost danger" data-act="ask" data-key="del-sheet:${old.id}">이 관찰지 삭제</button></div>`);
}
function keepView(fn){
  const x=window.scrollX,y=window.scrollY;const ae=document.activeElement;let ss=null,se=null;
  try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){}
  fn();
  if(ae&&ae!==document.body&&document.contains(ae)&&document.activeElement!==ae){try{ae.focus({preventScroll:true});if(ss!=null&&ae.setSelectionRange)ae.setSelectionRange(ss,se);}catch(e){}}
  if(window.scrollX!==x||window.scrollY!==y)window.scrollTo(x,y);
}
/* 관찰 시작 시간이 되면 저절로 관찰을 시작한다 (하루에 한 번) */
function planAutoStart(p){
  const a=abcData(p);const ps=a.plan.start;if(!ps)return;
  const now=Date.now();const st=atClock(now,ps);if(now<st)return;
  const key=dayKey(new Date(st).toISOString())+' '+ps;if(a.plan.fired===key)return;
  if(a.session&&a.session.running){a.plan.fired=key;scheduleSave();return;}
  const end=planEndAfter(p,new Date(st).toISOString());
  const late=end?now>=Date.parse(end):now-st>=a.interval*60000;
  a.plan.fired=key;
  if(late){scheduleSave();return;}
  startSession(p,new Date(now-st<60000?st:now).toISOString(),'nplan-'+p.id+'-'+st);
  if(onAbcPage(p))renderAbcAll();
  toast(`관찰 시작 시간(${ps})이 되어 관찰을 시작했습니다`);
}
function tick(){
  store.projects.forEach(planAutoStart);
  store.projects.forEach(p=>{
    const a=abcData(p);const s=a.session;if(!s||!s.running)return;
    const sh=sheetById(p,s.activeSheetId);
    if(!sh){s.running=false;scheduleSave();return;}
    if(Date.now()>=Date.parse(sh.end))rollover(p,sh);
  });
  updateLive();
}
function updateLive(){
  const p=curProject();if(!onAbcPage(p))return;
  const st=$('#obs-state');if(st)st.textContent=obsStateText(p);
  const sh=activeSheet(p);
  if(sh){const l=$('#left-'+sh.id);if(l)l.textContent=fmtDur(msLeft(sh)/1000)+' 남음';}
}
function addRow(p,sh,time){
  const r={id:uid('w'),time:time||null,a:'',b:p.procs.define.data.name||'',c:''};
  sh.rows.push(r);sh.updatedAt=nowISO();touch(p,'abc');saveNow();
  if(onAbcPage(p)){
    const box=$('#rows-'+sh.id);
    if(box){const em=box.querySelector('.rows-empty');if(em)em.remove();box.insertAdjacentHTML('beforeend',rowView(p,sh,r));}
    const h=$('#shh-'+sh.id);if(h)h.innerHTML=sheetHead(p,sh);
    refreshSummary(p);
    const row=$('#rw-'+r.id);const ta=$('#rw-'+r.id+'-a');
    if(ta){try{ta.focus({preventScroll:true});}catch(e){}}
    if(row)row.scrollIntoView({behavior:'smooth',block:'center'});
  }
  return r;
}
function attachTargetSheet(p,key){
  if(key!=='active')return sheetById(p,key);
  const act=activeSheet(p);if(act)return act;
  const s=abcData(p).session;
  if(s){const ss=sessionSheets(p,s.id);if(ss.length)return ss[ss.length-1];}
  return null;
}

/* ---------- example ---------- */
function exampleProject(){
  const p=newProject('예시-01','예시 자료입니다. 둘러본 뒤 삭제하세요.');p.example=true;

function onField(el){
  const p=curProject();
  const spec=el.dataset.f;const i=spec.indexOf(':');const scope=spec.slice(0,i),name=spec.slice(i+1);
  if(scope==='qitem'){store.settings.qabfItems[name]=el.value;scheduleSave();return;}
  if(!p)return;
  const val=el.value;
  switch(scope){
    case 'proj':
      p[name]=val;p.updatedAt=nowISO();scheduleSave();renderCrumbs();
      if(name==='code'){const t=$('#proj-title');if(t)t.textContent=val||'(코드 없음)';}
      break;
    case 'define':
      p.procs.define.data[name]=val;touch(p,'define');refreshDefine(p);break;
    case 'defbool':
      p.procs.define.data[name]=el.checked;touch(p,'define');break;
    case 'defcheck':{
      const n=Number(name);const arr=p.procs.define.data.checks;const has=arr.includes(n);
      if(el.checked&&!has)arr.push(n);if(!el.checked&&has)arr.splice(arr.indexOf(n),1);
      touch(p,'define');refreshDefine(p);break;}
    case 'qform':{
      const f=activeForm(p);if(!f)return;f[name]=val;f.updatedAt=nowISO();touch(p,'qabf');
      if(name==='rater'||name==='role'||name==='date'){const tab=$(`#q-tabs [data-id="${f.id}"]`);if(tab)tab.innerHTML=`${esc(f.rater||'응답자 미입력')}<small>${esc([f.role,f.date?f.date.slice(5).replace('-','/'):''].filter(Boolean).join(' · ')||' ')}</small>`;}
      break;}
    case 'sheet':{
      const [sid,field]=name.split(':');const sh=sheetById(p,sid);if(!sh)return;
      sh[field]=val;sh.updatedAt=nowISO();touch(p,'abc');break;}
    case 'row':{
      const [sid,rid,field]=name.split(':');const sh=sheetById(p,sid);if(!sh)return;
      const r=sh.rows.find(x=>x.id===rid);if(!r)return;
      if(field==='time')r.time=timeOnDay(sh.start,val);else r[field]=val;
      sh.updatedAt=nowISO();touch(p,'abc');
      if(field==='time'){const h=$('#shh-'+sid);if(h)h.innerHTML=sheetHead(p,sh);}
      break;}
    case 'abcset':{
      const a=abcData(p);const n=Math.round(Number(val));
      if(!(n>=1&&n<=180)){el.value=a.interval;toast('관찰 간격은 1분에서 180분 사이로 정하세요');return;}
      a.interval=n;el.value=n;
      const sh=activeSheet(p);
      if(sh){
        sh.end=new Date(Math.max(Date.parse(sheetEnd(p,sh.start,a.session.endAt)),Date.now())).toISOString();
        const h=$('#shh-'+sh.id);if(h)h.innerHTML=sheetHead(p,sh);
        const r=$('#shr-'+sh.id);if(r)r.textContent=rangeText(sh);
      }
      touch(p,'abc');saveNow();updateLive();toast(`관찰 간격을 ${n}분으로 정했습니다`);break;}
    case 'hypo':

function setPlanTime(el){

/* ---------- 손글씨(S펜) 입력: 글자를 입력하는 모든 칸 ---------- */
/* 글자로 바꾸지 않고 쓴 모양 그대로 저장한다.
   각 칸의 손글씨는 그 칸 값을 가진 객체의 .ink[필드] = {w,h,s:[[굵기,x1,y1,x2,y2,...],...]} (CSS px 좌표) */
const INK_SEL='textarea[data-f],input[data-f]:not([type]),input[data-f][type=text],#new-code,#new-memo';
/* penSeen: S펜 전용(손바닥·손가락 무시). 한 번 S펜을 쓰면 이 기기에서 기억한다. '손가락도 쓰기'를 고르면 끈다. */
const INK_MODE_KEY='pbs-ink-mode';
function inkModeGet(){try{return localStorage.getItem(INK_MODE_KEY)||'';}catch(e){return '';}}
function inkModeSet(v){try{localStorage.setItem(INK_MODE_KEY,v);}catch(e){}}
const inkUI={pad:null,penSeen:inkModeGet()==='pen',penDown:false,pending:{}};
function inkSpec(el){return el.dataset.f||(el.id==='new-code'?'new:code':el.id==='new-memo'?'new:memo':'');}
/* 칸 이름(data-f)으로 손글씨를 담을 객체와 필드를 찾는다 */
function inkTarget(spec){
  const i=spec.indexOf(':');const scope=spec.slice(0,i),name=spec.slice(i+1);
  if(scope==='new')return {obj:inkUI.pending,field:name,save:()=>{}};
  if(scope==='qitem'){store.settings.qabfInk=store.settings.qabfInk||{};return {obj:store.settings.qabfInk,field:name,save:()=>scheduleSave(),flat:true};}
  const p=curProject();if(!p)return null;
  switch(scope){
    case 'proj':return {obj:p,field:name,save:()=>{p.updatedAt=nowISO();scheduleSave();}};
    case 'define':return {obj:p.procs.define.data,field:name,save:()=>touch(p,'define')};
    case 'qform':{const f=activeForm(p);if(!f)return null;return {obj:f,field:name,save:()=>{f.updatedAt=nowISO();touch(p,'qabf');}};}
    case 'sheet':{const [sid,fd]=name.split(':');const sh=sheetById(p,sid);if(!sh)return null;return {obj:sh,field:fd,save:()=>{sh.updatedAt=nowISO();touch(p,'abc');}};}
    case 'row':{const [sid,rid,fd]=name.split(':');const sh=sheetById(p,sid);if(!sh)return null;const r=sh.rows.find(x=>x.id===rid);if(!r)return null;
      return {obj:r,field:fd,save:()=>{sh.updatedAt=nowISO();touch(p,'abc');}};}
    case 'hypo':return {obj:p.procs.hypo.data,field:name,save:()=>touch(p,'hypo')};
    case 'rating':return {obj:p.procs.rating.data,field:name,save:()=>touch(p,'rating')};
    case 'rrow':{const [kind,id,fd]=name.split(':');const d=p.procs.rating.data;const o=(kind==='rater'?d.raters:d.rows).find(x=>x.id===id);if(!o)return null;
      return {obj:o,field:fd,save:()=>touch(p,'rating')};}
    case 'mf':{const key=ui.proc;if(!p.procs[key])return null;return {obj:p.procs[key].data,field:name,save:()=>touch(p,key)};}
  }

}
function inkGet(t){const box=t.flat?t.obj:t.obj.ink;const v=box&&box[t.field];return v&&v.s&&v.s.length?v:null;}
function inkPut(t,v){
  if(t.flat){if(v)t.obj[t.field]=v;else delete t.obj[t.field];return;}
  if(v){t.obj.ink=t.obj.ink||{};t.obj.ink[t.field]=v;}
  else if(t.obj.ink){delete t.obj.ink[t.field];if(!Object.keys(t.obj.ink).length)delete t.obj.ink;}

function inkPath(st){
  const pts=st.slice(1);if(pts.length<2)return '';

}
function inkSvg(ink){

function inkInner(spec){
  const t=inkTarget(spec);const ink=t&&inkGet(t);

    ?`<button type="button" class="ink-view" data-act="ink-open" title="눌러서 손글씨 고치기" aria-label="손글씨 (눌러서 고치기)">${inkSvg(ink)}</button>`

/* 화면이 그려질 때마다 입력칸 바로 뒤에 손글씨 자리를 붙인다 */
function inkScan(){
  document.querySelectorAll(INK_SEL).forEach(el=>{
    const spec=inkSpec(el);if(!spec)return;
    const nx=el.nextElementSibling;
    if(nx&&nx.classList.contains('ink')&&nx.dataset.k===spec)return;
    const box=document.createElement('div');box.className='ink';box.dataset.k=spec;
    box.innerHTML=inkInner(spec);el.insertAdjacentElement('afterend',box);
  });
}
let inkScanQueued=false;
new MutationObserver(()=>{if(inkScanQueued)return;inkScanQueued=true;Promise.resolve().then(()=>{inkScanQueued=false;inkScan();inkSyncLock();});}).observe(document.body,{childList:true,subtree:true});
/* 손글씨 자리를 눌러도 감싼 label 때문에 키보드가 뜨지 않게 한다 */
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.ink'))e.preventDefault();});
function inkClose(){
  const pad=inkUI.pad;inkUI.pad=null;if(!pad)return;
  const box=pad.box.isConnected?pad.box:null;
  if(box)box.innerHTML=inkInner(box.dataset.k);
  inkSyncLock();
}
function inkSave(pad){
  inkPut(pad.t,pad.strokes.length?{w:pad.w,h:pad.h,s:pad.strokes}:null);
  pad.t.save();
}
function inkOpen(box){
  if(inkUI.pad)inkClose();
  const spec=box.dataset.k;const t=inkTarget(spec);if(!t)return;
  const single=!/^textarea$/i.test((box.previousElementSibling||{}).tagName||'');
  box.innerHTML=`<div class="ink-pad${inkUI.penSeen?' pen-only':''}">
    <canvas aria-label="손글씨 입력 칸"></canvas>
    <div class="ink-tools">
      <button type="button" data-ink="pen" class="on">펜</button>
      <button type="button" data-ink="eraser">지우개</button>
      <button type="button" data-ink="undo">되돌리기</button>
      <button type="button" data-ink="clear">모두 지우기</button>
      <button type="button" data-ink="grow">칸 늘리기</button>
      <button type="button" data-ink="mode">${inkUI.penSeen?'손가락도 쓰기':'S펜 전용'}</button>
      <button type="button" class="ink-done" data-ink="done">완료</button>
    </div>
    <p class="ink-hint">S펜 전용: 손바닥·손가락 터치는 무시합니다. 두 손가락으로 밀면 화면이 움직이고, 두 손가락으로 톡 치면 손글씨를 멈춥니다.</p></div>`;
  const cv=box.querySelector('canvas');
  const W=Math.max(120,Math.round(cv.getBoundingClientRect().width||box.clientWidth||240));
  const old=inkGet(t);
  const sc=old?W/old.w:1;
  const rd=v=>Math.round(v*10)/10;
  const strokes=old?old.s.map(st=>[rd(st[0]*Math.min(Math.max(sc,.5),2)),...st.slice(1).map(v=>rd(v*sc))]):[];
  const pad={box,t,cv,ctx:cv.getContext('2d'),w:W,h:Math.max(single?110:160,old?Math.ceil(old.h*sc):0),strokes,hist:[],tool:'pen',cur:null,pid:null};
  inkUI.pad=pad;
  inkResize(pad);
  inkBind(pad,box);
  inkSyncLock();
}
function inkResize(pad){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  pad.cv.style.height=pad.h+'px';
  pad.cv.width=Math.round(pad.w*dpr);pad.cv.height=Math.round(pad.h*dpr);
  pad.ctx.setTransform(dpr,0,0,dpr,0,0);
  inkRedraw(pad);
}
function inkColor(){return getComputedStyle(document.body).getPropertyValue('--ink').trim()||'#152426';}
function inkRedraw(pad){
  const c=pad.ctx;c.clearRect(0,0,pad.w,pad.h);
  c.strokeStyle=c.fillStyle=inkColor();c.lineCap='round';c.lineJoin='round';
  pad.strokes.forEach(st=>{const pth=new Path2D(inkPath(st));c.lineWidth=st[0];c.stroke(pth);});
}
function inkBind(pad,box){
  const cv=pad.cv;
  const pos=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*pad.w/b.width,(e.clientY-b.top)*pad.h/b.height];};
  const rd=v=>Math.round(v*10)/10;
  const isEraser=e=>pad.tool==='eraser'||(e.pointerType==='pen'&&((e.buttons&32)||(e.buttons&2)||e.button===5));
  const eraseAt=(x,y)=>{
    const R=10;const before=pad.strokes.length;
    pad.strokes=pad.strokes.filter(st=>{for(let i=1;i<st.length;i+=2){if(Math.abs(st[i]-x)<R+st[0]&&Math.abs(st[i+1]-y)<R+st[0])return false;}return true;});
    if(pad.strokes.length!==before)inkRedraw(pad);
  };
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen')inkPenDetected();
    if(e.pointerType==='touch'&&inkUI.penSeen)return; /* 펜을 쓰는 중이면 손바닥·손가락 터치는 무시 */
    if(pad.pid!=null){
      /* S펜이 닿으면, 먼저 닿아 그리던 손바닥·손가락 획을 버리고 펜을 우선한다 */
      if(e.pointerType!=='pen'||pad.ptype==='pen')return;
      try{cv.releasePointerCapture(pad.pid);}catch(err){}
      if(pad.hist.length)pad.strokes=pad.hist.pop();
      pad.pid=null;pad.cur=null;inkRedraw(pad);
    }
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    pad.pid=e.pointerId;pad.ptype=e.pointerType;pad.hist.push(pad.strokes.slice());if(pad.hist.length>50)pad.hist.shift();
    const [x,y]=pos(e);
    if(isEraser(e)){pad.cur={erase:true};eraseAt(x,y);return;}
    const pr=e.pointerType==='pen'&&e.pressure>0?e.pressure:.5;
    pad.cur={pts:[rd(x),rd(y)],pr:[pr],lx:x,ly:y};
    const c=pad.ctx;c.strokeStyle=c.fillStyle=inkColor();c.beginPath();c.arc(x,y,(1+pr*3)/2,0,Math.PI*2);c.fill();
  });

    if(e.pointerId!==pad.pid||!pad.cur)return;
    e.preventDefault();

      const [x,y]=pos(ev);
      if(pad.cur.erase){eraseAt(x,y);return;}
      const pr=ev.pointerType==='pen'&&ev.pressure>0?ev.pressure:.5;
      const c=pad.ctx;c.lineCap='round';c.lineWidth=1+pr*3;c.beginPath();c.moveTo(pad.cur.lx,pad.cur.ly);c.lineTo(x,y);c.stroke();

    if(e.pointerId!==pad.pid)return;

    const b=e.target.closest('[data-ink]');if(!b)return;e.preventDefault();
    const a=b.dataset.ink;
    if(a==='pen'||a==='eraser'){pad.tool=a;box.querySelectorAll('[data-ink=pen],[data-ink=eraser]').forEach(x=>x.classList.toggle('on',x.dataset.ink===a));}
    else if(a==='undo'){if(pad.hist.length){pad.strokes=pad.hist.pop();inkRedraw(pad);inkSave(pad);}}
    else if(a==='clear'){if(pad.strokes.length){pad.hist.push(pad.strokes.slice());pad.strokes=[];inkRedraw(pad);inkSave(pad);}}
    else if(a==='grow'){pad.h+=120;inkResize(pad);inkSave(pad);}
    else if(a==='mode'){

      b.textContent=inkUI.penSeen?'손가락도 쓰기':'S펜 전용';
      box.querySelector('.ink-pad').classList.toggle('pen-only',inkUI.penSeen);inkSyncLock();
      toast(inkUI.penSeen?'S펜 전용: 손바닥·손가락 터치는 무시합니다':'손가락으로도 쓸 수 있습니다');
    }
    else if(a==='done'){inkSave(pad);inkClose();}
  });
}
/* ---- S펜 우선: 필기 칸이 열려 있고 S펜 전용이면, 화면 어디에 닿은 손바닥·손가락 터치도 무시한다 ----
   - 손바닥이 다른 곳에 닿아 화면이 밀리거나 확대되면서 펜 획이 끊기던 문제를 막는다(touch-action:none + 터치 무시).
   - 두 손가락으로 밀기: 화면 이동. 두 손가락으로 톡: 손글씨 멈춤(저장하고 칸 닫기).
   - 펜이 화면에 닿아 있는 동안에는 두 손가락 동작도 무시한다(손바닥 오작동 방지).
   - 펜이 닿아 있지 않을 때 손가락 하나로 필기 칸 도구 버튼(완료 등)은 누를 수 있다. */

const inkTouch={pts:new Map(),g:null,toolTap:false};

/* 프로젝트 → {cells: 경로→값, items: 항목경로→{parent,order}}. 경로 예: procs/abc/data/sheets[s1]/rows[w2]/b */
function syncFlat(p){
  const cells=new Map(),items=new Map();
  const walk=(o,path,isItem)=>{
    for(const k of Object.keys(o)){
      if(!path&&SYNC_SKIP_TOP.has(k))continue;
      if(isItem&&k==='id')continue;
      const v=o[k];if(v===undefined||typeof v==='function')continue;
      const pa=path?path+'/'+k:k;
      if(k==='ink'&&isObj(v)){const ks=Object.keys(v);if(!ks.length)cells.set(pa,{});ks.forEach(f=>cells.set(pa+'/'+f,v[f]));continue;}
      if(isObj(v)){if(Object.keys(v).length)walk(v,pa,false);else cells.set(pa,{});continue;}
      if(Array.isArray(v)&&v.length&&isIdArr(v)){v.forEach((x,i)=>{const ip=pa+'['+x.id+']';items.set(ip,{parent:pa,order:i});walk(x,ip,true);});continue;}
      cells.set(pa,v);
    }
  };
  walk(p,'',false);
  return {cells,items};
}
function syncSeg(s){const m=/^(.*)\[([^\]]*)\]$/.exec(s);return m?{k:m[1],id:m[2]}:{k:s};}
/* syncFlat의 반대. 지워진 항목 아래의 칸은 버린다 */
function syncUnflat(cells,items){
  const root={};
  const step=(cur,sg,mk)=>{
    if(sg.id==null){if(!isObj(cur[sg.k])){if(!mk)return null;cur[sg.k]={};}return cur[sg.k];}
    const arr=cur[sg.k];if(!Array.isArray(arr))return null;
    return arr.find(x=>x.id===sg.id)||null;
  };
  const its=Array.from(items.entries()).map(([ip,it])=>({ip,segs:ip.split('/').map(syncSeg),order:Number(it.order)||0}));
  const lid=x=>String(x.segs[x.segs.length-1].id||'');
  its.sort((a,b)=>a.segs.length-b.segs.length||a.order-b.order||(lid(a)<lid(b)?-1:lid(a)>lid(b)?1:0));
  for(const it of its){
    let cur=root,ok=true;
    for(let i=0;i<it.segs.length-1;i++){cur=step(cur,it.segs[i],true);if(!cur){ok=false;break;}}
    if(!ok)continue;
    const last=it.segs[it.segs.length-1];if(last.id==null)continue;
    if(!Array.isArray(cur[last.k]))cur[last.k]=[];
    if(!cur[last.k].some(x=>x.id===last.id))cur[last.k].push({id:last.id});
  }
  const cs=Array.from(cells.entries()).map(([pa,v])=>({segs:pa.split('/').map(syncSeg),v}));
  cs.sort((a,b)=>a.segs.length-b.segs.length);
  for(const c of cs){
    let cur=root,ok=true;
    for(let i=0;i<c.segs.length-1;i++){cur=step(cur,c.segs[i],true);if(!cur){ok=false;break;}}
    if(!ok)continue;
    const k=c.segs[c.segs.length-1].k;const v=c.v;
    if(isObj(v)&&!Object.keys(v).length){if(!isObj(cur[k]))cur[k]={};}
    else if(Array.isArray(v)&&!v.length){if(!Array.isArray(cur[k]))cur[k]=[];}
    else cur[k]=isObj(v)||Array.isArray(v)?clone(v):v;
  }
  return root;
}
function syncItemsLive(path,items){
  const segs=path.split('/');let acc='';
  for(let i=0;i<segs.length;i++){acc=acc?acc+'/'+segs[i]:segs[i];if(i<segs.length-1&&/\]$/.test(segs[i])&&!items.has(acc))return false;}
  return true;
}
/* base와 mine을 비교해 바뀐 칸·항목만 고른다 */
function syncDiff(base,mine){
  const cells=[],items=[];
  mine.cells.forEach((v,pa)=>{if(!base.cells.has(pa)||!sameJ(base.cells.get(pa),v))cells.push({path:pa,value:v});});
  base.cells.forEach((v,pa)=>{if(!mine.cells.has(pa)&&syncItemsLive(pa,mine.items))cells.push({path:pa,deleted:true});});
  mine.items.forEach((it,pa)=>{const b=base.items.get(pa);if(!b||b.order!==it.order)items.push({path:pa,parent:it.parent,order:it.order});});
  base.items.forEach((it,pa)=>{if(!mine.items.has(pa)&&syncItemsLive(pa,mine.items))items.push({path:pa,parent:it.parent,order:it.order,deleted:true});});
  return {cells,items};
}
function syncBaseOf(p){const c=clone(p);SYNC_SKIP_TOP.forEach(k=>delete c[k]);return c;}
function syncState(pid){store.sync=store.sync||{};const s=store.sync[pid]=store.sync[pid]||{base:null,revs:{}};s.revs=s.revs||{};return s;}

async function syncInviteKey(pid,code){

/* 화면 칸(data-f) ↔ 자료 경로 */
function syncPathIndex(p){

  const walk=(o,path)=>{m.set(o,path);for(const k of Object.keys(o)){if(!path&&SYNC_SKIP_TOP.has(k))continue;const v=o[k];const pa=path?path+'/'+k:k;
    if(k==='ink')continue;
    if(isObj(v))walk(v,pa);else if(Array.isArray(v)&&v.length&&isIdArr(v))v.forEach(x=>walk(x,pa+'['+x.id+']'));}};

async function makeFirestoreAdapter(){

  const key=path=>encodeURIComponent(path).replace(/\./g,'%2E').replace(/%/g,'~');
  const count=n=>{Sync.stats.writes+=n;};
  const cellDoc=(path,v,rev,me)=>({path,value:JSON.stringify(v),deleted:false,rev,baseRev:0,by:me.uid,byName:me.name,at:ts()});
  const itemDoc=(it,me)=>({path:it.path,parent:it.parent,order:it.order,deleted:!!it.deleted,by:me.uid,at:ts()});
  async function batched(ops){/* 한 batch에 450개씩 */
    for(let i=0;i<ops.length;i+=450){const b=F.writeBatch(db);ops.slice(i,i+450).forEach(o=>b.set(o[0],o[1]));await b.commit();count(Math.min(450,ops.length-i));}
  }
  async function getAll(pid){
    const [c,it]=await Promise.all([F.getDocs(sub(pid,'cells')),F.getDocs(sub(pid,'items'))]);
    return {cells:c.docs.map(d=>d.data()),items:it.docs.map(d=>d.data())};
  }
  return {
    name:'firestore',
    async init(onAuth){

      try{await U.getRedirectResult(auth);}catch(e){}
    },
    async signIn(){
      if(emu&&emu.user){await U.signInWithCredential(auth,U.GoogleAuthProvider.credential(JSON.stringify(Object.assign({email_verified:true},emu.user))));return;}
      const pr=new U.GoogleAuthProvider();
      try{await U.signInWithPopup(auth,pr);}
      catch(e){if(e&&/popup-blocked|operation-not-supported|popup-closed-by-user/.test(e.code||'')&&e.code!=='auth/popup-closed-by-user'){await U.signInWithRedirect(auth,pr);return;}throw e;}
    },
    signOut(){return U.signOut(auth);},
    async createProject(pid,meta,me,inviteKey,flat){
      await F.setDoc(pd(pid),{code:meta.code||'',owner:me.uid,createdAt:ts(),updatedAt:ts()});
      await F.setDoc(sub(pid,'members',me.uid),{name:me.name,role:'owner',joinedAt:ts(),inviteKey});
      await F.setDoc(F.doc(db,'invites',inviteKey),{projectId:pid,createdBy:me.uid});
      count(3);
      const ops=[];
      flat.cells.forEach((v,path)=>ops.push([sub(pid,'cells',key(path)),cellDoc(path,v,1,me)]));
      flat.items.forEach((it,path)=>ops.push([sub(pid,'items',key(path)),itemDoc({path,parent:it.parent,order:it.order},me)]));
      await batched(ops);
    },
    async join(pid,inviteKey,me){
      const inv=await F.getDoc(F.doc(db,'invites',inviteKey));
      if(!inv.exists()||inv.data().projectId!==pid){const e=new Error('badcode');e.code='badcode';throw e;}
      const mref=sub(pid,'members',me.uid);
      const m=await F.getDoc(mref);
      if(!m.exists()){await F.setDoc(mref,{name:me.name,role:'member',joinedAt:ts(),inviteKey});count(1);}
      return getAll(pid);
    },
    watch(pid,h){
      const opt={includeMetadataChanges:true};
      const conv=d=>Object.assign(d.data({serverTimestamps:'estimate'}),{_id:d.id});
      const ch=(snap)=>snap.docChanges().map(c=>({removed:c.type==='removed',d:conv(c.doc)}));
      const un=[
        F.onSnapshot(sub(pid,'cells'),opt,s=>h.cells(ch(s).map(x=>(x.d.at=iso(x.d.at),x)),s.metadata.fromCache),h.error),
        F.onSnapshot(sub(pid,'items'),opt,s=>h.items(ch(s),s.metadata.fromCache),h.error),
        F.onSnapshot(F.query(sub(pid,'conflicts'),F.where('resolved','==',false)),s=>h.conflicts(s.docs.map(d=>{const x=conv(d);return Object.assign(x,{id:d.id,at:iso(x.at),theirsAt:iso(x.theirsAt)});})),h.error),
        F.onSnapshot(sub(pid,'members'),opt,s=>h.members(s.docs.map(d=>{const x=conv(d);return Object.assign(x,{uid:d.id,joinedAt:iso(x.joinedAt)});}),s.metadata.fromCache),h.error)
      ];

          let conflict=false;
          if(c&&!w.noHist&&!w.deleted&&!c.deleted&&curRev!==(w.baseRev||0)&&c.by!==me.uid&&c.value!==json&&typeof w.value==='string'){
            const tv=syncParse(c.value);
            if(typeof tv==='string'&&tv.trim()){conflict=true;n++;
              tx.set(F.doc(sub(pid,'conflicts')),{path:w.path,mine:json,theirs:c.value,mineBy:me.uid,mineByName:me.name,theirsBy:c.by||'',theirsByName:c.byName||'',theirsAt:c.at||null,at:ts(),resolved:false});}
          }

        out.n=n;return out;
      });

    },
    async history(pid,path){
      const s=await F.getDocs(F.query(sub(pid,'history'),F.where('path','==',path)));

    },
    async resolve(pid,id,me){await F.updateDoc(sub(pid,'conflicts',id),{resolved:true,resolvedBy:me.uid,resolvedAt:ts()});count(1);},
    async removeMember(pid,uid){await F.deleteDoc(sub(pid,'members',uid));count(1);},
    async setName(pid,me){await F.updateDoc(sub(pid,'members',me.uid),{name:me.name});count(1);},

    }
  };
}

function syncWatch(){

  if(Sync.cur&&want&&Sync.cur.pid===want&&Sync.cur.localId===p.id)return;
