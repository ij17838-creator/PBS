<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>PBS 행동 관찰 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: field-notebook tool — sticky crumb bar, one 980px column, procedure cards in a wrapping grid, A/B/C colour-coded throughout */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --sunk:#E2E9E7;
  --ink:#152426; --muted:#566868; --line:#CAD6D3; --line-strong:#A9BAB7;
  --accent:#1B6862; --accent-hover:#14534E; --accent-ink:#FFFFFF; --accent-soft:#D2E9E5;
  --a:#2C52A0; --a-soft:#DFE7F7; --c:#93520F; --c-soft:#F5E6D1;
  --rec:#BF3628; --rec-soft:#F9DEDA; --ok:#27744A; --ok-soft:#D8EEE0; --warn:#866000; --warn-soft:#F4E9C6;
  --shadow:0 1px 2px rgba(21,36,38,.06),0 6px 18px rgba(21,36,38,.05);
  --tag-ink:#FFFFFF;
  --font-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F191A; --surface:#162325; --surface-2:#1B2A2C; --sunk:#0B1314;
  --ink:#E3ECEA; --muted:#9AACAA; --line:#2C3E40; --line-strong:#40575A;
  --accent:#5DB6AB; --accent-hover:#79C7BD; --accent-ink:#0B1A19; --accent-soft:#1C3A37;
  --a:#91AAEA; --a-soft:#1E2944; --c:#E2A55C; --c-soft:#3A2915;
  --rec:#F27B6C; --rec-soft:#45201B; --ok:#6BC493; --ok-soft:#173327; --warn:#E0BA52; --warn-soft:#382E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --tag-ink:#0F191A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F191A; --surface:#162325; --surface-2:#1B2A2C; --sunk:#0B1314;
  --ink:#E3ECEA; --muted:#9AACAA; --line:#2C3E40; --line-strong:#40575A;
  --accent:#5DB6AB; --accent-hover:#79C7BD; --accent-ink:#0B1A19; --accent-soft:#1C3A37;
  --a:#91AAEA; --a-soft:#1E2944; --c:#E2A55C; --c-soft:#3A2915;
  --rec:#F27B6C; --rec-soft:#45201B; --ok:#6BC493; --ok-soft:#173327; --warn:#E0BA52; --warn-soft:#382E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --tag-ink:#0F191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.15rem);line-height:1.25;letter-spacing:-.01em}
.h3{font-size:1.02rem;font-weight:700}
p{margin:0}
small{font-size:.82em;color:var(--muted);font-weight:400}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:flex;flex-direction:column;gap:18px;padding-block:22px 28px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding-block:6px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;min-width:0;font-size:.92rem}
.crumbs button{background:none;border:0;padding:6px 6px;border-radius:8px;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs .sep{color:var(--line-strong)}
.crumbs .here{padding:6px;font-weight:700;overflow-wrap:anywhere}
.top-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.save-state{font-size:.78rem;color:var(--muted);white-space:nowrap}
.rec-mini{display:flex;align-items:center;gap:8px;background:var(--rec-soft);color:var(--rec);border-radius:999px;padding:4px 4px 4px 12px;font-weight:700}

/* type */
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.lede{color:var(--muted);max-width:62ch;margin-top:6px}
.hint{color:var(--muted);font-size:.86rem}
.meta{color:var(--muted);font-size:.82rem;line-height:1.5}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 12px}
section{min-width:0}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.banner{border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.two > *{min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.93rem;cursor:pointer;text-decoration:none;white-space:nowrap;user-select:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.small{min-height:36px;padding:0 12px;font-size:.86rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--rec)}
.btn.danger-solid{background:var(--rec);border-color:var(--rec);color:var(--tag-ink)}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.field > span,.field legend{font-weight:600;font-size:.9rem}
.field legend{margin-bottom:6px;padding:0}
input[type=text],input:not([type]),input[type=date],input[type=datetime-local],input[type=number],input[type=time],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;line-height:1.5}
textarea{resize:vertical}
/* 글자 칸: 어절 단위로 줄바꿈, 줄이 늘면 칸도 늘어남(ABC 관찰지와 같은 방식) */
textarea{word-break:keep-all;overflow-wrap:anywhere}
textarea[data-f]{field-sizing:content}
textarea[data-f][rows="2"]{min-height:70px}
textarea[data-f][rows="3"]{min-height:94px}
textarea[data-f][rows="4"]{min-height:118px}
textarea[data-f][rows="6"]{min-height:166px}
textarea.one{resize:none;min-height:46px;overflow:hidden}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip.on{font-weight:700}
.chip.c-a.on{background:var(--a-soft);border-color:var(--a);color:var(--a)}
.chip.c-b.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.c-c.on{background:var(--c-soft);border-color:var(--c);color:var(--c)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-btn{min-width:44px;min-height:44px;padding:0 12px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg-btn:first-child{border-left:0}
.seg-btn.on{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.muted{background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.confirm{background:var(--rec-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--ink);font-size:.9rem}

/* home */
.new-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.new-form .field{flex:1 1 180px}
.new-form .grow{flex:2 1 240px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.proj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.proj-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.proj-top h3{font-size:1.2rem;font-weight:600;overflow-wrap:anywhere}
.proj-target{font-weight:600}
.proj-memo{color:var(--muted);font-size:.88rem}
.dots{display:flex;gap:5px}
.dot{width:100%;max-width:28px;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.dot.s-progress{background:var(--warn-soft);border-color:var(--warn)}
.dot.s-done{background:var(--ok);border-color:var(--ok)}
.card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tools .tool-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* project */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.cat-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);font:inherit;cursor:pointer}
.cat-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cat-top{display:flex;align-items:center;gap:10px}
.cat-no{font-family:var(--font-mono);font-size:.9rem;font-weight:700;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex:none}
.cat-title{font-weight:700;font-size:1.1rem;flex:1;min-width:0}
.cat-count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-desc{color:var(--muted);font-size:.86rem}
.cat-procs{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:10px}
.cat-proc{display:flex;align-items:center;gap:7px;font-size:.88rem}
.cat-proc .dot{width:10px;height:10px;max-width:none;border-radius:50%;flex:none}
.cat-proc .mono{color:var(--muted);font-size:.8rem}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap}
.cat-tab{font:inherit;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cat-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cat-tab .mono{opacity:.7}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.proc-card{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr auto;column-gap:12px;row-gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink);font:inherit;cursor:pointer;min-height:148px}
.proc-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.proc-no{grid-row:1/5;font-family:var(--font-mono);font-size:.85rem;font-weight:600;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.proc-card.s-done .proc-no{background:var(--ok);color:var(--tag-ink)}
.proc-card.s-progress .proc-no{background:var(--warn-soft);color:var(--warn)}
.proc-title{font-weight:700;font-size:1rem;line-height:1.35}
.proc-desc{color:var(--muted);font-size:.84rem;line-height:1.45}
.proc-foot{display:flex;flex-direction:column;gap:3px;align-items:flex-start;align-self:end}
.proc-detail{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.none{background:var(--sunk);color:var(--muted)}
.status.progress{background:var(--warn-soft);color:var(--warn)}
.status.done{background:var(--ok-soft);color:var(--ok)}
.status.edited{background:var(--ok-soft);color:var(--ok)}
.basic-tag{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
details.card summary{cursor:pointer;font-weight:700}
details.card[open]{gap:14px}

/* procedure page */
.proc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.target-banner{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;flex-wrap:wrap}
.target-banner.empty{background:var(--warn-soft);color:var(--warn);align-items:center;justify-content:space-between}
.tb-label{font-size:.75rem;font-weight:700;letter-spacing:.05em;color:var(--accent);padding-top:2px;white-space:nowrap}
.target-banner p{font-size:.88rem;color:var(--ink);margin-top:2px;white-space:pre-wrap}
.done-bar{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2)}
.done-bar p{font-size:.9rem;color:var(--muted);flex:1 1 260px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
/* 표적행동 정의: 초안 상태·안내·자동 경고 */
.def-warn{display:block;margin-top:3px;color:var(--warn);font-size:.82rem;font-weight:600}
.def-warn:empty{display:none}
.measure-tip{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.86rem;color:var(--ink)}
.measure-tip:empty{display:none}
.stage-tag{font-size:.7rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
details.card.later summary small{font-weight:400;color:var(--muted);margin-left:6px}
/* 행동평정척도: 응답자·점수 행, 첨부 파일 */
.r-list{display:flex;flex-direction:column;gap:10px}
.r-row{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.r-row-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px;align-items:start}
.r-grid.score{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.r-grid.score .wide2{grid-column:span 2}
.r-x{display:flex;align-items:flex-end;justify-content:flex-end;align-self:end;min-height:44px}
.bl-measure{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0}
.bl-val-in{display:flex;gap:6px;align-items:center}
.bl-val-in input{flex:1 1 60px;min-width:0}
.bl-val-in .btn{flex-shrink:0;min-width:44px;padding:0 10px}
.bl-chart{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:10px}
.bl-grid{stroke:var(--line);stroke-width:1}
.bl-tick{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.bl-lab{fill:var(--muted);font-size:11px;font-weight:600;font-family:var(--font-body)}
.bl-band{fill:var(--accent-soft);opacity:.7}
.bl-mean{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}
.bl-goal{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 4}
.bl-phase{stroke:var(--line-strong);stroke-width:2;stroke-dasharray:5 3}
.bl-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.bl-dot{fill:var(--accent);stroke:var(--surface-2);stroke-width:2}
.bl-dot.b{fill:var(--surface-2);stroke:var(--accent);stroke-width:2.5}
.bl-hit{fill:transparent}
.bl-pt:hover .bl-dot{r:6}
.bl-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;margin-top:10px}
.bl-stats b{font-family:var(--font-mono)}
.bl-judge{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:.9rem;background:var(--sunk)}
.bl-judge.pill-warn{background:var(--warn-soft);color:var(--warn)}
.bl-judge.pill-ok{background:var(--ok-soft);color:var(--ok)}
.bl-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:0}
.bl-cmp div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.bl-cmp dt{font-size:.8rem;color:var(--muted)}
.bl-cmp dd{margin:0;font-weight:600}
.r-file{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.r-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.r-doc{width:64px;height:64px;display:grid;place-items:center;border-radius:8px;background:var(--sunk);font-family:var(--font-mono);font-weight:600;font-size:.8rem;color:var(--muted)}
.r-file-info{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}
.r-file-info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.r-grid.score .wide2{grid-column:1/-1}}

/* QABF */
.q-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;flex-direction:column;align-items:flex-start;min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;line-height:1.3}
.tab small{font-size:.74rem}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab.on small{color:inherit;opacity:.8}
.tab.add{border-style:dashed;color:var(--accent);justify-content:center}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.scale-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.scale-legend b{color:var(--ink)}
.q-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.q-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.q-item:first-child{border-top:0}
.q-left{display:flex;align-items:center;gap:8px}
.q-no{width:30px;font-weight:600;color:var(--muted);text-align:right}
.scale-tag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.q-text{min-width:0;font-size:.93rem}
.q-item .seg-btn{min-width:42px;padding:0 8px;font-family:var(--font-mono)}
.q-item .seg-btn[data-v="X"]{color:var(--muted)}
.q-item .seg-btn.on[data-v="X"]{background:var(--muted);color:var(--surface)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:132px 1fr 56px;grid-template-areas:"l t v" ". s s";gap:2px 12px;align-items:center}
.bar-label{grid-area:l;font-weight:600;font-size:.92rem;line-height:1.25}
.bar-label small{display:block;font-family:var(--font-mono);font-size:.7rem}
.bar-track{grid-area:t;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden;position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),var(--line) calc(20% - 1px) 20%)}
.bar-fill{height:100%;background:var(--line-strong);border-radius:7px}
.bar-row.top .bar-fill{background:var(--accent)}
.bar-row.top .bar-label{color:var(--accent)}
.bar-val{grid-area:v;font-family:var(--font-mono);font-weight:600;text-align:right}
.bar-val small{font-size:.75em}
.bar-sub{grid-area:s;font-size:.76rem;color:var(--muted)}
.result-line{font-weight:600}
.q-items-panel ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q-items-panel li{display:grid;grid-template-columns:30px auto 1fr;gap:8px;align-items:center}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.num{font-family:var(--font-mono);text-align:right}
td.top{color:var(--accent);font-weight:700}

/* ABC */
.rec-card{background:var(--surface);border-color:var(--line-strong)}
.rec-card.live{border-color:var(--rec);background:var(--rec-soft)}
.rec-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rec-btn{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 22px 0 14px;border-radius:999px;border:2px solid var(--rec);background:var(--surface);color:var(--rec);font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer}
.rec-icon{width:36px;height:36px;border-radius:50%;background:var(--rec);display:block;position:relative}
.rec-btn.on{background:var(--rec);color:var(--tag-ink)}
.rec-btn.on .rec-icon{background:var(--tag-ink);border-radius:8px;transform:scale(.62);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.rec-info{display:flex;flex-direction:column;flex:1 1 200px;min-width:0}
.rec-time{font-size:1.6rem;font-weight:600;line-height:1.2}
.rec-status{font-size:.86rem;color:var(--muted)}
.rec-card.live .rec-status{color:var(--rec)}
.mic-help{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.entry-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.time-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.time-row .field{flex:1 1 220px}
.btn.stamp{min-height:52px;font-size:1rem}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.abc-box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface-2)}
.abc-box legend{display:flex;align-items:center;gap:8px;font-weight:700;padding:0 6px;margin-left:-6px}
.g-a{border-top:3px solid var(--a)}
.g-b{border-top:3px solid var(--accent)}
.g-c{border-top:3px solid var(--c)}
.abc-tag{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--font-mono);font-weight:600;font-size:.82rem;color:var(--tag-ink);flex-shrink:0}
.t-a{background:var(--a)} .t-b{background:var(--accent)} .t-c{background:var(--c)}
.sub-label{font-size:.82rem;font-weight:600;color:var(--muted)}
.entry-actions{display:flex;gap:10px;flex-wrap:wrap}
.entry-actions .btn.primary{min-width:140px;min-height:50px}
.draft-audio{display:flex;flex-direction:column;gap:8px}
.audio{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.audio audio{height:40px;flex:1 1 220px;min-width:0;max-width:100%}
.audio .missing{color:var(--muted);font-size:.84rem;flex:1 1 220px}
.audio .confirm{flex-basis:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stats div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font-family:var(--font-mono);font-size:1.35rem;font-weight:600;line-height:1.2}
.stats span{font-size:.8rem;color:var(--muted)}
.tally h3{font-size:.9rem;margin-bottom:8px}
.tally ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tally li{display:grid;grid-template-columns:minmax(0,1fr) 90px 52px;gap:10px;align-items:center;font-size:.88rem}
.tally .tname{overflow-wrap:anywhere}
.tally .ttrack{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.tally .tfill{height:100%}
.tally.ta .tfill{background:var(--a)} .tally.tc .tfill{background:var(--c)}
.tally .tval{font-family:var(--font-mono);text-align:right;font-size:.82rem;color:var(--muted)}
.list-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.day{font-size:.85rem;font-weight:700;color:var(--muted);margin:14px 0 8px;letter-spacing:.02em}
.rec-items{display:flex;flex-direction:column;gap:10px}
.rec-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rec-item.editing{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.rec-when{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.rec-when .t{font-weight:600;font-size:1rem}
.rec-when .ctx{font-size:.86rem;color:var(--muted)}
.abc-line{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.abc-line div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.abc-line dd{margin:0;font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.note{white-space:pre-wrap;font-size:.93rem;overflow-wrap:anywhere}
.interp{white-space:pre-wrap;font-size:.88rem;color:var(--muted);border-left:3px solid var(--line-strong);padding-left:10px}
.interp span{font-weight:700;margin-right:6px}
.rec-actions{display:flex;flex-wrap:wrap;gap:6px}
.hypo-preview{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-family:var(--font-display);font-size:1.08rem;line-height:1.6}
.hy-miss{display:block;margin-top:6px;font-family:var(--font-body);font-size:.8rem;color:var(--muted)}
.hy-match{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.hy-match p{margin:0;font-size:.9rem}
.hy-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hy-beh{font-weight:700;margin:0}
.hy-memo summary{cursor:pointer;font-weight:700;font-size:.9rem;min-height:36px;display:flex;align-items:center;gap:8px}
.hy-memo[open] summary{margin-bottom:8px}
.hy-other-btn{color:var(--muted)}
.lede-toggle{margin-left:4px;vertical-align:baseline}
.sum-box{background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sum-box h3{font-size:.92rem}
.pf-privacy{background:var(--warn-soft)}
.pf-privacy p{margin:0;font-size:.9rem}
.pf-code{margin:0}
.pf-ref .row{display:flex;flex-wrap:wrap;gap:8px}
.pf-ref .sum-box p{margin:0;font-size:.92rem}
.sum-box ul{margin:0;padding-left:18px;font-size:.9rem}

/* observation sheets (A-B-C 관찰지) */
.obs-card{gap:12px}
.obs-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tb,54px));z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);margin:-18px -18px 0;padding:12px 18px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.obs-bar .stamp{flex:1 1 260px}
.obs-state{font-family:var(--font-mono);font-size:.88rem;font-weight:600;color:var(--muted)}
.obs-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.interval .unit{display:flex;align-items:center;gap:8px}
.obs-times{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.plan-time input{font-family:var(--font-mono);min-width:130px}
.interval input{width:96px;font-family:var(--font-mono)}
.sheets{display:flex;flex-direction:column;gap:16px}
.sheet{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);min-width:0}
.sheet.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.sh-left,.sh-right{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.sheet-title{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.sheet-range{font-weight:600}
.sheet-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:14px}
.sheet-meta .wide{grid-column:1/-1}
.sheet-meta .span2{grid-column:span 2}
.sh-range{display:flex;align-items:center;gap:6px}
.sh-range input{font-family:var(--font-mono);min-width:0;flex:1 1 0}
.sh-date{font-family:var(--font-mono)}
.obs-btns{display:flex;flex-wrap:wrap;gap:8px}
.ro{min-height:44px;display:flex;align-items:center;padding:0 10px;border:1px dashed var(--line-strong);border-radius:10px;font-size:.92rem;white-space:nowrap;overflow:hidden}
.abc-tbl{border-top:1px solid var(--line)}
.abc-tr{display:grid;grid-template-columns:136px repeat(3,minmax(0,1fr)) 64px;grid-template-areas:"t a b c x" "f f f f f";border-bottom:1px solid var(--line)}
.abc-tr .td{padding:8px;min-width:0}
.abc-tr .td+.td{border-left:1px solid var(--line)}
.td.t{grid-area:t}.td.a{grid-area:a}.td.b{grid-area:b}.td.c{grid-area:c}
.td.x{grid-area:x;display:flex;align-items:flex-start;justify-content:center}
.abc-tr .td.cf{grid-area:f;border-left:0}
.abc-thead{background:var(--surface-2);font-weight:700;font-size:.86rem}
.abc-thead .td{display:flex;align-items:center;gap:6px;line-height:1.25}
.abc-thead small{display:block;font-size:.7rem;font-weight:500;color:var(--muted)}
.abc-tr textarea{min-height:64px;padding:8px 10px;field-sizing:content}
.abc-tr input[type=time]{padding:8px 6px;font-family:var(--font-mono)}
/* 24시간 시각 칸: 글자 칸 + 아래쪽 시계 버튼 */
.t24{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;width:100%;position:relative}
.t24 .t24-in{width:100%;min-width:0;min-height:44px;padding:10px 8px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:var(--font-mono);font-size:16px;line-height:1.5;letter-spacing:.02em}
.t24 .t24-in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.t24 .t24-in.bad{border-color:var(--rec);outline-color:var(--rec)}
.t24-pick{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:.78rem;cursor:pointer}
.t24-pick:hover{background:var(--sunk);color:var(--ink)}
.t24-pick svg{width:15px;height:15px}
.t24-native{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.sh-range{align-items:flex-start}
.sh-range > span[aria-hidden]{padding-top:10px}
.sh-range .t24{flex:1 1 0}
.sh-range .t24 .t24-in{flex:none}
.cell-label{display:none}
.rows-empty{padding:16px;color:var(--muted);font-size:.9rem;text-align:center}
.sheet-foot{display:flex;flex-direction:column;gap:12px;padding:14px}
.sheet-foot > .btn{align-self:flex-start}
.sheet-past{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sheet-past > summary{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:12px 14px;cursor:pointer;min-height:48px}
.sheet-past > .sheet{border:0;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);box-shadow:none}
@media (max-width:720px){
  .abc-thead{display:none}
  .abc-tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t x" "a a" "b b" "c c" "f f";padding:6px 0}
  .abc-tr .td+.td{border-left:0}
  .abc-tr .td{padding:4px 12px}
  .cell-label{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:4px}
  .td.t{display:flex;align-items:center;gap:10px}
  .td.t .cell-label{margin:0}
  .td.t input{max-width:170px}
  .abc-tr textarea{min-height:52px}
  .sheet-meta{grid-template-columns:1fr 1fr}
}
.foot{border-top:1px solid var(--line);padding-block:16px 28px;color:var(--muted);font-size:.82rem;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-size:.9rem;font-weight:600;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}

@media (max-width:560px){
  .q-item{grid-template-columns:auto 1fr;}
  .q-item .seg{grid-column:1/-1;justify-self:stretch;display:grid;grid-template-columns:repeat(5,1fr)}
  .bar-row{grid-template-columns:96px 1fr 50px}
  .tally li{grid-template-columns:minmax(0,1fr) 60px 46px}
  .rec-btn{flex:1 1 100%;justify-content:center}
  .save-state{display:none}
}
/* 손글씨(S펜) 입력: 글자를 입력하는 모든 칸 */
.ink{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ink-btn{align-self:flex-start;min-height:32px;padding:4px 10px;border:1px dashed var(--line-strong);border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer}
.ink-btn:hover{color:var(--accent);border-color:var(--accent)}
.ink-view{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);cursor:pointer}
.ink-view svg{display:block;width:100%;height:auto}
.ink-pad{display:flex;flex-direction:column;gap:6px}
.ink-pad canvas{display:block;width:100%;border:2px solid var(--accent);border-radius:10px;background:var(--surface-2);touch-action:none;cursor:crosshair}
.ink-pad.pen-only canvas{touch-action:pan-y}
.ink-tools{display:flex;flex-wrap:wrap;gap:6px}
.ink-tools button{min-height:34px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.8rem;cursor:pointer}
.ink-tools button.on{background:var(--accent-soft);border-color:var(--accent)}
.q-items-panel li > .ink{grid-column:3;margin-top:0}
.ink-tools .ink-done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-left:auto}
/* S펜 전용으로 쓰는 동안: 손바닥·손가락이 닿아도 화면이 움직이거나 확대되지 않게(펜 획이 끊기지 않게) 한다 */
html.ink-lock,html.ink-lock *{touch-action:none!important}
.ink-hint{display:none;margin:0;font-size:.78rem;color:var(--muted);line-height:1.4}
html.ink-lock .ink-hint{display:block}
/* 손글씨 칸 높이 조절 손잡이 */
.ink-grip{display:flex;align-items:center;justify-content:center;height:22px;margin-top:-4px;border-radius:8px;cursor:ns-resize;touch-action:none;user-select:none;color:var(--muted);font-size:.72rem;gap:6px}
.ink-grip::before{content:"";width:48px;height:5px;border-radius:3px;background:var(--line-strong)}
.ink-grip:hover::before,.ink-grip.on::before{background:var(--accent)}
/* 입력 방식: 버튼 하나로 손글씨 ↔ 키보드 */
.mode-btn{min-height:36px;padding:0 12px;font-size:.86rem}
.mode-btn .mode-k{font-weight:700;color:var(--accent)}
.ink:empty{display:none}
.ink-empty{display:flex;align-items:center;width:100%;min-height:44px;padding:8px 12px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;text-align:left}
.ink-empty.tall{min-height:96px;align-items:flex-start}
.ink-empty:hover{border-color:var(--accent);color:var(--accent)}
html.in-ink .ink-host.ink-blank{display:none}
html.in-ink .ink-host{caret-color:transparent}
.ink-view.kb-src{outline:3px solid var(--accent);outline-offset:2px}
/* 키보드 모드: 손글씨를 보면서 쓰는 창(화면 위에 따로 뜸, 다른 칸 자리에 영향 없음) */
.kb-float{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:30;width:min(960px,calc(100vw - 16px));display:flex;flex-direction:column;gap:8px;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;min-width:0}
.kb-head{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;min-width:0}
.kb-head .kb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0;flex:1}
.kb-ink{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:auto;min-height:0;color:var(--ink)}
.kb-ink svg{display:block;width:100%;height:auto}
.kb-text{min-height:120px!important;height:100%;resize:none}
.kb-btns{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:620px){.kb-body{grid-template-columns:1fr}}
/* 실시간 공유 */
.sync-state{font-size:.78rem;font-weight:700;white-space:nowrap;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.sync-state.ok{background:var(--ok-soft);color:var(--ok)}
.sync-state.warn{background:var(--warn-soft);color:var(--warn)}
.sync-state.bad{background:var(--rec-soft);color:var(--rec)}
.sync-meta{display:inline-flex;flex-wrap:wrap;gap:4px 8px;margin-left:8px;vertical-align:baseline;font-weight:400}
.sync-mbtn,.sync-cbtn{background:none;border:0;padding:0;font:inherit;font-size:.74rem;color:var(--muted);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sync-cbtn{color:var(--warn);font-weight:700;background:var(--warn-soft);border-radius:6px;padding:0 6px;text-decoration:none}
.sync-id{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync-id code{background:var(--sunk);border-radius:6px;padding:2px 8px;overflow-wrap:anywhere;min-width:0}
.sync-login{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.sync-login .sync-name{flex:1 1 180px}
.sync-members{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.sync-members li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.sync-members li > span:first-child{flex:1 1 140px;font-weight:600}
.sync-members .confirm{flex:1 1 100%}

/* ---------- constants ---------- */

  {key:'support',no:3,title:'중재 및 평가',desc:'어떻게 바꾸고 확인하나',procs:['plan','intervene','evaluate']}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.key,c]));
CATS.forEach(c=>c.procs.forEach(k=>{PROC[k].cat=c.key;}));
const MEMO_FIELDS={
  rating:[['scale','척도 이름','사용한 행동평정척도 이름'],['when','실시일 · 응답자','예: 11/3, 담임교사'],['scores','점수 · 결과','하위영역별 점수와 해석을 적으세요'],['memo','메모','']],
  plan:[['antecedent','선행사건 중재 (환경 조정)','예: 과제를 작은 단위로 나누어 제시'],['replacement','대체행동 교수','문제행동과 같은 기능을 하는 적절한 행동. 예: "쉬어도 돼요?" 카드 사용'],['consequence','후속결과 중재','적절한 행동은 강화하고, 문제행동에는 일관되게 대응'],['crisis','위기 대응 · 역할 분담','']],

  evaluate:[['change','기초선 대비 변화',''],['decision','결정 (유지 · 수정 · 중단)',''],['generalize','일반화 · 유지 계획','']]

const QABF_SCALES=[
  {key:'att',name:'관심',en:'Attention'},
  {key:'esc',name:'도피·회피',en:'Escape'},
  {key:'non',name:'비사회적(감각)',en:'Non-social'},
  {key:'phy',name:'신체적(불편)',en:'Physical'},
  {key:'tan',name:'획득(물건)',en:'Tangible'}
];
const QABF_DEFAULT_ITEMS=["관심을 끌기 위해 행동을 보인다.","일하는 상황이나 학습상황에서 벗어나기 위해 행동을 보인다.","\"자기 자극\"의 형태로 행동을 보인다.","아픔을 느낄 때 행동을 보인다.","좋아하는 장난감, 음식, 음료수와 같이 어떤 물건을 가지기 위해서 행동을 보인다.","꾸중을 듣기를 즐겨하기 때문에 행동을 보인다.","옷 입기, 이 닦기, 일하기 등 어떤 과제를 수행하라고 했을 때 행동을 보인다.","방안에 아무도 없어도 혼자서 행동을 보인다.","평가 대상자가 아플 때 더 많이 행동을 보인다.","평가 대상자로부터 어떤 물건을 제거하면 행동을 보인다.","자신에게 관심을 끌기 위해 행동을 보인다.","특정 과제를 수행하기 싫어서 행동을 보인다.","아무것도 할 것이 없을 때 행동을 보인다.","무엇인가 물리적/신체적으로 자신을 귀찮게 할 때 행동을 보인다.","평가 대상자가 원하는 물건을 당신이 가지고 있을 때 행동을 보인다.","평가 대상자가 당신의 반응을 보고 싶어서 행동을 보인다.","다른 사람들로부터 혼자 있고 싶어서 행동을 보인다.","주변의 상황을 무시하여 심하게 반복행동을 한다.","신체적으로 불편할 때 행동을 보인다.","평가 대상자가 원하는 물건을 가지고 있을 때 행동을 보인다.","평가 대상자가 행동을 보일 때면 \"여기 와서 나를 봐\", \"나를 바라봐\"라고 이야기하는 것 같다.","평가 대상자가 행동을 보일 때면 \"혼자 내버려 둬\", \"무엇을 해라고 하지마\"라고 이야기하는 것 같다.","혼자 있어도 그 행동을 즐기는 것 같다.","행동을 통해서 평가 대상자가 아프다는 것을 말하는 것 같다.","행동을 보일 때 장난감, 음식, 특정 물건을 달라고 말하는 것 같다."];
function fillQabfDefaults(st){const it=st.qabfItems;QABF_DEFAULT_ITEMS.forEach((t,i)=>{const n=i+1;if(!it[n])it[n]=t;});return st;}
const QABF_OPTS=[{v:'X',full:'해당 없음'},{v:'0',full:'전혀 없음'},{v:'1',full:'드물게'},{v:'2',full:'가끔'},{v:'3',full:'자주'}];

  '빈도':{tip:'짧고 셀 수 있는 행동',unit:'예: 회/회기(40분)'},

function blankStore(){return {version:1,projects:[],settings:fillQabfDefaults({qabfItems:{}}),ui:{}};}
function loadStore(){
  try{
    const raw=localStorage.getItem(LS_KEY);syncedRaw=raw;
    if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.projects)){s.settings=s.settings||{};s.settings.qabfItems=s.settings.qabfItems||{};fillQabfDefaults(s.settings);s.projects.forEach(ensureProject);return s;}}

    localStorage.setItem(LS_KEY+':probe','1');localStorage.removeItem(LS_KEY+':probe');
  }catch(e){storageOK=false;firstRun=true;}
  return blankStore();
}
function defaultData(key){

    case 'rating':return {scale:'',when:'',scores:'',memo:'',type:'',purpose:'',raters:[],rows:[],target:'',funcs:[],funcNote:'',diff:'',cautions:'',retestDate:'',retestNote:'',files:[]};

    default:{const o={};(MEMO_FIELDS[key]||[]).forEach(f=>o[f[0]]='');return o;}

function ensureProject(p){
  p.procs=p.procs||{};
  PROCS.forEach(x=>{
    const s=p.procs[x.key]=p.procs[x.key]||{status:'none',updatedAt:null,completedAt:null,data:null};

    s.data=Object.assign(def,s.data||{});

/* ---------- 여러 탭(창) 동시 사용: 3자 병합 ----------
   base = 이 탭이 마지막으로 맞춘 저장 내용, mine = 이 탭의 현재 자료, theirs = 다른 탭이 저장한 내용.
   한쪽만 바꾼 값은 바뀐 쪽을, 양쪽이 같은 값을 바꿨으면 이 탭 것을 쓴다.
   id가 있는 객체 배열(프로젝트·관찰지·행·QABF 양식)은 id로 맞춰 합치므로 서로 추가한 항목이 모두 남는다.
   mine의 객체는 그 자리에서 고치므로(같은 객체 유지) 화면·손글씨 칸이 들고 있는 참조가 끊기지 않는다. */
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const sameJ=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b);
const isIdArr=v=>Array.isArray(v)&&v.every(x=>isObj(x)&&typeof x.id==='string');
function merge3(base,mine,theirs){
  if(isObj(mine)&&isObj(theirs)){
    const b=isObj(base)?base:{};
    for(const k of Object.keys(theirs)){
      if(!(k in mine)){if(!(k in b)||!sameJ(b[k],theirs[k]))mine[k]=theirs[k];}/* 다른 탭에서 새로 생긴 칸 (이 탭이 지운 칸은 그쪽이 안 바꿨으면 지운 채로) */
      else mine[k]=merge3(b[k],mine[k],theirs[k]);
    }
    for(const k of Object.keys(mine))if(!(k in theirs)&&(k in b)&&sameJ(b[k],mine[k]))delete mine[k];/* 다른 탭에서 지운 칸 */
    return mine;
  }
  if(isIdArr(mine)&&isIdArr(theirs)&&mine.length+theirs.length>0){
    const bm=new Map((isIdArr(base)?base:[]).map(x=>[x.id,x]));
    const mm=new Map(mine.map(x=>[x.id,x])),tm=new Map(theirs.map(x=>[x.id,x]));
    const out=[];
    const keep=(id)=>{
      const m=mm.get(id),t=tm.get(id),bb=bm.get(id);
      if(m&&t)return merge3(bb,m,t);
      if(m)return !bb||!sameJ(bb,m)?m:null;/* 다른 탭에서 지웠고 이 탭은 안 고쳤으면 지운다 */
      return !bb||!sameJ(bb,t)?t:null;/* 이 탭에서 지웠고 다른 탭은 안 고쳤으면 지운다 */
    };
    const seen=new Set();
    /* 순서: 이 탭 순서를 따르고, 다른 탭에만 있는 항목은 그 앞 항목 뒤에 끼운다 */
    const order=[];mine.forEach(x=>order.push(x.id));
    theirs.forEach((x,i)=>{if(mm.has(x.id))return;let j=-1;for(let q=i-1;q>=0;q--){j=order.indexOf(theirs[q].id);if(j>=0)break;}order.splice(j+1,0,x.id);});
    order.forEach(id=>{if(seen.has(id))return;seen.add(id);const v=keep(id);if(v)out.push(v);});
    if(mine.length===out.length&&out.every((x,i)=>x===mine[i]))return mine;
    mine.length=0;out.forEach(x=>mine.push(x));return mine;/* 배열도 같은 객체 유지 */
  }
  if(sameJ(base,mine))return theirs;
  return mine;
}

function absorbRemote(raw){

    const db=await this.open();

  },

  },
  del(id){return this.run('readwrite',s=>s.delete(id));},
  async delByProject(pid){

if(!GROW_CSS){new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1)growAll(n.tagName==='TEXTAREA'?n.parentNode:n);}).observe(document.body,{childList:true,subtree:true});addEventListener('resize',()=>growAll(main));}
function go(view,opts){
  Object.assign(ui,{view},opts||{});
  ui.confirm=null;ui.optsEdit=null;ui.qItemsOpen=false;ui.micHelp='';
  render();window.scrollTo(0,0);
}
function renderCrumbs(){
  const c=$('#crumbs');const p=curProject();
  if(ui.view==='home'){c.innerHTML='<span class="here">행동 관찰 기록장</span>';return;}
  let h='<button type="button" data-act="go-home">프로젝트 목록</button><span class="sep">›</span>';
  const code=esc(p.code||'(코드 없음)');const cat=ui.cat&&CAT[ui.cat];
  if(ui.view==='project'&&!cat)h+=`<span class="here mono">${code}</span>`;
  else if(ui.view==='project')h+=`<button type="button" data-act="go-project" class="mono">${code}</button><span class="sep">›</span><span class="here">${esc(cat.title)}</span>`;
  else h+=`<button type="button" data-act="go-project" class="mono">${code}</button><span class="sep">›</span><button type="button" data-act="open-cat" data-key="${cat.key}">${esc(cat.title)}</button><span class="sep">›</span><span class="here">${esc(PROC[ui.proc].title)}</span>`;
  c.innerHTML=h;
}
function confirmBox(msg,act,id,extra){
  return `<div class="confirm" role="alert"><p>${msg}</p><div class="row"><button type="button" class="btn small danger-solid" data-act="${act}" data-id="${esc(id)}" ${extra||''}>삭제</button><button type="button" class="btn small" data-act="ask-cancel">취소</button></div></div>`;
}
function chip(g,v,on,color){return `<button type="button" class="chip c-${color}${on?' on':''}" data-act="chip" data-g="${g}" data-v="${esc(v)}" aria-pressed="${on}">${esc(v)}</button>`;}

/* home */

  <section>
    <p class="eyebrow">긍정적 행동지원 · 기능적 행동평가</p>
    <h1>행동 관찰 기록장</h1>
    <p class="lede">학생별 프로젝트로 기록</p>
  </section>
  <section class="card">
    <h2 class="h3">새 프로젝트</h2>
    <form id="new-form" class="new-form" novalidate>
      <label class="field"><span>학생 코드</span><input id="new-code" autocomplete="off" maxlength="40" placeholder="예: 3-2-A"></label>
      <label class="field grow"><span>메모 <small>(선택)</small></span><input id="new-memo" autocomplete="off" maxlength="120" placeholder="예: 3학년, 2학기 국어 시간 관찰"></label>
      <button class="btn primary" type="submit">만들기</button>
    </form>

  </section>
  <section class="card tools">
    <div><h2 class="h3">전체 백업</h2><p class="hint">전체 내보내기·불러오기</p></div>
    <div class="tool-row">
      <label class="check"><input type="checkbox" id="all-audio" checked> 녹음 포함</label>
      <button type="button" class="btn" data-act="export-all">전체 백업 내보내기</button>
      <label class="btn">백업 불러오기<input type="file" accept=".json,application/json" id="import-file" hidden></label>
    </div>
  </section>`;
}
function projCard(p){
  const done=PROCS.filter(x=>p.procs[x.key].status==='done').length;
  const name=p.procs.define.data.name;
  return `<article class="proj-card">
    <header class="proj-top"><h3 class="mono">${esc(p.code||'(코드 없음)')}</h3>${p.example?'<span class="pill muted">예시</span>':''}${p.shared?'<span class="pill">공유</span>':''}</header>
    <p class="proj-target">${name?'표적행동 · '+esc(name):'<span class="muted">표적행동 미정</span>'}</p>
    ${p.memo?`<p class="proj-memo">${esc(p.memo)}</p>`:''}
    <div class="dots" role="img" aria-label="${PROCS.length}개 절차 중 ${done}개 완료">${PROCS.map(x=>`<span class="dot s-${p.procs[x.key].status}" title="${esc(x.title)}: ${statusInfo(p.procs[x.key]).label}"></span>`).join('')}</div>
    ${projShareLine(p)}
    <p class="meta">완료 ${done}/${PROCS.length} · 최근 수정 ${p.updatedAt?fmtShort(p.updatedAt):'-'}<br>마지막 백업 ${p.lastBackupAt?relDays(p.lastBackupAt):'아직 없음'}</p>
    <div class="card-actions">
      <button type="button" class="btn primary small" data-act="open-proj" data-id="${p.id}">열기</button>
      <button type="button" class="btn small" data-act="dup-proj" data-id="${p.id}">복제</button>
      <button type="button" class="btn small ghost danger" data-act="ask" data-key="del-proj:${p.id}">삭제</button>
    </div>
    ${ui.confirm==='del-proj:'+p.id?confirmBox(p.shared&&p.shared.role==='owner'?`<b>${esc(p.code)}</b> 공유 프로젝트를 삭제합니다. 함께 쓰는 사람들의 기기에서도 이 프로젝트가 지워집니다. 되돌릴 수 없습니다.`:p.shared?`<b>${esc(p.code)}</b> 프로젝트를 이 기기에서만 지웁니다. 다른 사람의 기기와 서버 자료는 그대로입니다.`:`<b>${esc(p.code)}</b> 프로젝트의 기록과 녹음을 모두 삭제합니다. 되돌릴 수 없습니다.`,'del-proj',p.id):''}
  </article>`;
}

/* 소유자에게만: 이 프로젝트를 공유받은 사람(소유자 본인 제외) */
function projShareInner(p){
  const list=Sync.mem&&Sync.mem.get(p.shared.projectId);
  if(!list)return `<span class="muted">${Sync.user?'공유 인원 불러오는 중':'로그인하면 공유 인원 표시'}</span>`;
  const ms=list.filter(m=>m.role!=='owner').sort((a,b)=>String(a.joinedAt||'').localeCompare(String(b.joinedAt||'')));
  if(!ms.length)return '<span class="muted">아직 공유받은 사람 없음</span>';
  return `<span class="sub-label">공유받은 사람 ${ms.length}명</span>${ms.map(m=>`<span class="chip-m" title="${m.joinedAt?esc(fmtShort(m.joinedAt))+' 참여':''}">${esc(m.name||'이름 없음')}</span>`).join('')}`;
}
function projShareLine(p){
  if(!p.shared||p.shared.role!=='owner'||(!SYNC_ON&&!window.__pbsSyncAdapter))return '';
  return `<p class="proj-share" data-share-pid="${esc(p.shared.projectId)}">${projShareInner(p)}</p>`;
}
function syncRefreshShareLines(){
  if(ui.view!=='home')return;
  document.querySelectorAll('[data-share-pid]').forEach(el=>{const p=store.projects.find(x=>x.shared&&x.shared.projectId===el.dataset.sharePid);if(p)el.innerHTML=projShareInner(p);});
}

/* project */
function viewProject(p){
  if(ui.cat&&CAT[ui.cat])return viewCat(p,CAT[ui.cat]);
  return `
  <section>
    <p class="eyebrow">학생 프로젝트</p>
    <h1 class="mono" id="proj-title">${esc(p.code||'(코드 없음)')}</h1>
    ${p.memo?`<p class="lede" id="proj-memo-view">${esc(p.memo)}</p>`:''}
  </section>
  ${syncConflictCard(p)}
  <section>
    <div class="sec-head"><h2 class="h3">관찰 절차</h2><p class="hint">영역을 골라 절차 열기</p></div>
    <div class="cat-grid">${CATS.map(c=>catCard(p,c)).join('')}</div>
  </section>
  ${syncProjectCard(p)}
  <section class="card tools">
    <div><h2 class="h3">이 프로젝트 백업</h2><p class="hint">마지막 백업: ${p.lastBackupAt?fmtDT(p.lastBackupAt):'아직 없음'}</p></div>
    <div class="tool-row">
      <label class="check"><input type="checkbox" id="proj-audio" checked> 녹음 포함</label>
      <button type="button" class="btn" data-act="export-proj">백업 내보내기</button>

    <summary>프로젝트 정보 수정</summary>

function catCard(p,c){
  const done=c.procs.filter(k=>p.procs[k].status==='done').length;
  return `<button type="button" class="cat-card" data-act="open-cat" data-key="${c.key}">
    <span class="cat-top"><span class="cat-no">${c.no}</span><span class="cat-title">${esc(c.title)}</span><span class="cat-count">완료 ${done}/${c.procs.length}</span></span>
    <span class="cat-desc">${esc(c.desc)}</span>
    <span class="cat-procs">${c.procs.map(k=>{const x=PROC[k];const s=p.procs[k];return `<span class="cat-proc"><span class="dot s-${s.status}" aria-hidden="true"></span><span class="mono">${x.no}</span> ${esc(x.title)}<span class="sr-only"> · ${statusInfo(s).label}</span></span>`;}).join('')}</span>
  </button>`;
}
function viewCat(p,c){
  return `
  <section>
    <p class="eyebrow"><span class="mono">${esc(p.code||'(코드 없음)')}</span> · 관찰 절차</p>
    <h1>${esc(c.title)}</h1>
    <p class="lede">${esc(c.desc)}</p>
  </section>
  <nav class="cat-tabs" aria-label="절차 영역">${CATS.map(x=>`<button type="button" class="cat-tab${x.key===c.key?' on':''}" data-act="open-cat" data-key="${x.key}" aria-current="${x.key===c.key?'page':'false'}"><span class="mono">${x.no}</span> ${esc(x.title)}</button>`).join('')}</nav>
  ${syncConflictCard(p)}
  <section>
    <div class="proc-grid">${c.procs.map(k=>procCard(p,PROC[k])).join('')}</div>
  </section>`;
}
function procCard(p,x){
  const s=p.procs[x.key];const st=statusInfo(s);
  return `<button type="button" class="proc-card s-${s.status}" data-act="open-proc" data-key="${x.key}">
    <span class="proc-no" aria-label="권장 순서 ${x.no}">${x.no}</span>
    <span class="proc-title">${esc(x.title)}</span>
    <span class="proc-desc">${esc(x.desc)}</span>
    <span class="proc-foot"><span class="status ${st.cls}">${st.label}</span>${st.detail?`<span class="proc-detail">${st.detail}</span>`:''}${x.basic?'<span class="basic-tag">기본 메모</span>':''}</span>
  </button>`;
}

/* procedure wrapper */
function viewProc(p,key){
  const x=PROC[key];const s=p.procs[key];
  if(s&&s.status==='done')doneSnapSet(p,key);/* 지금 보이는 완료 내용을 기준으로 삼는다(예전 자료·다른 기기 수정 포함) */
  let body;
  switch(key){
    case 'profile':body=viewProfile(p);break;
    case 'define':body=viewDefine(p);break;
    case 'qabf':body=viewQabf(p);break;
    case 'abc':body=viewAbc(p);break;
    case 'hypo':body=viewHypo(p);break;
    case 'rating':body=viewRating(p);break;
    case 'baseline':body=viewBaseline(p);break;
    case 'intervene':body=viewIntervene(p);break;
    case 'evaluate':body=viewEvaluate(p);break;
    default:body=viewMemo(p,key);
  }
  return `
  <section class="proc-head">
    <div style="min-width:0;flex:1 1 300px"><p class="eyebrow"><span class="mono">${esc(p.code)}</span> · 권장 순서 ${x.no}</p><h1>${esc(x.title)}</h1>${key==='hypo'?(store.settings.hypoLedeHidden?'<p class="lede"><button type="button" class="btn small ghost lede-toggle" data-act="hy-lede">설명 보기</button></p>':`<p class="lede">${x.lede} <button type="button" class="btn small ghost lede-toggle" data-act="hy-lede">접기</button></p>`):`<p class="lede">${x.lede}</p>`}</div>
    <div id="status-slot">${statusPill(s)}</div>
  </section>
  ${key!=='define'&&key!=='profile'?targetBanner(p):''}
  ${body}
  <section class="card done-bar" id="done-bar">${doneBar(s)}</section>`;
}
function statusPill(s){const st=statusInfo(s);return `<span class="status ${st.cls}">${st.label}</span>`;}
function doneBar(s){
  if(s.status==='done')return `<p>완료 ${fmtDT(s.completedAt)}${isEdited(s)?` · 완료 후 수정 ${fmtDT(s.updatedAt)}`:''}</p><button type="button" class="btn" data-act="undone">진행 중으로 되돌리기</button>`;
  return `<p>${s.status==='none'?'아직 시작 전':s.completedAt?(curProject()&&curProject().shared?'완료해야 공유됨':'완료 후 수정 중'):'자동 저장 중'}</p><button type="button" class="btn primary" data-act="done">이 절차 완료</button>`;
}
function refreshStatus(p){
  const s=p.procs[ui.proc];if(!s)return;
  const a=$('#status-slot');if(a)a.innerHTML=statusPill(s);
  const b=$('#done-bar');if(b)b.innerHTML=doneBar(s);
}
function targetBanner(p){
  const d=p.procs.define.data;
  if(!d.name&&!d.definition)return `<div class="target-banner empty"><span>표적행동이 아직 정의되지 않았습니다.</span><button type="button" class="btn small" data-act="open-proc" data-key="define">표적행동 정의 열기</button></div>`;
  return `<div class="target-banner"><span class="tb-label">표적행동</span><div style="min-width:0;flex:1"><strong>${esc(d.name||'(이름 없음)')}</strong>${d.stage&&d.stage!=='확정'?`<span class="stage-tag">${esc(d.stage)}</span>`:''}${d.definition?`<p>${esc(d.definition)}</p>`:''}</div></div>`;
}

/* 0. profile (학생 기본 정보)
   칸 data-f: 'prof:칸', 목록 'pfl:prefs|history:id:칸'. 이름 칸은 두지 않고 프로젝트의 학생 코드를 보여 준다.
   선호(강화제 후보) prefs[{id,kind,what,note}], 지원 이력 history[{id,what,when,effect,note}] 은 id 목록(공유 동기화 호환). */
const PF_CLASS=['일반학급','특수학급','통합학급(시간제)','특수학교','기타'];
const PF_COMM=['말','몸짓·손짓','그림카드','AAC 기기','글','수어','기타'];
const PF_PREF_KINDS=['','물건','활동','음식','칭찬·관심 방식','사람','감각','기타'];
const PF_EFFECTS=['','효과 있음','일부 효과','효과 없음','오히려 나빠짐','모름'];
function pfNew(kind){return kind==='prefs'?{id:uid('pp'),kind:'',what:'',note:''}:{id:uid('ph'),what:'',when:'',effect:'',note:''};}
function pfFix(o,kind){const d=pfNew(kind);for(const k in d)if(k!=='id'&&o[k]==null)o[k]=d[k];return o;}
function pfIn(id,f,v,ph,o){o=o||{};return `<label class="field${o.cls?' '+o.cls:''}"><span>${o.label}${o.small?` <small>${o.small}</small>`:''}</span>${o.area?`<textarea id="pf-${id}" data-f="${f}" rows="${o.rows||2}" placeholder="${esc(ph||'')}">${esc(v)}</textarea>`:o.type?`<input type="${o.type}" id="pf-${id}" data-f="${f}" value="${esc(v)}" placeholder="${esc(ph||'')}">`:`<textarea rows="1" class="one" id="pf-${id}" data-f="${f}" placeholder="${esc(ph||'')}">${esc(v)}</textarea>`}</label>`;}
function pfF(d,k,label,ph,o){return pfIn(k,'prof:'+k,d[k],ph,Object.assign({label},o||{}));}
function pfSel(id,f,opts,v,label){return `<label class="field"><span>${label}</span><select id="pf-${id}" data-f="${f}">${opts.map(x=>`<option value="${esc(x)}"${v===x?' selected':''}>${esc(x||'선택')}</option>`).join('')}</select></label>`;}
function pfPrefRow(r,i){
  const k=`prefs:${r.id}`;
  return `<div class="r-row" id="pfr-${r.id}"><div class="r-row-head"><b>선호 ${i+1}</b><button type="button" class="btn small ghost danger" data-act="ask" data-key="del-pf:${k}">삭제</button></div>
    <div class="r-grid score">${pfSel(r.id+'-kind',`pfl:${k}:kind`,PF_PREF_KINDS,r.kind,'종류')}
      ${pfIn(r.id+'-what',`pfl:${k}:what`,r.what,'예: 공룡 스티커, 컴퓨터 5분',{label:'무엇',cls:'wide2'})}
      ${pfIn(r.id+'-note',`pfl:${k}:note`,r.note,'예: 줄 때 바로 효과, 자주 주면 질림',{label:'메모',cls:'wide2'})}</div>
    ${ui.confirm==='del-pf:'+k?confirmBox('이 선호 항목을 삭제합니다.','del-pf',k):''}</div>`;
}
function pfHistRow(r,i){
  const k=`history:${r.id}`;
  return `<div class="r-row" id="pfr-${r.id}"><div class="r-row-head"><b>지원 ${i+1}</b><button type="button" class="btn small ghost danger" data-act="ask" data-key="del-pf:${k}">삭제</button></div>
    <div class="r-grid score">${pfIn(r.id+'-what',`pfl:${k}:what`,r.what,'예: 토큰판, 자리 배치 바꾸기',{label:'써 본 중재·지원',cls:'wide2'})}
      ${pfIn(r.id+'-when',`pfl:${k}:when`,r.when,'예: 2025년 2학기, 3주',{label:'시기·기간'})}
      ${pfSel(r.id+'-effect',`pfl:${k}:effect`,PF_EFFECTS,r.effect,'효과')}
      ${pfIn(r.id+'-note',`pfl:${k}:note`,r.note,'예: 처음엔 좋았으나 보상이 늦어지자 효과 줄어듦',{label:'잘된 점 · 안 된 점',cls:'wide2'})}</div>
    ${ui.confirm==='del-pf:'+k?confirmBox('이 지원 이력을 삭제합니다.','del-pf',k):''}</div>`;
}
function viewProfile(p){
  const d=p.procs.profile.data;
  return `
  <section class="card pf-privacy"><p><b>개인정보 주의</b> 민감 정보는 필요할 때만</p></section>
  <section class="card">
    <h2 class="h3">1. 기본 정보</h2>
    <p class="pf-code">학생 코드 <b class="mono">${esc(p.code||'(코드 없음)')}</b> <small class="muted">정보 수정에서 변경</small></p>
    <div class="three">${pfF(d,'grade','학년 · 반','예: 3학년 2반')}${pfF(d,'age','나이','예: 9세')}${pfF(d,'gender','성별','')}</div>
    <fieldset class="field"><legend>학급 형태</legend><div class="chips">${PF_CLASS.map(x=>chip('pfclass',x,d.classType===x,'b')).join('')}</div></fieldset>
    ${pfF(d,'classNote','통합 시간 · 학급 메모','예: 국어·수학은 특수학급, 나머지는 통합학급')}

/* 다른 절차 화면에서 보는 학생 기본 정보 요약 (가설·중재 계획) */
function pfPrefText(r){return [r.what,r.kind?`(${r.kind})`:''].filter(x=>String(x||'').trim()).join(' ');}
function pfRef(p,kind){
  const d=p.procs.profile.data;const t=v=>String(v||'').trim();
  const prefs=d.prefs.filter(r=>t(r.what));
  const rows=kind==='hypo'
    ?[['알려진 촉발 요인',d.triggers],['싫어하는 것',d.dislikes],['어려워하는 과제 · 상황',d.hard],['감각 특성',d.sensory],['건강상 주의점',d.health],['의사소통',[d.comm.join(', '),d.commNote].filter(t).join(' · ')]]
    :[['잘하는 것',d.strengths],['좋아하는 활동 · 과목',d.likes],['잘 맞는 교수 방법',d.teach],['싫어하는 것',d.dislikes],['의사소통',[d.comm.join(', '),d.commNote].filter(t).join(' · ')]];
  const hist=d.history.filter(r=>t(r.what));
  const items=rows.filter(r=>t(r[1])).map(([l,v])=>`<p><b>${esc(l)}</b> ${esc(v)}</p>`);
  if(prefs.length)items.push(`<p><b>선호(강화제 후보)</b> ${prefs.map(r=>esc(pfPrefText(r))).join(', ')}</p>`);
  if(kind!=='hypo'&&hist.length)items.push(`<p><b>써 본 지원</b> ${hist.map(r=>esc(r.what)+(r.effect?` <span class="muted">(${esc(r.effect)})</span>`:'')).join(', ')}</p>`);
  const body=items.length?items.join(''):'<p class="muted">학생 기본 정보가 아직 비어 있습니다.</p>';
  return `<details class="card pf-ref"${items.length?' open':''}><summary>학생 기본 정보에서 <small>${kind==='hypo'?'촉발·어려움·감각·건강':'강점·선호·써 본 지원'}</small></summary>
    <div class="sum-box">${body}</div>
    <div class="row">${kind==='plan'&&prefs.length?'<button type="button" class="btn small" data-act="pf-fill">선호를 후속결과 칸에 넣기</button>':''}<button type="button" class="btn small ghost" data-act="open-proc" data-key="profile">학생 기본 정보 열기</button></div></details>`;
}

/* 1. define */
function measureTip(d){const g=MEASURE_GUIDE[d.measure];return g?esc(g.tip):'';}
/* 정의 점검 자동 경고: 칸이 비었거나 마음 상태를 추측하는 말이 있으면 알려 준다 */
function defWarnings(d){
  const w={};
  if(!String(d.definition||'').trim())w[0]='조작적 정의가 아직 비어 있습니다.';
  if(!d.measure)w[1]='예정 측정 방법을 아직 고르지 않았습니다.';
  if(!String(d.boundary||'').trim())w[2]='경계 사례 규칙이 비어 있으면 관찰자마다 판단이 달라질 수 있습니다.';
  const miss=[!String(d.start||'').trim()&&'시작 기준',!String(d.end||'').trim()&&'종료 기준'].filter(Boolean);
  if(miss.length)w[3]=miss.join('과 ')+'이 비어 있습니다.';
  const txt=[d.name,d.definition,d.start,d.end].join(' ');
  const hit=MIND_WORDS.filter(x=>txt.includes(x));
  if(hit.length)w[4]=`마음 상태를 추측하는 말이 있습니다: ${hit.map(x=>'‘'+x+'’').join(', ')}`;
  return w;
}
function refreshDefine(p){
  const d=p.procs.define.data;const w=defWarnings(d);
  DEF_CHECKS.forEach((c,i)=>{const el=$('#defwarn-'+i);if(el)el.textContent=w[i]?'⚠ '+w[i]:'';});
  const c=$('#check-count');if(c){const n=Object.keys(w).length;c.textContent=`${d.checks.length}/${DEF_CHECKS.length} 확인${n?` · 경고 ${n}`:''}`;}
  const t=$('#measure-tip');if(t)t.innerHTML=measureTip(d);
  const u=$('#def-unit');if(u){const g=MEASURE_GUIDE[d.measure];u.placeholder=g?g.unit:'측정 방법을 먼저 고르세요';}
  const st=$('#stage-tip');if(st)st.textContent=DEF_STAGE_TIP[d.stage]||'';
}

function viewQabf(p){
  const q=p.procs.qabf.data;const f=activeForm(p);
  const tabs=q.forms.map(fm=>`<button type="button" class="tab${f&&fm.id===f.id?' on':''}" data-act="qform" data-id="${fm.id}">${esc(fm.rater||'응답자 미입력')}<small>${esc([fm.role,fm.date?fm.date.slice(5).replace('-','/'):''].filter(Boolean).join(' · ')||' ')}</small></button>`).join('');
  return `

function qItemRow(f,n){

function qResult(f){
  const sc=qabfScores(f);const ans=qAnswered(f);const max=Math.max.apply(null,sc.map(s=>s.total));
  const tops=sc.filter(s=>s.total===max&&max>0);
  let line;
  if(!ans)line='문항에 응답하면 하위척도 점수가 계산됩니다.';
  else if(!tops.length)line='모든 하위척도가 0점입니다.';
  else line=`가장 높은 척도: ${tops.map(s=>s.name).join(', ')} (${max}점)`;
  return `<div class="sec-head"><h2 class="h3">결과</h2><span class="meta">${ans<25?`미응답 ${25-ans}문항`:'25문항 모두 응답'}</span></div>

  </div>`).join('')}</div>

}
function qCompare(forms){
  const all=forms.map(f=>qabfScores(f));
  const maxes=all.map(sc=>Math.max.apply(null,sc.map(s=>s.total)));
  return `<section class="card"><h2 class="h3">응답자별 비교</h2><div class="table-wrap"><table>

    <tbody>${QABF_SCALES.map((s,i)=>`<tr><td>${s.name}</td>${all.map((sc,j)=>`<td class="num${sc[i].total===maxes[j]&&maxes[j]>0?' top':''}">${sc[i].total}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></section>`;
}

/* 4. ABC */
function abcData(p){return p.procs.abc.data;}
function sheetById(p,id){return abcData(p).sheets.find(x=>x.id===id)||null;}
function activeSheet(p){const s=abcData(p).session;if(!s||!s.running)return null;return sheetById(p,s.activeSheetId);}
function isActive(p,sh){const s=abcData(p).session;return !!(s&&s.running&&s.activeSheetId===sh.id);}
function byStart(x,y){return (x.start||'').localeCompare(y.start||'');}
function sessionSheets(p,sid){return abcData(p).sheets.filter(x=>x.sessionId===sid).sort(byStart);}
function sheetNo(p,sh){return sessionSheets(p,sh.sessionId).indexOf(sh)+1;}
function rangeText(sh){return `${fmtTime(sh.start)} ~ ${fmtTime(sh.endedAt||sh.end)}`;}
function msLeft(sh){return Math.max(0,Date.parse(sh.end)-Date.now());}
function rowFilled(r){return !!(r.time||r.a.trim()||r.b.trim()||r.c.trim());}
/* 화면·내보내기용: 시각이 있는 행은 시각 순, 시각이 없는 행은 그 뒤에 적은 순서대로 (저장 순서는 그대로 둠) */
function sortedRows(sh){
  return sh.rows.map((r,i)=>[r,i]).sort((x,y)=>{const a=x[0].time,b=y[0].time;
    if(a&&b)return Date.parse(a)-Date.parse(b)||x[1]-y[1];if(a)return -1;if(b)return 1;return x[1]-y[1];}).map(x=>x[0]);
}
/* 화면의 행 순서를 시각 순으로 다시 맞춘다 (입력 중인 칸·스크롤 위치는 유지) */
function reorderRows(sh){
  const box=$('#rows-'+sh.id);if(!box)return;
  const want=sortedRows(sh).map(r=>'rw-'+r.id);
  const have=Array.from(box.children).filter(x=>x.classList.contains('abc-tr')).map(x=>x.id);
  if(want.join()===have.join())return;
  keepView(()=>{want.forEach(id=>{const el=document.getElementById(id);if(el)box.appendChild(el);});});
}
function allRows(p){const out=[];abcData(p).sheets.forEach(sh=>sh.rows.forEach(r=>{if(rowFilled(r))out.push(r);}));return out;}
function onAbcPage(p){return !!(p&&ui.view==='proc'&&ui.proc==='abc'&&ui.projectId===p.id);}
function timeOnDay(baseISO,v){
  if(!v)return null;
  const [h,m,sec]=v.split(':').map(Number);if(isNaN(h))return null;
  const d=new Date(baseISO);d.setHours(h,m||0,sec||0,0);return d.toISOString();
}

/* 24시간 표기 시각 칸 (브라우저의 오전/오후 표시 대신). sec=true면 초까지 */
const CLOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function t24(attrs,val,sec,label){
  return `<span class="t24"><input type="tel" inputmode="numeric" autocomplete="off" class="t24-in" data-t24="${sec?'s':'m'}" ${attrs} value="${esc(val||'')}" placeholder="${sec?'--:--:--':'--:--'}" maxlength="11" aria-label="${esc(label)} (24시간)"><button type="button" class="t24-pick" data-act="t24-pick" tabindex="-1" title="시간 설정">${CLOCK_SVG}<span>시간 설정</span></button><input type="time" class="t24-native"${sec?' step="1"':''} tabindex="-1" aria-hidden="true"></span>`;
}
/* "1625", "16:25", "162530", "4:25 오후" 등을 {h,m,s}로 */
function parseClock24(v){
  v=String(v||'').trim().toLowerCase();if(!v)return null;
  const pm=/오후|pm/.test(v),am=/오전|am/.test(v);
  v=v.replace(/오전|오후|am|pm/g,'').replace(/[시분]/g,':').replace(/초/g,'').replace(/[.\s]+/g,':').replace(/:+/g,':').replace(/^:|:$/g,'');
  let h,m,sc=0;
  if(/^\d+$/.test(v)){
    if(v.length<=2){h=+v;m=0;}else if(v.length<=4){h=+v.slice(0,-2);m=+v.slice(-2);}else if(v.length<=6){h=+v.slice(0,-4);m=+v.slice(-4,-2);sc=+v.slice(-2);}else return null;
  }else{const q=v.split(':');if(q.length<2||q.length>3||q.some(x=>!/^\d{1,2}$/.test(x)))return null;h=+q[0];m=+q[1];sc=q[2]?+q[2]:0;}
  if(pm&&h<12)h+=12;if(am&&h===12)h=0;
  if(h>23||m>59||sc>59)return null;
  return {h,m,s:sc};
}
function fmtClock24(c,sec){return pad(c.h)+':'+pad(c.m)+(sec?':'+pad(c.s):'');}

function pastView(p){

async function hydrateAudio(){
  for(const box of $$('[data-audio]')){
    const id=box.dataset.audio;const au=box.querySelector('audio');
    if(!au||au.src)continue;
    let url=urlCache.get(id);
    if(!url&&audioOK){try{const r=await AudioDB.getBlob(id);if(r){url=URL.createObjectURL(r.blob);urlCache.set(id,url);}}catch(e){}}
    if(url)au.src=url;
    else if(au.isConnected){const s=document.createElement('span');s.className='missing';const cp=curProject();s.textContent=cp&&cp.shared?'다른 기기에 있는 파일입니다. 녹음은 공유되지 않아 녹음한 기기에서만 들을 수 있습니다.':'이 브라우저에 녹음 파일이 없습니다. 녹음을 뺀 백업을 불러왔거나 다른 기기에서 녹음한 경우입니다.';au.replaceWith(s);}
  }
}

/* 5. hypothesis
   가설 1은 예전처럼 hypo.data 칸에 두고(경로가 바뀌지 않게), 가설 2부터는 hypo.data.more(id 목록)에 둔다.
   화면 키: 가설 1 = 'm', 그 밖 = 항목 id. 입력칸 data-f: 가설 1 'hypo:칸', 그 밖 'hyx:id:칸' */
const HY_VERIFY=['추가 관찰','기능분석'];
const QABF_FUNC={att:'관심 얻기',esc:'과제·요구 피하기',non:'감각 자극 얻기',phy:'신체적 불편 줄이기',tan:'물건·활동 얻기'};
const FUNC_STEM={'관심 얻기':'관심을 얻','과제·요구 피하기':'과제·요구를 피하','물건·활동 얻기':'물건·활동을 얻','감각 자극 얻기':'감각 자극을 얻','신체적 불편 줄이기':'신체적 불편을 줄이'};
/* ABC 후속결과 낱말 → 기능(처음 맞는 것 하나). 반응 없음·신체적 제지·자리 이동은 기능을 정하기 어려워 세지 않는다 */
const C_FUNC=[[/중단|제거|면제|미루|늦춰|피하|빼 ?주|그만/,'과제·요구 피하기'],[/관심|꾸중|이름|부름|칭찬|훈계|달래|쳐다|또래 반응|웃음/,'관심 얻기'],[/선호물|물건|활동 제공|간식|장난감|허락/,'물건·활동 얻기']];
function hyNew(){return {id:uid('hy'),setting:'',when:'',cons:'',funcs:[],funcOther:'',evidence:'',confidence:'',verify:[],verifyNote:''};}
function hyFix(h){const d=hyNew();for(const k in d)if(k!=='id'&&h[k]==null)h[k]=d[k];['funcs','verify'].forEach(k=>{if(!Array.isArray(h[k]))h[k]=[];});return h;}
function hyData(p,k){const d=p.procs.hypo.data;if(!k||k==='m')return d;return (d.more||[]).find(x=>x.id===k)||null;}
function hyAnalysis(p){
  const sums={};p.procs.qabf.data.forms.forEach(f=>qabfScores(f).forEach(s=>{sums[s.key]=(sums[s.key]||0)+s.total;}));
  const qmax=Math.max(0,...Object.values(sums));
  const qF=qmax>0?QABF_SCALES.filter(s=>sums[s.key]===qmax).map(s=>QABF_FUNC[s.key]):[];
  const rows=allRows(p);const cnt={};
  rows.forEach(r=>{const seen=new Set();String(r.c||'').split(/[,，;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(v=>{const m=C_FUNC.find(([re])=>re.test(v));if(m)seen.add(m[1]);});seen.forEach(f=>{cnt[f]=(cnt[f]||0)+1;});});
  const cmax=Math.max(0,...Object.values(cnt));
  const cF=cmax>0?FUNCS.filter(f=>cnt[f]===cmax):[];
  const common=qF.filter(f=>cF.includes(f));
  return {qF,qmax,cF,cmax,nRows:rows.length,common,state:!qF.length||!cF.length?'lack':common.length?'match':'mismatch'};
}
function hyMatchView(p){
  const a=hyAnalysis(p);const q=a.qF.map(f=>`「${f}」`).join(' · '),c=a.cF.map(f=>`「${f}」`).join(' · ');
  let pill,msg;
  if(a.state==='match'){pill='<span class="pill ok">일치</span>';msg=`QABF와 ABC 후속결과가 모두 ${a.common.map(f=>`「${f}」`).join(' · ')}를 가리킵니다. 이 기능으로 가설을 세우세요.`;}
  else if(a.state==='mismatch'){pill='<span class="pill warn">불일치</span>';msg=`QABF는 ${q}, ABC 후속결과는 ${c}를 가리킵니다. 관찰을 더 하거나 기능분석을 고려하세요.`;}
  else{
    pill='<span class="pill muted">판단 보류</span>';
    const miss=[];if(!a.qF.length)miss.push('QABF 점수');if(!a.cF.length)miss.push(a.nRows?'기능을 읽을 수 있는 ABC 후속결과(예: 과제 중단, 관심 제공)':'ABC 기록');
    msg=`${miss.join('와 ')}가 아직 없어 두 자료를 비교할 수 없습니다.${a.qF.length?` QABF는 ${q}를 가리킵니다.`:''}${a.cF.length?` ABC 후속결과는 ${c}를 가리킵니다.`:''}`;
  }
  return `<div class="hy-match" id="hy-match">${pill}<p>${msg}<br><small class="muted">최고 점수·최다 건수 비교</small></p></div>`;
}
function hyEvidenceText(p){
  const out=[];
  p.procs.qabf.data.forms.forEach(f=>{const sc=qabfScores(f);const mx=Math.max.apply(null,sc.map(s=>s.total));const tops=sc.filter(s=>s.total===mx&&mx>0);
    if(tops.length)out.push(`QABF(${f.rater||'응답자 미입력'}) ${tops.map(s=>s.name).join('·')} ${mx}점`);});
  const abc=allRows(p);
  if(abc.length){
    const tA=tally(abc,'a').slice(0,3),tC=tally(abc,'c').slice(0,3);const j=t=>t.map(([k,v])=>`${k} ${v}`).join(', ');
    out.push(`ABC ${abc.length}건: ${[tA.length?'선행사건 '+j(tA):'',tC.length?'후속결과 '+j(tC):''].filter(Boolean).join(' / ')||'내용 없음'}`);
  }
  const a=hyAnalysis(p);
  if(a.state==='match')out.push(`두 자료 모두 「${a.common.join('·')}」를 가리킴`);
  else if(a.state==='mismatch')out.push(`두 자료가 가리키는 기능이 다름(QABF ${a.qF.join('·')}, ABC ${a.cF.join('·')})`);
  return out.length?out.join('. ')+'.':'';
}

    <label class="field"><span>배경사건 <small>행동을 부르는 조건</small></span><textarea rows="1" class="one" id="${I('setting')}" data-f="${F('setting')}" placeholder="예: 잠이 부족한 날, 아침에 가정에서 갈등이 있었던 날">${esc(h.setting||'')}</textarea></label>
    <label class="field"><span>어떤 상황에서 <small>직접 선행사건</small></span><textarea rows="1" class="one" id="${I('when')}" data-f="${F('when')}" placeholder="예: 국어 시간에 학습지를 받았을 때">${esc(h.when||'')}</textarea></label>
    ${beh}
    <label class="field"><span>어떤 결과가 따르나 <small>행동을 유지시키는 후속결과</small></span><textarea rows="1" class="one" id="${I('cons')}" data-f="${F('cons')}" placeholder="예: 교사가 학습지를 거두어 과제가 중단된다">${esc(h.cons||'')}</textarea></label>
    <fieldset class="field"><legend>추정 기능</legend><div class="chips">${FUNCS.map(v=>chip(G('func'),v,funcs.includes(v),'b')).join('')}${showOther?'':`<button type="button" class="chip c-b hy-other-btn" data-act="hy-other" data-id="${k}">기타…</button>`}</div>
      ${showOther?`<textarea rows="1" class="one" id="${I('funcOther')}" data-f="${F('funcOther')}" placeholder="기타 기능 (직접 입력)" aria-label="기타 기능">${esc(h.funcOther||'')}</textarea>`:''}</fieldset>
    <div class="hypo-preview" id="hypo-preview-${k}">${hypoSentence(p,h)}</div>
    <div class="field"><label class="field"><span>근거</span><textarea id="${I('evidence')}" data-f="${F('evidence')}" rows="3" placeholder="예: QABF 도피·회피 13점, ABC 4건 중 3건에서 과제 제시 뒤 발생하고 과제가 중단됨">${esc(h.evidence||'')}</textarea></label>
      <div class="row"><button type="button" class="btn small" data-act="hy-fill" data-id="${k}">자료 요약 넣기</button><small class="muted">근거 끝에 요약 덧붙임</small></div></div>

      <textarea rows="1" class="one" id="${I('verifyNote')}" data-f="${F('verifyNote')}" placeholder="예: 다음 주 국어 시간 3회 더 관찰, 과제 제시 조건 비교" aria-label="검증 계획 메모">${esc(h.verifyNote||'')}</textarea></fieldset>`:''}

function viewHypo(p){

}
/* 가설 문장: "배경·상황, 학생은 「행동」 행동을 한다. 그러면 결과. 따라서 이 행동은 ~하기 위해 나타나는 것으로 보인다." 빈 칸은 문장에서 빼고 아래에 안내 */
function hypoSentence(p,h){
  const md=p.procs.hypo.data;h=h||md;
  const b=(md.behavior||'').trim()||(p.procs.define.data.name||'').trim();
  const lead=[(h.setting||'').trim(),(h.when||'').trim()].filter(Boolean).join(' ');
  const c=(h.cons||'').trim().replace(/[.。]+$/,'');
  const fs=(h.funcs||[]).filter(f=>FUNC_STEM[f]);const fo=(h.funcOther||'').trim();
  const out=[`${lead?esc(lead)+', ':''}학생은 「${esc(b||'표적행동')}」 행동을 한다.`];
  if(c)out.push(`그러면 ${esc(c)}.`);
  if(fs.length||fo){
    const known=fs.length?fs.map(f=>FUNC_STEM[f]).join('거나 ')+'기':'';
    out.push(known?`따라서 이 행동은 ${known} 위해${fo?`(기타: ${esc(fo)})`:''} 나타나는 것으로 보인다.`:`따라서 이 행동은 「${esc(fo)}」 기능을 위해 나타나는 것으로 보인다.`);
  }
  const miss=[];if(!b)miss.push('표적행동 이름');if(!lead)miss.push('상황');if(!c)miss.push('결과');if(!fs.length&&!fo)miss.push('추정 기능');
  return out.join(' ')+(miss.length?`<small class="hy-miss">더 채울 칸: ${miss.join(', ')}</small>`:'');
}

/* 2. baseline (기초선 측정)
   회기 기록은 id 목록: 기초선 = baseline.data.sessions, 중재 = intervene.data.sessions (항목: date·time·mins·setting·value·observer·note).
   입력칸 data-f: 기초선 칸 'base:칸', 회기 'ses:bl|iv:id:칸'. 측정 방법·단위는 표적행동 정의에서 가져온다. */
const BL_MIN=3,BL_GOOD=5,BL_BAND=0.25;/* 최소·권장 회기 수, 안정 범위(중앙값 ±25%) */
const BL_DIRS=['줄이기','늘리기'];
function blNew(prev){return {id:uid('bs'),date:ymdLocal(),time:'',mins:prev?prev.mins:'',setting:prev?prev.setting:'',value:'',observer:prev?prev.observer:'',note:''};}
function blFix(s){const d=blNew();for(const k in d)if(k!=='id'&&s[k]==null)s[k]=d[k];return s;}
function sesList(p,ph){return ph==='iv'?p.procs.intervene.data.sessions:p.procs.baseline.data.sessions;}
function sesProc(ph){return ph==='iv'?'intervene':'baseline';}
function blNum(v){const s=String(v==null?'':v).trim().replace(',','.');if(!s)return null;const n=Number(s);return isFinite(n)?n:null;}
/* 날짜·시간 순(같으면 입력 순) */
function blSorted(list){return list.map((s,i)=>[s,i]).sort((a,b)=>(a[0].date||'9999').localeCompare(b[0].date||'9999')||(a[0].time||'').localeCompare(b[0].time||'')||a[1]-b[1]).map(x=>x[0]);}
function blVals(list){return blSorted(list).map(s=>blNum(s.value)).filter(v=>v!=null);}
function rnd(n){return Math.round(n*10)/10;}
function blStats(vals){
  const n=vals.length;if(!n)return {n:0};
  const mean=vals.reduce((a,b)=>a+b,0)/n;const so=vals.slice().sort((a,b)=>a-b);
  const median=n%2?so[(n-1)/2]:(so[n/2-1]+so[n/2])/2;
  const within=median?vals.filter(v=>Math.abs(v-median)<=median*BL_BAND).length/n:vals.filter(v=>v===0).length/n;
  let trend='';
  if(n>=4){const h=Math.floor(n/2);const m1=vals.slice(0,h).reduce((a,b)=>a+b,0)/h;const m2=vals.slice(n-h).reduce((a,b)=>a+b,0)/h;
    const ref=Math.max(median,mean,1);const rel=(m2-m1)/ref;trend=rel>=BL_BAND?'up':rel<=-BL_BAND?'down':'flat';}
  return {n,mean,median,min:so[0],max:so[n-1],within,trend};
}
function blDir(p){return p.procs.baseline.data.dir||'줄이기';}
/* 기초선 판단: 회기 수 → 추세 → 변동 순으로 하나만 크게 알린다 */
function blJudge(p){
  const st=blStats(blVals(p.procs.baseline.data.sessions));const dec=blDir(p)!=='늘리기';
  if(st.n<BL_MIN)return {cls:'muted',msg:`값이 있는 회기가 ${st.n}개입니다. 기초선은 최소 ${BL_MIN}회기, 가능하면 ${BL_GOOD}회기 이상 측정합니다.`};
  const better=st.trend===(dec?'down':'up'),worse=st.trend===(dec?'up':'down');
  if(better)return {cls:'warn',msg:'중재 없이도 나아지는 추세가 보입니다. 추세가 멈출 때까지 기초선을 더 측정하세요.'};
  if(st.within<0.8)return {cls:'warn',msg:`변동이 큽니다(중앙값 ±25% 안에 ${Math.round(st.within*100)}%). 회기를 더 모으거나, 값이 튄 날의 상황 차이를 메모로 확인하세요.`};
  if(worse)return {cls:'ok',msg:'점점 나빠지는 추세입니다. 바로 중재를 시작해도 되는 근거가 됩니다.'};
  if(st.n<BL_GOOD)return {cls:'muted',msg:`지금까지는 안정적입니다. ${BL_GOOD}회기까지 채우면 더 믿을 만합니다.`};
  return {cls:'ok',msg:'값이 안정적입니다. 기초선을 확정하고 중재를 시작해도 됩니다.'};
}
const TREND_TXT={up:'증가',down:'감소',flat:'뚜렷하지 않음','':'4회기부터 판단'};
function blStatPills(st,unit){
  if(!st.n)return '';

  return `<div class="bl-stats"><span><b>${st.n}</b>회기</span><span>평균 <b>${rnd(st.mean)}</b>${u}</span><span>중앙값 <b>${rnd(st.median)}</b></span><span>범위 <b>${rnd(st.min)}–${rnd(st.max)}</b></span><span>안정 범위 안 <b>${Math.round(st.within*100)}%</b></span><span>추세 <b>${TREND_TXT[st.trend]}</b></span></div>`;

/* 회기별 꺾은선 그래프(SVG). 기초선(A)과 중재(B)는 선을 잇지 않고 단계 구분선으로 나눈다 */
function blChart(p,withB){
  const unit=p.procs.define.data.unit||'';const bd=p.procs.baseline.data;
  const A=blSorted(bd.sessions).filter(s=>blNum(s.value)!=null);
  const B=withB?blSorted(p.procs.intervene.data.sessions).filter(s=>blNum(s.value)!=null):[];
  if(!A.length&&!B.length)return '<p class="rows-empty">값을 적으면 그래프 표시</p>';
  const all=A.concat(B);const N=all.length;
  const st=blStats(A.map(s=>blNum(s.value)));const goal=blNum(bd.goal);
  let top=Math.max(1,...all.map(s=>blNum(s.value)),goal||0);
  const step=top<=5?1:top<=10?2:top<=25?5:top<=50?10:Math.pow(10,Math.floor(Math.log10(top)))*(top/Math.pow(10,Math.floor(Math.log10(top)))>5?2:1);
  top=Math.ceil(top/step)*step;
  const W=640,H=250,L=44,R=16,T=26,Bm=34;const pw=W-L-R,ph=H-T-Bm;
  const x=i=>L+(N===1?pw/2:pw*(i+0.5)/N),y=v=>T+ph-(v/top)*ph;
  let g='';
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="bl-grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="bl-tick">${rnd(v)}</text>`;
  const ev=Math.max(1,Math.ceil(N/12));
  all.forEach((s,i)=>{if(i%ev===0||i===N-1)g+=`<text x="${x(i)}" y="${H-Bm+18}" text-anchor="middle" class="bl-tick">${i+1}</text>`;});
  g+=`<text x="${W-R}" y="${H-4}" text-anchor="end" class="bl-tick">회기</text>`;
  if(unit)g+=`<text x="${L}" y="14" class="bl-tick">${esc(unit)}</text>`;
  const ax=A.length?x(A.length-1):L;
  if(st.n&&!withB&&st.median>0)g+=`<rect x="${L}" width="${pw}" y="${y(Math.min(top,st.median*(1+BL_BAND)))}" height="${Math.max(0,y(Math.max(0,st.median*(1-BL_BAND)))-y(Math.min(top,st.median*(1+BL_BAND))))}" class="bl-band"><title>안정 범위: 중앙값 ±25%</title></rect>`;
  if(st.n){const xe=withB&&B.length?W-R:(A.length?Math.max(ax+12,W-R):W-R);g+=`<line x1="${L}" x2="${xe}" y1="${y(st.mean)}" y2="${y(st.mean)}" class="bl-mean"/><text x="${xe}" y="${y(st.mean)-6}" text-anchor="end" class="bl-lab">기초선 평균 ${rnd(st.mean)}</text>`;}
  if(goal!=null){g+=`<line x1="${withB&&A.length&&B.length?(ax+x(A.length))/2:L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" class="bl-goal"/><text x="${W-R}" y="${y(goal)+15}" text-anchor="end" class="bl-lab">목표 ${rnd(goal)}</text>`;}
  if(A.length&&B.length){const px=(ax+x(A.length))/2;g+=`<line x1="${px}" x2="${px}" y1="${T-8}" y2="${T+ph}" class="bl-phase"/><text x="${px-6}" y="${T-12}" text-anchor="end" class="bl-lab">기초선(A)</text><text x="${px+6}" y="${T-12}" class="bl-lab">중재(B)</text>`;}
  const line=(list,off,cls)=>{if(!list.length)return '';const pts=list.map((s,i)=>`${x(i+off)},${y(blNum(s.value))}`).join(' ');
    return `<polyline points="${pts}" class="bl-line ${cls}"/>`+list.map((s,i)=>`<g class="bl-pt"><circle cx="${x(i+off)}" cy="${y(blNum(s.value))}" r="12" class="bl-hit"/><circle cx="${x(i+off)}" cy="${y(blNum(s.value))}" r="4.5" class="bl-dot ${cls}"/><title>${cls==='b'?'중재':'기초선'} ${i+off+1}회기 · ${esc((s.date||'').slice(5).replace('-','/'))}${s.setting?' · '+esc(s.setting):''}: ${rnd(blNum(s.value))}${unit?' '+esc(unit):''}</title></g>`).join('');};
  g+=line(A,0,'a')+line(B,A.length,'b');
  const lab=`회기별 그래프: 기초선 ${A.length}회기${st.n?` 평균 ${rnd(st.mean)}`:''}${B.length?`, 중재 ${B.length}회기`:''}${goal!=null?`, 목표 ${rnd(goal)}`:''}`;
  return `<svg class="bl-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lab)}">${g}</svg>`;
}

function blCompare(p){
